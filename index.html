<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Go Kendra">
<title>Go Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#161B33;--ink2:#3D4466;--ink3:#7B82A0;--ink4:#B8BCCD;
  --bg:#F5F2FF;--card:#FFFFFF;--raised:#EDE8FF;--div:rgba(137,86,255,.10);
  --pu:#8956FF;--pud:#6B35E8;--pul:#EDE8FF;--pum:#D2BFFF;
  --te:#2ebfa5;--tel:#e4f7f4;
  --am:#D4920A;--aml:#FDF5E0;
  --ro:#E8546A;--rol:#FDEEF1;
  --bl:#4A7DFF;--bll:#EAF0FF;
  --sg:#3A9E78;--sgl:#E8F7F1;
  --m0:#E8546A;--m0l:#FDEEF1;
  --m1:#D4920A;--m1l:#FDF5E0;
  --m2:#7B82A0;--m2l:#EEF0F6;
  --m3:#2ebfa5;--m3l:#e4f7f4;
  --m4:#3A9E78;--m4l:#E8F7F1;
  --sh1:0 1px 2px rgba(22,27,51,.06),0 2px 8px rgba(137,86,255,.06);
  --sh2:0 4px 16px rgba(137,86,255,.10);
  --sh3:0 8px 32px rgba(22,27,51,.14);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer}
input,textarea{font-family:var(--sans)}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px}
.serif{font-family:var(--serif)}
.italic{font-style:italic}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--div);box-shadow:var(--sh1);margin-bottom:12px}
.card-flush{background:var(--card);border-radius:16px;border:1px solid var(--div);overflow:hidden;box-shadow:var(--sh1);margin-bottom:12px}
.row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--div);gap:12px}
.row:last-child{border-bottom:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:none;border-radius:999px;padding:0 24px;font-size:15px;font-weight:600;transition:transform .12s;user-select:none;white-space:nowrap;width:100%}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#fff}
.btn-pu{background:var(--pul);color:var(--pud);border:1.5px solid var(--pum)}
.btn-out{background:var(--card);color:var(--ink);border:1.5px solid var(--div)}
.btn-te{background:var(--te);color:#fff}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-auto{width:auto}
.inp{width:100%;height:50px;padding:0 16px;background:var(--raised);border:1.5px solid rgba(90,60,150,.18);border-radius:10px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--pu);background:var(--card)}
textarea.inp{height:auto;padding:12px 16px;resize:none}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--div);display:flex;z-index:100;padding:8px 0 env(safe-area-inset-bottom,14px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:8px 4px;font-size:11px;font-weight:600;color:var(--ink3);transition:color .15s;min-height:48px;justify-content:center}
.nb.on{color:var(--pu)}
.nb i{font-size:19px}
.nb.on i{color:var(--pu)}
.ph{padding:16px 16px 12px;background:var(--card);border-bottom:1px solid var(--div);position:sticky;top:0;z-index:50}
.stabs{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--div)}
.stabs::-webkit-scrollbar{display:none}
.stab{height:34px;padding:0 16px;border-radius:999px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink2);flex-shrink:0;transition:all .15s}
.stab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mood-row{display:flex;gap:8px;margin-bottom:16px}
.mo{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:2px solid var(--div);background:var(--card);cursor:pointer;transition:all .15s;min-height:76px;justify-content:center}
.mo .dot{width:20px;height:20px;border-radius:50%;transition:all .15s}
.mo .lbl{font-size:11px;font-weight:600;color:var(--ink3)}
.mo.on{border-color:var(--mc)}
.mo.on .dot{width:26px;height:26px;box-shadow:0 0 0 4px rgba(0,0,0,.08)}
.mo.on .lbl{font-weight:700;color:var(--mc)}
.tog{position:relative;width:52px;height:30px;flex-shrink:0;cursor:pointer}
.tog input{opacity:0;width:0;height:0}
.tt{position:absolute;inset:0;background:#ddd;border-radius:999px;transition:.25s}
.tt::before{content:"";position:absolute;width:24px;height:24px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input:checked+.tt{background:var(--pu)}
input:checked+.tt::before{transform:translateX(22px)}
.chip{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink2)}
.chip.on{background:var(--pu);border-color:var(--pu);color:#fff}
.chip:active{transform:scale(.95)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bb{padding:8px 4px;border-radius:12px;border:1.5px solid var(--div);background:var(--card);cursor:pointer;text-align:center;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;font-family:var(--serif);font-size:20px;color:#a0522d}
.bb .bl{font-size:10px;color:var(--ink2);font-weight:600}
.bb.on{border-color:#a0522d;background:#fdf5ef}
.drops{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.drop{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;opacity:.2;transition:all .15s}
.drop.on{opacity:1;background:var(--tel)}
.drop i{font-size:20px;color:var(--te)}
.drop:active{transform:scale(.85)}
.cal-strip{display:flex;overflow-x:auto;gap:8px;padding:4px 2px 8px;scrollbar-width:none}
.cal-strip::-webkit-scrollbar{display:none}
.cd{min-width:56px;border-radius:12px;padding:8px 4px;text-align:center;border:1.5px solid var(--div);background:var(--card);cursor:pointer;flex-shrink:0;transition:all .15s}
.cd.tod{border-color:var(--pu);background:var(--pul)}
.cd.has{border-color:var(--te)}
.cd.chm{border-color:var(--ro);background:var(--rol)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:4px}
.dot5{width:5px;height:5px;border-radius:50%}
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;padding:12px 0;position:relative}
.tli::before{content:"";position:absolute;left:15px;top:40px;bottom:-12px;width:1px;background:var(--div)}
.tli:last-child::before{display:none}
.tld{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.tlb{flex:1;min-width:0}
.tlt{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.5px;margin-bottom:2px}
.tll{font-size:14px;font-weight:600;margin-bottom:2px}
.tls{font-size:12px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:10px;border:1px solid var(--div);padding:10px 8px;text-align:center;box-shadow:var(--sh1)}
.st .si{font-size:16px;color:var(--ink3);margin-bottom:4px;display:block}
.st .sv{font-size:16px;font-weight:700;display:block}
.st .ss{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-top:1px}
.st.ok .si,.st.ok .sv{color:var(--pu)}
.prog{height:4px;border-radius:999px;background:var(--raised);overflow:hidden;margin-top:4px}
.pf{height:100%;border-radius:999px;transition:width .4s}
.cban{border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.cbar{height:4px;border-radius:999px;background:rgba(0,0,0,.12);overflow:hidden;flex:1}
.cbf{height:100%;border-radius:999px}
#cin{position:fixed;inset:0;background:rgba(26,15,46,.45);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;max-width:430px;left:50%;transform:translateX(-50%)}
#cin-sh{background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.34,1.56,.64,1)}
.wo-fs{min-height:calc(100vh - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;text-align:center;color:#fff;position:relative}
.tr{width:180px;height:180px;border-radius:50%;border:6px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.1);margin:24px auto}
.tt2{font-family:var(--serif);font-size:52px;line-height:1;letter-spacing:-1px}
.tl2{font-size:12px;opacity:.7;font-weight:600;margin-top:4px}
.wp{width:100%;height:3px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-bottom:24px}
.wpf{height:100%;background:#fff;border-radius:999px;transition:width .4s}
.fpills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.fp{height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.fp:active{transform:scale(.95)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty-s{text-align:center;padding:48px 16px}
.empty-s i{font-size:32px;color:var(--ink4);margin-bottom:12px;display:block}
.badge-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bc{border-radius:16px;padding:14px;border:1.5px solid var(--div);text-align:center;background:var(--card)}
.bc.e{border-color:var(--am);background:var(--aml)}
.cheer-c{background:var(--pul);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--pum)}
.peep-ph{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:14px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb5{margin-bottom:24px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:24px}
.px{padding-left:16px;padding-right:16px}
.sec{margin-top:24px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink3)}
.flex{display:flex}.fca{align-items:center}.fjb{justify-content:space-between}.g3{gap:12px}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:500;z-index:9999;white-space:nowrap;display:none;box-shadow:var(--sh3)}
#toast.show{display:block;animation:ta 2.8s ease forwards}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.fi{animation:fadeIn .22s ease}

.nb svg{stroke:currentColor;display:block;}
.nb.on svg{stroke:var(--pu);}
.btn svg{vertical-align:middle;flex-shrink:0;}

/* ── CONFETTI ─────────────────────────────────────────── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.cp{position:absolute;top:-10px;border-radius:2px;animation:cpFall linear forwards;}
@keyframes cpFall{
  0%  {transform:translateY(0) rotate(0deg) scale(1);opacity:1}
  80% {opacity:1}
  100%{transform:translateY(100vh) rotate(720deg) scale(.6);opacity:0}
}
</style>
</head>
<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="width:40px;height:40px;border-radius:50%;border:3px solid var(--pu);border-top-color:transparent;animation:pulse 1s linear infinite;"></div></div></div>
<div id="toast"></div>
<div id="nav" style="display:none">
  <button class="nb" data-t="home"  onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Today</button>
  <button class="nb" data-t="log"   onclick="go('log')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Log</button>
  <button class="nb" data-t="train" onclick="go('train')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Train</button>
  <button class="nb" data-t="cal"   onclick="go('cal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Calendar</button>
  <button class="nb" data-t="squad" onclick="go('squad')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Squad</button>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────
var PW_PATIENT = "gokendra";  // Kendra + Naur
var PW_CARE    = "careteam";   // Care team — medical portal
var PW_FRIENDS = "gopeeps";    // Friends — cheer + wishlist
var WISHLIST_URL = "";         // Paste Amazon wishlist URL here
var LC_DATE  = localStorage.getItem('gk-lc') || "2026-05-07";
var NC_DATE  = localStorage.getItem('gk-nc') || "2026-05-25";

// ── CONSTANTS ──────────────────────────────────────────
var MC  = ['#c95068','#c9920a','#7b8fa8','#2ebfa5','#4a8c6f'];
var MCL = ['#faedf0','#fdf5e0','#edf0f4','#e4f7f4','#e8f4ee'];
var ML  = ['Rough','Low','Okay','Good','Great'];
var FOOD = ["Eggs","Pancakes","Chicken","Mac and cheese","Toast","Oatmeal","Banana","Soft egg","Yogurt","French toast","Mashed potato","Broth","Fruit","Cottage cheese","Pudding","Cream of wheat"];
var BRIT = [{n:1,l:"Pebbles"},{n:2,l:"Lumpy"},{n:3,l:"Cracked"},{n:4,l:"Smooth"},{n:5,l:"Soft"},{n:6,l:"Fluffy"},{n:7,l:"Watery"}];
var DTAG = [{id:"spicy",l:"Spicy"},{id:"grumbles",l:"Grumbles"},{id:"shart",l:"Shart oops"},{id:"urgent",l:"Urgent"},{id:"winner",l:"Solid W"}];
var MOB = [
  {n:"Ankle circles",dur:30,u:"sec",note:"both sides",tip:"slow and steady"},
  {n:"Heel slides",r:10,u:"reps",note:"each leg",tip:"hold 2 sec at top"},
  {n:"Seated leg raises",r:10,u:"reps",note:"each leg",tip:"controlled"},
  {n:"Hip circles",r:10,u:"reps",note:"each direction",tip:"let those hips go"},
  {n:"Shoulder rolls",r:10,u:"reps",note:"each direction",tip:"nice and gentle"},
  {n:"Neck rolls",r:5,u:"reps",note:"each side",tip:"slow only"},
  {n:"Wrist circles",r:10,u:"reps",note:"each direction",tip:"almost done"}
];
var STR = [
  {n:"Bicep curls",s:3,r:10,note:"right arm focus",tip:"water bottle works"},
  {n:"Shoulder press",s:3,r:8,note:"both arms light",tip:"slow and controlled"},
  {n:"Lateral raises",s:3,r:10,note:"both arms",tip:"no higher than shoulder"},
  {n:"Tricep extensions",s:3,r:10,note:"overhead",tip:"keep core soft"},
  {n:"Seated rows",s:3,r:10,note:"right arm focus",tip:"squeeze shoulder blades"},
  {n:"Shoulder squeezes",s:3,r:10,note:"hold 2 sec",tip:"pencil between them"},
  {n:"Calf raises",s:3,r:15,note:"sitting ok",tip:"you got this"},
  {n:"Standing marches",dur:30,u:"sec",note:"hold IV pole",tip:"almost done, so proud"}
];
var BDGS = [
  {ico:"droplet",  color:"#8956FF", n:"The OG Pewp",         d:"First bowel movement",            e:true},
  {ico:"droplets", color:"#4A7DFF", n:"Tinkle Queen",         d:"First spontaneous tinkle",            e:true},
  {ico:"sparkles", color:"#2ebfa5", n:"Free as a Bird",       d:"NGT removed — no more nose tube",  e:true},
  {ico:"circlecheck",color:"#3A9E78",n:"No Pump No Problem",  d:"Off the PCA pump entirely",        e:true},
  {ico:"sun",      color:"#D4920A", n:"Vitamin D",            d:"Made it outside",                  e:true},
  {ico:"utensils", color:"#E8546A", n:"Pancake Legend",       d:"Those chocolate banana pancakes",  e:true},
  {ico:"activity", color:"#8956FF", n:"Step Queen",           d:"10k steps in the hospital",        e:true},
  {ico:"circlecheck",color:"#3A9E78",n:"Solid Gold",          d:"Kept a meal down",                 e:false},
  {ico:"droplet",  color:"#4A7DFF", n:"Sippin Champion",      d:"8 glasses in a day",               e:false},
  {ico:"dumbbell", color:"#4A7DFF", n:"Sweat Equity",         d:"Completed a strength circuit w/ Peepsi", e:false},
  {ico:"activity", color:"#2ebfa5", n:"Loose & Limber",       d:"Completed a mobility circuit w/ Peepsqueak", e:false},
  {ico:"house",    color:"#8956FF", n:"Hall Monitor",         d:"Walked 2 hallway laps",            e:false},
  {ico:"heart",    color:"#E8546A", n:"Feelin Pewped",        d:"Got through the tough nadir week", e:false},
  {ico:"star",     color:"#D4920A", n:"Full Lap",             d:"Full GemTax cycle done",           e:false},
  {ico:"calendar", color:"#3A9E78", n:"Week Slayed",          d:"Logged 7 days in a row",           e:false},
  {ico:"sparkles", color:"#8956FF", n:"Home Sweet Home",      d:"Discharged — week 1 done",         e:false}
];
var DEFP = {poop:true,detail:false,mood:true,sym:true,food:true,wo:true};
var TODAY = new Date().toISOString().split('T')[0];
var LC = new Date(LC_DATE);
var NC = new Date(NC_DATE);
function recomputeCycleDates(){LC=new Date(localStorage.getItem('gk-lc')||LC_DATE);NC=new Date(localStorage.getItem('gk-nc')||NC_DATE);}

// ── STATE ──────────────────────────────────────────────
var S = {v:'loading',tab:'home',obs:0,user:null,role:'patient',day:null,cheers:[],priv:null,bdgs:[],wo:null,lt:'food',cd:null,calD:{},cin:false,cinD:{mood:null,nausea:null,pain:null,energy:null,notes:''},events:[],addingEvent:false,evDate:null,calMonth:null,labSummaries:[],addingLab:false,foodQ:'',calQ:''};
var selB = null, selT = [];

// ── STORAGE ────────────────────────────────────────────
function lsGet(k){try{var v=localStorage.getItem('gk-'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem('gk-'+k,JSON.stringify(v));}catch(e){}}

function loadAll(){
  S.day = lsGet('day-'+TODAY) || empty();
  if(!Array.isArray(S.day.moods)) S.day.moods = migrateMoods(S.day);
  S.cheers = lsGet('cheers') || [];
  var cfg = lsGet('cfg');
  S.priv = (cfg && cfg.priv) || DEFP;
  S.bdgs = (cfg && cfg.bdgs) || BDGS;
  S.events = lsGet('events') || [];
  S.labSummaries = lsGet('lab-summaries') || [];
}

function saveDay(){
  if(!S.day) return;
  lsSet('day-'+TODAY, S.day);
}
function saveCfg(){
  lsSet('cfg',{priv:S.priv,bdgs:S.bdgs});
}
function loadCalDay(dt){
  if(S.calD[dt]!==undefined) return;
  S.calD[dt] = lsGet('day-'+dt) || null;
}
function addCheer(name,msg){
  var c = {name:name,msg:msg,ts:new Date().toISOString()};

function cycle(){

// ── RENDER ─────────────────────────────────────────────
function R(){
  var app=document.getElementById('app'),nav=document.getElementById('nav');
  if(!app) return;
  if(S.v==='loading'){app.innerHTML=vLoading();nav.style.display='none';return;}
  if(S.v==='pw')    {app.innerHTML=vPw();    nav.style.display='none';return;}
  if(S.v==='ob')    {app.innerHTML=vOb();    nav.style.display='none';return;}
  if(S.role==='care'){nav.style.display='none';app.innerHTML=vCarePortal();return;}
  if(S.role==='friends'){nav.style.display='none';app.innerHTML=vFriendsPortal();return;}
  nav.style.display='flex';
  var nbs=document.querySelectorAll('.nb');
  for(var i=0;i<nbs.length;i++) nbs[i].classList.toggle('on',nbs[i].dataset.t===S.tab);
  var old=document.getElementById('cin');
  if(old) old.remove();
  if(S.cin){
    var el=document.createElement('div');
    el.innerHTML=vCin();
    document.body.appendChild(el.firstChild);
    
    return;
  }
  if(S.wo){app.innerHTML=vWoAct();return;}
  var screens={home:vHome,log:vLog,train:vTrain,cal:vCal,squad:vSquad};
  app.innerHTML=(screens[S.tab]||vHome)();
}

    +'<div class="flex fca" style="gap:10px;"><div style="width:8px;height:8px;border-radius:50%;background:var(--bl);flex-shrink:0;"></div><div style="font-size:13px;color:var(--ink2);"><span style="font-weight:600;">Care team</span> — charts &amp; lab updates</div></div>'

function doLogin(){
  var n=(document.getElementById('nm')||{}).value||'';
  var p=(document.getElementById('pw')||{}).value||'';
  if(!n.trim()){toast('What\'s your name?');return;}
  var pw=p.trim().toLowerCase();
  var role=null;
  if(pw===PW_PATIENT) role='patient';
  else if(pw===PW_CARE) role='care';
  else if(pw===PW_FRIENDS) role='friends';
  if(!role){var e=document.getElementById('err');if(e)e.style.display='block';return;}
  S.role=role;
  S.user={name:n.trim(),role:role,isk:n.toLowerCase().indexOf('kendra')>=0||n.toLowerCase().indexOf('ken')>=0};
  localStorage.setItem('gk-u',JSON.stringify(S.user));
  if(role==='patient'&&S.user.isk&&!localStorage.getItem('gk-ob')){S.v='ob';S.obs=0;}
  else{S.v='app';}
  R();
}

// ── CYCLE-BASED SUGGESTIONS ───────────────────────────
function getCycleSuggestions(){
  var c=cycle(),d=S.day||empty(),evs=eventsForDay(TODAY);
  var hadPara=evs.some(function(e){return e.type==='para';});
  var hadChemo=evs.some(function(e){return e.type==='chemo';});
  var tips=[];
  // Override: paracentesis today
  if(hadPara){
    return [{
      label:'You had a paracentesis today',
      color:'var(--bl)',
      food:['Clear broths','Electrolyte drinks','Pedialyte popsicles','Small soft nibbles'],
      activity:'Rest completely today. No laps, no workout. Let your body stabilize.',
      watch:'Watch for: dizziness when standing, unusual pain at the site, fever over 100.4°F.'
    }];
  }
  // Override: chemo today
  if(hadChemo||c.day===1){
    return [{
      label:'Chemo day',
      color:'var(--ro)',
      food:['Cold foods tolerate better','Small bites every 1-2 hrs','Ginger ale (flat)','Bland starchy foods','Avoid strong smells near food'],
      activity:'Gentle movement only — a slow walk to the window counts.',
      watch:'Nausea peaks 24-72 hrs after infusion. Keep anti-nausea meds close.'
    }];
  }
  // Zone-based
  if(c.day<=3){
    tips=[{
      label:'Rough zone — day '+c.day,
      color:'var(--ro)',
      food:['Flat ginger ale','Crackers or dry toast','Cold foods (easier on nausea)','Pedialyte if not eating much','Small bites only — no big meals'],
      activity:'Rest is the right call today. If you feel up to it, 1 slow lap is plenty.',
      watch:'Nausea usually peaks around day 2-3 then starts easing.'
    }];
  } else if(c.day<=7){
    tips=[{
      label:'Early recovery — day '+c.day,
      color:'var(--am)',
      food:['Eggs, yogurt, soft proteins','Oatmeal or cream of wheat','Banana or mashed potato','Avoid raw veg, spicy, fried'],
      activity:'2 hallway laps is a great goal. Mobility circuit if energy holds.',
      watch:'Counts are dropping this week. Watch for any fever — call if over 100.4°F.'
    }];
  } else if(c.day<=14){
    tips=[{
      label:'Nadir zone — day '+c.day,
      color:'var(--pu)',
      food:['High protein: chicken, eggs, cottage cheese','Cooked veg only','Avoid raw fruit/veg (infection risk)','Small frequent meals'],
      activity:'Keep it gentle — mobility circuit only. No intense exertion.',
      watch:'Lowest immune point. No sick visitors. Wash hands constantly. Any fever = call team immediately.'
    }];
  } else {
    tips=[{
      label:'Building back — day '+c.day,
      color:'var(--sg)',
      food:['More variety — body can handle it','High calorie + high protein','Push fluids','Treat yourself if something sounds good'],
      activity:'Strength circuit is fair game if energy is there. Outdoor walk encouraged.',
      watch:'Counts coming back up. Great time to push movement a bit more.'
    }];
  }
  return tips;
}


function vCycleTipsCard(){
  var tips=getCycleSuggestions();
  if(!tips.length) return '';
  var t=tips[0];
  var foodItems=t.food.map(function(f){return '<li style="font-size:13px;color:var(--ink2);margin-bottom:3px;">'+f+'</li>';}).join('');
  return '<div class="card mb3" style="border-left:3px solid '+t.color+';background:var(--raised);">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'
    +'<div style="width:8px;height:8px;border-radius:50%;background:'+t.color+';flex-shrink:0;"></div>'
    +'<div style="font-family:var(--serif);font-size:15px;color:var(--ink);">'+t.label+'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-bottom:6px;">Eat</div><ul style="padding-left:14px;list-style:disc;">'+foodItems+'</ul></div>'
    +'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-bottom:6px;">Move</div><div style="font-size:13px;color:var(--ink2);line-height:1.5;">'+t.activity+'</div>'
    +(t.watch?'<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-top:8px;margin-bottom:4px;">Watch for</div><div style="font-size:12px;color:var(--ink3);line-height:1.5;">'+t.watch+'</div>':'')+'</div>'
    +'</div></div>';
}

function vHome(){
  var d=S.day||empty(),moods=d.moods||[],lm=latestMood(d),c=cycle(),am=d.meds&&d.meds.am,pm=d.meds&&d.meds.pm,allM=am&&pm;

  var greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  var fN=(d.food||[]).length,hyd=d.hyd||0,wN=(d.wos||[]).length;

  var moodCard;
  if(!moods.length){
    moodCard='<div class="card mb3" style="border:2px dashed var(--pum);background:var(--pul);cursor:pointer;" onclick="openCin()">'
      +'<div class="flex fca g3">'
      +'<div style="width:44px;height:44px;background:var(--pu);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>'
      +'<div><div style="font-family:var(--serif);font-size:16px;color:var(--pud);">How are you feeling right now?</div>'
      +'<div style="font-size:12px;color:var(--ink2);margin-top:2px;">Tap to log your first check-in today</div></div>'
      +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>';
  } else {
    var sparkH=32,sparkW=220,pts='';
    if(moods.length>=2){
      for(var i=0;i<moods.length;i++){
        var x=(i/(moods.length-1))*sparkW;
        var y=sparkH-(moods[i].mood/4)*sparkH;
        pts+=(i?'':'')+x+','+y+' ';
      }
    }
    var sparkSvg='';
    if(moods.length>=2){
      sparkSvg='<svg width="'+sparkW+'" height="'+sparkH+'" viewBox="0 0 '+sparkW+' '+sparkH+'" style="overflow:visible">'
        +'<polyline points="'+pts.trim()+'" fill="none" stroke="'+MC_color(lm.mood)+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        +'</svg>';
    }
    moodCard='<div class="card mb3" style="border-left:4px solid '+MC_color(lm.mood)+';">'
      +'<div class="flex fca" style="gap:12px;">'
      +'<div style="width:12px;height:12px;border-radius:50%;background:'+MC_color(lm.mood)+';flex-shrink:0;"></div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div class="flex fjb fca mb1">'
      +'<div style="font-family:var(--serif);font-size:18px;">'+ML[lm.mood]+'</div>'
      +'<div style="font-size:12px;color:var(--ink3);">'+fmtT(lm.ts)+'</div></div>'
      +(moods.length>=2?'<div style="margin:8px 0;">'+sparkSvg+'</div>':'')
      +'<div style="font-size:12px;color:var(--ink3);">'+moods.length+' check-in'+(moods.length!==1?'s':'')+' today</div>'
      +'</div>'
      +'<button class="btn btn-ink btn-auto btn-sm" onclick="openCin()" style="flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
      +'</div></div>';
  }

  var tlItems='';
  var showM=[].concat(moods).reverse().slice(0,4);
  for(var mi=0;mi<showM.length;mi++){
    var m=showM[mi];
    tlItems+='<div class="tli">'
      +'<div class="tld" style="background:'+MC_bg(m.mood)+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>'
      +'<div class="tlb">'
      +'<div class="tlt">'+fmtT(m.ts)+'</div>'
      +'<div class="tll" style="color:'+MC_color(m.mood)+';">'+ML[m.mood]+'</div>'
      +(m.notes?'<div class="tls" style="font-style:italic;">"'+m.notes+'"</div>':'')
      +'</div></div>';
  }
  var timeline=moods.length?'<div class="sec px"><div class="flex fjb fca mb2"><div class="lbl">Today\'s mood log</div></div><div class="card" style="padding:12px 16px;"><div class="tl">'+tlItems+'</div></div></div>':'';

  return '<div class="fi">'
    +'<div class="ph flex fca fjb">'
    +'<div>'
    +'<div style="font-family:var(--serif);font-size:22px;font-style:italic;">'+greet+'</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-top:1px;">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>'
    +'</div>'
    +'<div style="width:40px;height:40px;">'+SQ+'</div></div>'
    +'<div class="px mt3">'
    +vCycleBanner(c)
    +moodCard
    +(moods.length===0?'<button class="btn btn-ink mb3" onclick="openCin()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Log how I feel right now</button>':'')
    +'<div class="stats mb3">'
    +'<div class="st'+(allM?' ok':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="sv">'+(allM?'Done':((am?1:0)+(pm?1:0))+'/2')+'</span><span class="ss">Meds</span></div>'
    +'<div class="st'+(fN>=3?' ok':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="sv">'+fN+'</span><span class="ss">Nibbles</span></div>'
    +'<div class="st'+(hyd>=8?' ok':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="sv">'+hyd+'</span><span class="ss">Glasses</span></div>'
    +'<div class="st'+(wN>0?' ok':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="sv">'+(wN>0?'Done':'--')+'</span><span class="ss">Train</span></div>'
    +'</div>'
    +'<div class="g2 mb3">'
    +'<button class="btn btn-pu" onclick="go(\'log\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Log today</button>'
    +'<button class="btn btn-pu" onclick="go(\'train\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Train</button>'
    +'</div>'
    +'<button class="btn btn-out mb3" onclick="doExport()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Export for portal</button>'
    +'<div id="exp-out" style="display:none;margin-bottom:16px;"></div>'
    +'</div>'
    +timeline
    +'<div style="text-align:center;padding-bottom:8px;"><button onclick="logOut()" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;">'+ico('logout',12)+' Sign out</button></div>'
    +'<div style="height:24px;"></div></div>';
}

// ── CHECK-IN IN-PLACE UPDATE (no full re-render) ──────
function updateCin(){
  var sh = document.getElementById('cin-sh');
  if(!sh) return;
  var d = S.cinD;
  var mBtns = '';
  for(var i=0;i<ML.length;i++){
    var on=d.mood===i;
    mBtns+='<div class="mo'+(on?' on':'')+'" style="'+(on?'--mc:'+MC[i]+';background:'+MCL[i]+';border-color:'+MC[i]+';':'')+'cursor:pointer;" onclick="setCinMood('+i+')">'
      +'<div class="dot" style="background:'+MC[i]+';'+(on?'width:26px;height:26px;':'')+'"></div>'
      +'<div class="lbl" style="'+(on?'color:'+MC[i]+';font-weight:700;':'')+'">'+ML[i]+'</div></div>';
  }
  var optRow=function(key,label,val){
    var opts=['Bad','Medium','Mild','None'];
    var s='<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+label+'</div><div style="display:flex;gap:8px;">';
    for(var i=0;i<opts.length;i++){
      var on=val===i;
      s+='<div style="flex:1;border-radius:10px;border:1.5px solid '+(on?'var(--pu)':'var(--div)')+';background:'+(on?'var(--pul)':'var(--raised)')+';padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:'+(on?'var(--pud)':'var(--ink3)')+'" onclick="setCinField(''+key+'','+i+')">'+opts[i]+'</div>';
    }
    s+='</div></div>';
    return s;
  };
  sh.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">'
    +'<div style="font-family:var(--serif);font-size:22px;font-style:italic;">How are you feeling?</div>'
    +'<button class="btn btn-out btn-auto btn-sm" onclick="closeCin()" style="width:36px;height:36px;min-height:unset;border-radius:8px;padding:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-bottom:12px;">'+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'</div>'
    +'<div class="mood-row mb4">'+mBtns+'</div>'
    +(d.mood!=null?'<div>'
      +optRow('nausea','Nausea',d.nausea)
      +optRow('pain','Pain',d.pain)
      +optRow('energy','Energy',d.energy)
      +'<div style="margin-top:12px;"><div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">Notes (optional)</div>'
      +'<textarea class="inp" id="cin-notes" rows="2" placeholder="Anything on your mind..." style="height:70px;" oninput="S.cinD.notes=this.value">'+d.notes+'</textarea></div>'
      +'</div>':'')
    +(d.mood!=null?'<button class="btn btn-ink mt4" onclick="saveCin()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Save check-in</button>':'<button class="btn btn-out mt4" style="opacity:.4;cursor:default;">Select a mood above</button>');
  
}
function setCinMood(i){S.cinD.mood=i;updateCin();}
function setCinField(k,v){S.cinD[k]=v;updateCin();}

function openCin(){S.cin=true;S.cinD={mood:null,nausea:null,pain:null,energy:null,notes:''};R();}
function closeCin(){S.cin=false;R();}
function vCin(){
  var d=S.cinD;
  var mBtns='';
  for(var i=0;i<ML.length;i++){
    var on=d.mood===i;
    mBtns+='<div class="mo'+(on?' on':'')+'" style="'+(on?'--mc:'+MC[i]+';background:'+MCL[i]+';border-color:'+MC[i]+';':'')+'cursor:pointer;" onclick="setCinMood('+i+')">'
      +'<div class="dot" style="background:'+MC[i]+';'+(on?'width:26px;height:26px;':'')+'"></div>'
      +'<div class="lbl" style="'+(on?'color:'+MC[i]+';font-weight:700;':'')+'">'+ML[i]+'</div></div>';
  }

  var optRow=function(key,label,val){
    var opts=['Bad','Medium','Mild','None'];
    var s='<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+label+'</div><div style="display:flex;gap:8px;">';
    for(var i=0;i<opts.length;i++){
      var on=val===i;
      s+='<div style="flex:1;border-radius:10px;border:1.5px solid '+(on?'var(--pu)':'var(--div)')+';background:'+(on?'var(--pul)':'var(--card)')+';padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:'+(on?'var(--pud)':'var(--ink3)')+'" onclick="setCinField(''+key+'','+i+')">'+opts[i]+'</div>';
    }
    s+='</div></div>';
    return s;
  };

  return '<div id="cin" onclick="if(event.target===this)closeCin()">'
    +'<div id="cin-sh">'
    +'<div class="flex fjb fca mb5">'
    +'<div style="font-family:var(--serif);font-size:22px;font-style:italic;">How are you feeling?</div>'
    +'<button class="btn btn-out btn-auto btn-sm" onclick="closeCin()" style="width:36px;height:36px;min-height:unset;border-radius:8px;padding:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-bottom:12px;">'+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'</div>'
    +'<div class="mood-row mb4">'+mBtns+'</div>'
    +(d.mood!=null?'<div style="margin-top:4px;">'
      +optRow('nausea','Nausea',d.nausea)
      +optRow('pain','Pain',d.pain)
      +optRow('energy','Energy',d.energy)
      +'<div style="margin-top:12px;"><div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">Notes (optional)</div>'
      +'<textarea class="inp" id="cin-notes" rows="2" placeholder="Anything on your mind..." style="height:70px;" oninput="S.cinD.notes=this.value">'+d.notes+'</textarea></div>'
      +'</div>':'')
    +(d.mood!=null?'<button class="btn btn-ink mt4" onclick="saveCin()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Save check-in</button>':'<button class="btn btn-out mt4" style="opacity:.4;cursor:default;">Select a mood above</button>')
    +'</div></div>';
}
function saveCin(){
  if(S.cinD.mood===null) return;
  S.day=S.day||empty();
  if(!Array.isArray(S.day.moods)) S.day.moods=[];
  var entry={id:Date.now(),ts:new Date().toISOString(),mood:S.cinD.mood,nausea:S.cinD.nausea,pain:S.cinD.pain,energy:S.cinD.energy,notes:S.cinD.notes};
  S.day.moods.push(entry);
  saveDay();S.cin=false;R();
  toast('Check-in saved — '+ML[entry.mood]+' at '+fmtT(entry.ts));
}

// ── LOG ─────────────────────────────────────────────────
function vLog(){
  var tabs=[{id:'food',l:'Food'},{id:'demon',l:'Pewp'},{id:'hyd',l:'Sippin'},{id:'move',l:'Steps'},{id:'meds',l:'Meds'},{id:'proc',l:'Procedures'}];
  var tabHtml='<div class="stabs">';
  for(var i=0;i<tabs.length;i++) tabHtml+='<button class="stab'+(S.lt===tabs[i].id?' on':'')+'" onclick="S.lt=\''+tabs[i].id+'\';R()">'+tabs[i].l+'</button>';
  tabHtml+='</div>';
  var body;
  if(S.lt==='food')  body=vFood();
  else if(S.lt==='demon') body=vDemon();
  else if(S.lt==='hyd')   body=vHyd();
  else if(S.lt==='move')  body=vMove();
  else if(S.lt==='proc') body=vProcs();
  else body=vMeds();

function exD(e){return e.dur||(e.r*3);}
function startWo(type){
  var ex=type==='mobility'?MOB:STR;
  S.wo={type:type,ex:ex,i:0,set:1,ph:'ready',t:0,total:Date.now()};
  S.woi=setInterval(tickWo,1000);R();
}
function beginEx(){if(!S.wo)return;S.wo.ph='work';S.wo.t=exD(S.wo.ex[S.wo.i]);R();}
function tickWo(){
  if(!S.wo||S.wo.ph==='ready') return;
  var w=S.wo;w.t--;
  if(w.t<=0){
    var e=w.ex[w.i];
    if(w.ph==='work'){
      if(e.s&&w.set<e.s){w.ph='rest';w.t=20;}
      else{w.i++;if(w.i>=w.ex.length){doneWo();return;}w.set=1;w.ph='ready';}
    } else {w.set++;w.ph='ready';}
  }
  R();
}
function doneWo(){
  clearInterval(S.woi);
  var dur=Math.round((Date.now()-S.wo.total)/60000),done=S.wo.ex.length,type=S.wo.type;

var CONF_COLORS = ['#8956FF','#D2BFFF','#2ebfa5','#D4920A','#E8546A','#4A7DFF','#ffffff'];
var CONF_SHAPES = ['square','circle','rect'];
function confetti(intensity){
  var n = intensity==='big' ? 80 : 40;
  var wrap = document.createElement('div');
  wrap.className = 'confetti-wrap';
  document.body.appendChild(wrap);
  for(var i=0;i<n;i++){
    (function(delay){
      setTimeout(function(){
        var p = document.createElement('div');
        p.className = 'cp';
        var color = CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)];
        var size = 6 + Math.random()*8;
        var isCircle = Math.random() > 0.6;
        var isRect = !isCircle && Math.random() > 0.5;
        p.style.cssText = 'left:'+Math.random()*100+'%;'
          +'width:'+(isRect?size*0.5:size)+'px;height:'+(isRect?size*1.8:size)+'px;'
          +'background:'+color+';'
          +'border-radius:'+(isCircle?'50%':'2px')+';'
          +'animation-duration:'+(1.4+Math.random()*1.2)+'s;'
          +'animation-delay:0s;';
        wrap.appendChild(p);
      }, delay);
    })(i * 18);
  }
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);}, 3200);
}

function vCal(){
  var now=new Date();
  if(!S.calMonth) S.calMonth={y:now.getFullYear(),m:now.getMonth()};
  var cy=S.calMonth.y,cm=S.calMonth.m;
  var firstDay=new Date(cy,cm,1),lastDay=new Date(cy,cm+1,0);
  var startDow=firstDay.getDay(); // 0=Sun
  var daysInMonth=lastDay.getDate();
  var NCD=NC.toISOString().split('T')[0];
  var monthName=firstDay.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Build 6-row grid
  var cells=[];
  for(var i=0;i<startDow;i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  var gridRows='';
  for(var r=0;r<cells.length/7;r++){
    var row='<div style="display:contents;">';
    for(var c=0;c<7;c++){
      var day=cells[r*7+c];
      if(!day){row+='<div style="min-height:60px;"></div>';continue;}
      var dtStr=cy+'-'+(cm+1<10?'0':'')+(cm+1)+'-'+(day<10?'0':'')+day;
      var isToday=dtStr===TODAY;
      var isChemo=dtStr===NCD;
      var dm=S.calD[dtStr];
      var moods=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);
      var avgMood=moods.length?Math.round(moods.reduce(function(s,m){return s+(m.mood||0);},0)/moods.length):null;
      var dayEvents=eventsForDay(dtStr);

  if(selB===null){toast('Pick a Bristol type first');return;}

function vCarePortal(){
  var c=cycle(),d=S.day||empty(),moods=d.moods||[],lm=latestMood(d);
  var summaries=S.labSummaries||[];
  var latest=summaries.length?summaries[summaries.length-1]:null;

  // Mood trend last 7 days
  var moodRows='';
  var last7=[TODAY];
  for(var i=1;i<7;i++){var d2=new Date();d2.setDate(d2.getDate()-i);last7.push(d2.toISOString().split('T')[0]);}
  last7.reverse();
  var trendDots='';
  for(var i=0;i<last7.length;i++){
    var dt=last7[i],dm=dt===TODAY?d:(S.calD[dt]||null);

    var ms=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);
    var avg=ms.length?Math.round(ms.reduce(function(s,m){return s+(m.mood||0);},0)/ms.length):null;

      +'<div style="width:12px;height:12px;border-radius:50%;background:'+(avg!=null?MC[avg]:'var(--div)')+';">'
      +'</div><div style="font-size:9px;color:var(--ink3);">'+dayLabel+'</div></div>';
  }

      snap+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--div);">'

    +'<div>'

    +'<div style="font-size:12px;color:var(--ink3);margin-top:1px;">Welcome, '+((S.user&&S.user.name)||'')+'</div>'

    +'</div>'
    +'<div style="padding:16px;">'

    // Cycle banner
    +'<div style="background:'+c.bg+';border-radius:10px;padding:12px 16px;margin-bottom:12px;">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'

    +'<div style="font-size:12px;color:var(--ink3);margin-left:auto;">'+c.dtn+'d to next chemo</div>'
    +'</div>'

    // 7-day mood trend
    +'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;">'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:12px;">7-day mood trend</div>'
    +'<div style="display:flex;gap:4px;">'+trendDots+'</div>'
    +'<div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;">'
    +ML.map(function(l,i){return '<span style="display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--ink3);"><span style="width:7px;height:7px;border-radius:50%;background:'+MC[i]+';display:inline-block;"></span>'+l+'</span>';}).join('')
    +'</div></div>'

    // Today snapshot
    +(snap?'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;">'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:4px;">Today&#39;s snapshot</div>'
    +'<div style="font-size:11px;color:var(--ink3);margin-bottom:10px;">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+(lm&&lm.ts?' · last check-in '+fmtT(lm.ts):'')+'</div>'
    +snap+'</div>':'')

    // Stats row
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">'
    +[['Meds',(d.meds&&d.meds.am&&d.meds.pm)?'Both done':((d.meds&&(d.meds.am||d.meds.pm))?'Partial':'None'),(d.meds&&d.meds.am&&d.meds.pm)?'var(--sg)':'var(--am)'],
      ['Hydration',(d.hyd||0)+' / 8 glasses',(d.hyd||0)>=8?'var(--sg)':(d.hyd||0)>=4?'var(--am)':'var(--ink3)'],
      ['Movement',(d.move&&d.move.laps?d.move.laps+' lap'+(d.move.laps!==1?'s':''):'')+(d.move&&d.move.out?' · outside':'') || 'None logged',(d.move&&(d.move.laps>=2||d.move.out))?'var(--sg)':'var(--ink3)']
    ].map(function(row){return '<div style="background:var(--card);border-radius:10px;border:1px solid var(--div);padding:10px 12px;">'
      +'<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:4px;">'+row[0]+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:'+row[2]+';line-height:1.3;">'+row[1]+'</div></div>';}).join('')
    +'</div>'

    // Lab summaries
    +'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);overflow:hidden;margin-bottom:12px;">'
    +'<div style="padding:14px 16px;border-bottom:1px solid var(--div);display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);">Lab Summary</div>'
    +'<button onclick="S.addingLab=!S.addingLab;R()" style="background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--pu);">'+(S.addingLab?'Cancel':'+ Add update')+'</button>'
    +'</div>'

    // Add form
    +(S.addingLab?'<div style="padding:14px 16px;border-bottom:1px solid var(--div);background:var(--raised);">'
    +'<div style="font-size:12px;color:var(--ink2);margin-bottom:8px;line-height:1.5;">Paste your Claude summary below. Use this prompt with Kendra&#39;s lab screenshot:<br><br>'
    +'<span style="font-family:monospace;font-size:11px;color:var(--ink3);background:var(--bg);padding:6px 8px;border-radius:6px;display:block;line-height:1.7;">'
    +'I'm uploading lab results for Kendra, a 34-year-old woman with peritoneal EHE on Gemcitabine + Docetaxel. She has a PICC-associated DVT, low albumin, and is on methadone for pain. Summarize in 3 sections: (1) What's flagged — plain English, her context not generic; (2) What this week will likely feel like physically; (3) How to support her right now — 3-5 specific actionable things. Warm, direct, no jargon without explanation.'
    +'</span></div>'
    +'<textarea class="inp" id="lab-text" rows="6" placeholder="Paste Claude&#39;s summary here..." style="height:120px;font-size:13px;"></textarea>'
    +'<button class="btn btn-ink mt3" onclick="saveLabSummary()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Save</button>'
    +'</div>':'')

    // Summaries list
    +(summaries.length===0&&!S.addingLab?'<div style="padding:24px 16px;text-align:center;"><div style="font-size:13px;color:var(--ink3);">No lab summaries yet. Add one above.</div></div>':'')
    +[].concat(summaries).reverse().slice(0,5).map(function(s,i){
      return '<div style="padding:14px 16px;'+(i>0?'border-top:1px solid var(--div);':'')+'">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
        +'<div style="font-size:12px;font-weight:700;color:var(--ink2);">'+new Date(s.ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div>'
        +'<button onclick="deleteLabSummary(''+s.id+'')" style="background:none;border:none;cursor:pointer;color:var(--ink3);padding:2px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
        +'</div>'
        +'<div style="font-size:13px;color:var(--ink);line-height:1.7;white-space:pre-wrap;">'+s.text+'</div>'
        +'</div>';
    }).join('')
    +'</div>'

    +'<div style="height:24px;"></div></div></div>';
}

function saveLabSummary(){
  var el=document.getElementById('lab-text');
  if(!el||!el.value.trim()){toast('Nothing to save');return;}
  var entry={id:Date.now(),ts:new Date().toISOString(),text:el.value.trim()};
  S.labSummaries=(S.labSummaries||[]).concat(entry);
  lsSet('lab-summaries',S.labSummaries);
  S.addingLab=false;
  R();
  toast('Lab summary saved');
}
function deleteLabSummary(id){
  S.labSummaries=(S.labSummaries||[]).filter(function(s){return String(s.id)!==String(id);});
  lsSet('lab-summaries',S.labSummaries);
  R();
}

// ══════════════════════════════════════════════════════
// FRIENDS / SUPPORT PORTAL
// ══════════════════════════════════════════════════════
function vFriendsPortal(){
  var d=S.day||empty(),p=S.priv||DEFP,lm=latestMood(d),moods=d.moods||[];
  var c=cycle();

  // Only what Kendra chose to share
  var shareItems=[];
  if(p.mood&&lm&&lm.mood!=null) shareItems.push({label:'Vibe today',val:ML[lm.mood],color:MC_color(lm.mood)});
  if(p.food&&d.food&&d.food.length) shareItems.push({label:'Eating',val:d.food.length+' nibble'+(d.food.length!==1?'s':'')+' today',color:'var(--sg)'});
  if(p.wo&&d.wos&&d.wos.length) shareItems.push({label:'Movement',val:'Did a '+d.wos[0].type+' circuit',color:'var(--sg)'});
  if(d.move&&d.move.out) shareItems.push({label:'Outside',val:'Got some fresh air today',color:'var(--sg)'});

  return '<div class="fi" style="background:var(--bg);min-height:100vh;">'
    // Warm header
    +'<div style="padding:24px 16px 20px;background:var(--card);border-bottom:1px solid var(--div);text-align:center;">'
    +'<div style="width:56px;height:56px;margin:0 auto 12px;">'+SL+'</div>'
    +'<div style="font-family:var(--serif);font-size:26px;font-style:italic;color:var(--pu);margin-bottom:4px;">Kenny&#39;s Korner</div>'
    +'<div style="font-size:13px;color:var(--ink3);">Love from '+(S.user&&S.user.name?S.user.name:'you')+'</div>'
    +'</div>'
    +'<div style="padding:16px;">'

    // Cycle zone — soft language, no numbers
    +'<div style="background:'+c.bg+';border-radius:10px;padding:14px 16px;margin-bottom:12px;text-align:center;">'
    +'<div style="font-size:13px;font-weight:700;color:'+c.zc+';margin-bottom:4px;">'+friendlyCycleMsg(c)+'</div>'
    +'<div style="font-size:12px;color:var(--ink2);line-height:1.5;">'+c.dtn+' days until her next infusion</div>'
    +'</div>'

    // What she's sharing
    +(shareItems.length?'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;">'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:10px;">How Kendra&#39;s doing today</div>'
    +shareItems.map(function(item){
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--div);">'
        +'<div style="font-size:13px;color:var(--ink2);">'+item.label+'</div>'
        +'<div style="font-size:13px;font-weight:700;color:'+item.color+';">'+item.val+'</div>'
        +'</div>';
    }).join('')
    +'</div>':'')

    // Wishlist CTA
    +(WISHLIST_URL?'<div style="background:var(--pul);border-radius:12px;border:1px solid var(--pum);padding:16px;margin-bottom:12px;text-align:center;">'
    +'<div style="font-family:var(--serif);font-size:17px;color:var(--pud);margin-bottom:6px;">Send her something</div>'
    +'<div style="font-size:13px;color:var(--ink2);margin-bottom:14px;">Kendra&#39;s Amazon wish list — things that actually help.</div>'
    +'<a href="'+WISHLIST_URL+'" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:var(--pu);color:#fff;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:600;text-decoration:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> View wish list</a>'
    +'</div>':'')

    // Leave a cheer
    +'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;">'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:12px;">Leave a cheer for Kendra</div>'
    +'<input class="inp mb3" type="text" id="cn" placeholder="Your name">'
    +'<textarea class="inp mb3" id="cm" rows="3" placeholder="Tell her something amazing..." style="height:80px;"></textarea>'
    +'<button class="btn btn-te" onclick="sendCheer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Send</button>'
    +'</div>'

    // Recent cheers
    +(S.cheers&&S.cheers.length?'<div style="background:var(--card);border-radius:12px;border:1px solid var(--div);overflow:hidden;margin-bottom:12px;">'
    +'<div style="padding:12px 16px;border-bottom:1px solid var(--div);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);">Recent cheers</div>'
    +S.cheers.slice(0,5).map(function(c){
      return '<div style="padding:12px 16px;border-bottom:1px solid var(--div);">'
        +'<div style="font-size:13px;font-weight:700;color:var(--pu);margin-bottom:4px;">'+c.name+'</div>'
        +'<div style="font-size:13px;color:var(--ink);line-height:1.5;">'+c.msg+'</div>'
        +'</div>';
    }).join('')
    +'</div>':'')

    +'<button onclick="logOut()" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink3);padding:8px;display:block;margin:0 auto;">Sign out</button>'
    +'<div style="height:24px;"></div>'
    +'</div></div>';
}

function friendlyCycleMsg(c){
  if(c.day<=3)  return 'She\'s in her rest days — extra love welcome';
  if(c.day<=7)  return 'Early recovery — things are slowly looking up';
  if(c.day<=14) return 'She\'s in her quiet week — gentle support matters most';
  return 'She's building strength — it's a good week';
}

function logOut(){
  S.role='patient';S.user=null;
  localStorage.removeItem('gk-u');
  S.v='pw';R();
}


function init(){
  try{
    var saved=localStorage.getItem('gk-u');
    if(saved){try{S.user=JSON.parse(saved);if(S.user&&S.user.role)S.role=S.user.role;}catch(e){}}
    R();
    loadAll();
    S.v=S.user?'app':'pw';
    R();
  }catch(e){
    console.error('Init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif;text-align:center;max-width:400px;margin:0 auto;">'
      +'<div style="font-size:32px;margin-bottom:16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>'
      +'<div style="font-size:18px;font-weight:600;margin-bottom:8px;">Something went wrong</div>'
      +'<div style="font-size:14px;color:#666;">'+e.message+'</div></div>';
  }
}
init();
</script>
