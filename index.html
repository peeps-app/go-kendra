<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Go Kendra</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.395.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
:root{
  /* Brand */
  --pu:#7C5CFC; --pum:#C4B5FD; --pul:#EDE9FE; --pud:#4C1D95; --pus:#F5F3FF;
  --te:#2DD4BF; --tel:#CCFBF1; --tes:#0F766E;
  --am:#8A6D00; --aml:#EAF27C; --sg:#7C5CFC; --sgl:#D6C7F2; --ro:#FF674D; --rol:#FFE3DD;
  --amd:#4A3B00; --sgd:#FFFFFF; --rod:#FFFFFF;
  --blue:#6366F1; --bluel:#EEF2FF;
  /* Ink */
  --ink:#0F0A2E; --ink2:#3D3659; --ink3:#8B7FB5; --ink4:#BDB5D6;
  /* Surface */
  --bg:#F8F7FF; --card:#FFFFFF; --raised:#F3F1FF; --div:#E9E5F8;
  /* Fonts */
  --serif:'Instrument Serif',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  /* Radius */
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  /* Shadow */
  --sh-sm:0 1px 3px rgba(124,92,252,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(124,92,252,.10),0 2px 6px rgba(0,0,0,.05);
  --sh-lg:0 12px 32px rgba(124,92,252,.14),0 4px 12px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}
#nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(248,247,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--div);z-index:100;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:stretch;justify-content:space-around;gap:2px;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;border:none;background:none;cursor:pointer;border-radius:12px;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase;transition:all .15s;min-height:52px;}
.nb svg{transition:all .15s;}
.nb.on{color:var(--pu);}
.nb.on svg{stroke:var(--pu);}
.nb:active{transform:scale(.93);}

/* ── TYPOGRAPHY ── */
h1,h2,h3{font-family:var(--serif);font-style:italic;}
.serif{font-family:var(--serif);font-style:italic;}

/* ── LAYOUT ── */
.fi{padding-bottom:88px;min-height:100vh;}
.ph{padding:20px 16px 16px;background:var(--card);border-bottom:1px solid var(--div);position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);}
.px{padding:0 16px;}
.sec{margin-bottom:20px;}
.mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt5{margin-top:20px;} .mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;} .mb5{margin-bottom:20px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.flex{display:flex;} .fca{align-items:center;} .fjb{justify-content:space-between;} .g3px{gap:3px;}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:16px;box-shadow:var(--sh-sm);}
.card-flush{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);overflow:hidden;box-shadow:var(--sh-sm);}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--div);}
.row:last-child{border-bottom:none;}

/* ── STAT TILES ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.st{background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;box-shadow:var(--sh-sm);}
.st.ok{background:var(--pul);border-color:var(--pum);}
.st.ok svg{stroke:var(--pu);}
.sv{font-size:16px;font-weight:700;color:var(--ink);line-height:1;}
.ss{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);}

/* ── LABELS ── */
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);}
.tinp{border:1.5px solid var(--div);border-radius:10px;background:var(--card);padding:0 12px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
.tseg{display:flex;align-items:center;gap:6px;}
.tnum{width:54px;height:48px;border:1.5px solid var(--div);border-radius:10px;background:var(--card);text-align:center;font-family:var(--sans);font-size:18px;font-weight:700;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
.tnum:focus{border-color:var(--pu);}
.tcol{font-size:18px;font-weight:700;color:var(--ink3);}
.tap{flex:1;height:48px;border:1.5px solid var(--div);border-radius:10px;background:var(--card);font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink3);cursor:pointer;outline:none;}
.tap.on{background:var(--pu);border-color:var(--pu);color:#fff;}
.tinp:focus{border-color:var(--pu);}
.tinp::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.chip-pu{background:var(--pul);color:var(--pud);}
.chip-te{background:var(--tel);color:var(--tes);}
.chip-am{background:var(--aml);color:#92400E;}
.chip-ro{background:var(--rol);color:#991B1B;}
.chip-sg{background:var(--sgl);color:#15803D;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;height:48px;min-height:48px;border:none;border-radius:var(--r-xl);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%;font-family:var(--sans);}
.btn-ink{background:var(--ink);color:#fff;}
.btn-ink:active{background:#1a1040;}
.btn-pu{background:var(--pu);color:#fff;box-shadow:0 4px 12px rgba(124,92,252,.35);}
.btn-pu:active{transform:scale(.97);}
.btn-out{background:transparent;color:var(--pu);border:2px solid var(--pum);}
.btn-te{background:var(--te);color:#fff;}
.btn-sm{height:38px;min-height:38px;font-size:13px;padding:0 14px;}
.btn-auto{width:auto;}

/* ── INPUTS ── */
.inp{width:100%;padding:13px 16px;border:1.5px solid var(--div);border-radius:var(--r-md);font-size:15px;font-family:var(--sans);background:var(--card);color:var(--ink);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--pu);}
textarea.inp{resize:none;line-height:1.5;}
select.inp{appearance:none;}

/* ── MOOD / CIN ── */
.mc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.mb{border:2px solid var(--div);border-radius:var(--r-md);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .15s;background:var(--card);}
.mb.on{border-color:var(--pu);background:var(--pul);}
.mb-dot{width:24px;height:24px;border-radius:50%;}
.mb-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);}

/* ── PROGRESS ── */
.pb{width:100%;height:6px;background:var(--div);border-radius:99px;overflow:hidden;}
.pb-fill{height:100%;border-radius:99px;transition:width .4s ease;}

/* ── CYCLE BANNER ── */
.cycle-band{border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden;}
.cycle-band::before{content:'';position:absolute;inset:0;opacity:.07;background:currentColor;}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:99px;font-size:10px;font-weight:700;background:var(--ro);color:#fff;}

/* ── TIMELINE ── */
.tli{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--div);}
.tli:last-child{border-bottom:none;}
.tld{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tlb{flex:1;min-width:0;}
.tlt{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:1px;}
.tll{font-size:13px;font-weight:700;}
.tls{font-size:12px;color:var(--ink3);}

/* ── CHECKIN OVERLAY ── */
#cin{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.cin-backdrop{position:absolute;inset:0;background:rgba(15,10,46,.5);backdrop-filter:blur(4px);}
.cin-sheet{position:relative;width:100%;max-width:430px;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(0,0,0,.15);}
.cin-handle{width:40px;height:4px;background:var(--div);border-radius:99px;margin:0 auto 20px;}

/* ── WORKOUT ── */
.wo-ex{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:16px;margin-bottom:10px;}
.wo-prog{height:4px;background:var(--div);border-radius:99px;overflow:hidden;margin-top:10px;}
.wo-prog-fill{height:100%;background:var(--pu);border-radius:99px;transition:width .3s;}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid transparent;}
.cal-day.today{background:var(--pu);color:#fff;font-weight:700;}
.cal-day.has-ev{background:var(--pul);color:var(--pud);}
.cal-day:hover:not(.today){background:var(--raised);}
.cal-day.dim{opacity:.35;}

/* ── EMPTY STATE ── */
.empty-s{text-align:center;padding:40px 20px;color:var(--ink3);}

/* ── CHEER CARD ── */
.cheer-c{padding:12px 0;border-bottom:1px solid var(--div);}
.cheer-c:last-child{border-bottom:none;}
.cheer-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}

/* ── TOG ── */
.tog{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--div);border-radius:99px;cursor:pointer;transition:.2s;}
.tog-sl::before{content:'';position:absolute;left:3px;bottom:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog input:checked+.tog-sl{background:var(--pu);}
.tog input:checked+.tog-sl::before{transform:translateX(18px);}

/* ── DROP ── */
.drop{width:18px;height:18px;border-radius:50%;border:2px solid var(--div);cursor:pointer;transition:all .12s;display:inline-block;}
.drop.on{background:var(--pu);border-color:var(--pu);}

/* ── ANIMATION ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(.94);}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ── HOME SPECIFIC ── */
.home-header{background:linear-gradient(135deg,var(--pul) 0%,var(--bluel) 100%);padding:20px 16px 16px;border-bottom:1px solid var(--pum);}
.score-ring-wrap{display:flex;justify-content:center;margin:8px 0 16px;}
.mood-cta{background:var(--card);border:2px dashed var(--pum);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.mood-cta:active{transform:scale(.98);}
.mood-logged{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh-sm);}

/* ── ZONE BANNER ── */
.zone-rough{background:linear-gradient(135deg,#FEE2E2,#FCE7F3);}
.zone-early{background:linear-gradient(135deg,#FEF3C7,#FEF9EC);}
.zone-nadir{background:linear-gradient(135deg,#EDE9FE,#E0E7FF);}
.zone-build{background:linear-gradient(135deg,#DCFCE7,#D1FAE5);}

/* ── FOOD PILLS ── */
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.fp{background:var(--card);border:1.5px solid var(--div);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);font-family:var(--sans);transition:all .12s;white-space:nowrap;}
.fp:active,.fp:hover{background:var(--pul);border-color:var(--pum);color:var(--pud);}

/* ── WORKOUT FULLSCREEN ── */
.wo-fs{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center;}
.wp{height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-bottom:8px;}
.wpf{height:100%;background:#fff;border-radius:99px;transition:width .4s ease;}

/* ── BRISTOL / DEMON BUTTONS ── */
.bb{width:44px;height:44px;border-radius:50%;border:2px solid var(--div);background:var(--card);cursor:pointer;font-size:15px;font-weight:700;position:relative;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.bb.on{border-color:var(--pu);background:var(--pul);color:var(--pud);}
.bl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;color:var(--ink3);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 12px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;}
.chip.on{background:var(--pul);border-color:var(--pum);color:var(--pud);}

/* ── MOOD ROW ── */
.mood-row{display:flex;gap:6px;}
.mo{flex:1;border-radius:10px;border:2px solid var(--div);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .12s;background:var(--card);}
.mo.on{border-color:var(--mc,var(--pu));}
.dot{width:20px;height:20px;border-radius:50%;transition:all .12s;}

/* ── LOG TABS ── */
.stabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:0px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.stabs::-webkit-scrollbar{display:none;}
.stab{flex-shrink:0;padding:7px 16px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink3);font-family:var(--sans);transition:all .12s;white-space:nowrap;}
.stab.on{background:var(--pu);border-color:var(--pu);color:#fff;}
.stab:active{transform:scale(.95);}

/* ── HYDRATION ── */
.prog{width:100%;height:8px;background:var(--div);border-radius:99px;overflow:hidden;}
.pf{height:100%;background:var(--te);border-radius:99px;transition:width .4s ease;}
.drops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.dr{width:32px;height:32px;border-radius:50%;background:var(--div);border:none;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;}
.dr.on{background:var(--te);}

/* ── BRISTOL BUTTONS ── */
.bg{display:flex;gap:10px;justify-content:space-between;margin-bottom:24px;}

/* ── LOG TAB BAR — own sticky row ── */
.log-tabs{position:sticky;top:57px;z-index:39;background:var(--bg);border-bottom:1px solid var(--div);padding:10px 16px 10px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.log-tabs::-webkit-scrollbar{display:none;}
.lt{flex-shrink:0;padding:8px 16px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink3);font-family:var(--sans);transition:all .12s;white-space:nowrap;min-height:38px;}
.lt.on{background:var(--pu);border-color:var(--pu);color:#fff;box-shadow:0 2px 8px rgba(124,92,252,.3);}
.lt:active{transform:scale(.95);}

/* ── FOOD CATEGORY HEADERS ── */
.food-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink4);margin:16px 0 8px;}
.food-cat:first-child{margin-top:0;}

#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:var(--sans);font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:var(--sh-lg);z-index:10000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:300px;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="nav" style="display:none">
  <button class="nb" data-t="home" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Today</button>
  <button class="nb" data-t="log" onclick="go('log')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="12" y1="11" x2="16" y2="11"/><line x1="12" y1="15" x2="16" y2="15"/></svg>Log</button>
  <button class="nb" data-t="train" onclick="go('train')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="5" width="3" height="14" rx="1"/><rect x="15" y="5" width="3" height="14" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/></svg>Train</button>
  <button class="nb" data-t="cal" onclick="go('cal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</button>

// ── Core DOM factory ─────────────────────────────────────────
function mk(tag, attrs, children) {
  var el = document.createElement(tag || 'div');
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'cls')       el.className = attrs[k];
      else if (k === 'css')  el.style.cssText = attrs[k];
      else if (k === 'txt')  el.textContent = attrs[k];
      else if (k === 'html') { var _s=document.createElement('span'); _s.innerHTML=attrs[k]; while(_s.firstChild) el.appendChild(_s.firstChild); }
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
  }
  if (children) {
    children.forEach(function(c) {
      if (!c) return;
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
  }
  return el;
}


function lc(name, sz, col) {
  sz = sz||16;
  if(typeof lucide !== 'undefined' && lucide[name.split('-').map(function(w){return w[0].toUpperCase()+w.slice(1);}).join('')]) {
    var key = name.split('-').map(function(w){return w[0].toUpperCase()+w.slice(1);}).join('');
    var el = lucide.createElement(lucide[key]);
    el.setAttribute('width', sz);
    el.setAttribute('height', sz);
    if(col) el.setAttribute('stroke', col);
    el.style.cssText = 'display:inline-block;vertical-align:middle;flex-shrink:0;';
    return el;
  }
  return null; // No Lucide match — caller handles missing icon
}

function tx(text) { return document.createTextNode(String(text || '')); }

function R() {
  var app = document.getElementById('app');
  var nav = document.getElementById('nav');
  if (!app){ console.error('BOOT: #app not found'); return; }
  try{
    app.innerHTML = '';
  }catch(e){ console.error('BOOT: clear failed',e); }

  if (S.v === 'ob')      { nav.style.display='none'; app.appendChild(renderOb());      return; }
  if (S.role === 'friends' && !['squad','wins','wishlist'].includes(S.tab)) S.tab='squad';

  nav.style.display = 'flex';
  var nbs = document.querySelectorAll('.nb');
  for (var i=0; i<nbs.length; i++) nbs[i].classList.toggle('on', nbs[i].dataset.t === S.tab);
  var medBtn = document.getElementById('nb-medical');
  if (medBtn) medBtn.style.display = S.role === 'care' ? 'flex' : 'none';
  var medsBtn = document.getElementById('nb-meds');
  if (medsBtn) medsBtn.style.display = (S.role==='patient'||S.role==='care') ? 'flex' : 'none';
  // Role-based nav: friends see only Squad + Calendar
  var _fr = S.role==='friends';
  ['home','log','train','cal','meds'].forEach(function(t){
    var b=document.querySelector('.nb[data-t="'+t+'"]');
    if(b) b.style.display = _fr ? 'none' : 'flex';
  });
  var sqBtn=document.querySelector('.nb[data-t="squad"]');
  if(sqBtn) sqBtn.style.display=_fr?'flex':'flex';
  var winsBtn=document.getElementById('nb-wins');
  if(winsBtn) winsBtn.style.display=_fr?'flex':'none';
  var wlBtn=document.getElementById('nb-wishlist');
  if(wlBtn) wlBtn.style.display=_fr?'flex':'none';
  var medicalBtn=document.getElementById('nb-medical');
  if(medicalBtn) medicalBtn.style.display = (S.role==='patient'||S.role==='care') ? 'flex' : 'none';

  var screens = { home:renderHome, log:renderLog, train:renderTrain, cal:renderCal,
                  squad:renderSquad, meds:renderMeds, medical:renderMedical , wishlist:renderWishlistMgmt , wins:renderWins, wishlist:renderSquadWishlist };
  var _tab = (S.role==='friends' && S.tab==='home') ? 'squad' : S.tab;
  var fn = S.wo ? null : (screens[_tab] || renderHome);
  app.appendChild(fn ? fn() : renderHome());

  if (S.wo) renderWoOverlay();
  else hideWoOverlay();
}

function renderSkaweakyClean(){
  if(S.role==='friends') return null;
  var wrap = mk('div',{css:'margin:0 0 14px;'});

  var lastShower = lsGet('last-shower-date'); // 'YYYY-MM-DD' or null
  var today = TODAY;
  var daysSince = 999;
  if(lastShower){
    var ms = new Date(today+'T12:00:00') - new Date(lastShower+'T12:00:00');
    daysSince = Math.round(ms / 86400000);
  }

  var overdue = daysSince >= 3;
  var fresh   = daysSince <= 1;

  // Card colors
  var cardBg  = overdue ? '#FFF8F0' : 'var(--card)';
  var border  = overdue ? '1.5px solid #F6AD55' : '1px solid var(--div)';

  var card = mk('div',{css:'background:'+cardBg+';border:'+border+';border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;position:relative;overflow:hidden;'});

  // Peep
  var peepImg = mk('img',{css:'width:56px;height:56px;flex-shrink:0;object-fit:contain;'});
  peepImg.src = PEEP_SHOWER;
  card.appendChild(peepImg);

  // Text block
  var txt = mk('div',{css:'flex:1;min-width:0;'});

  // Header row
  var hdRow = mk('div',{css:'display:flex;align-items:center;gap:6px;margin-bottom:4px;'});
  hdRow.appendChild(mk('div',{css:'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:'+(overdue?'#C05621':'var(--ink3)')+';',txt:'Skaweaky Clean'}));
  if(overdue){
    hdRow.appendChild(mk('div',{css:'font-size:10px;font-weight:700;background:#FBD38D;color:#7B341E;border-radius:99px;padding:1px 7px;',txt:'Overdue'}));
  } else if(fresh){
    hdRow.appendChild(mk('div',{css:'font-size:10px;font-weight:700;background:#C6F6D5;color:#276749;border-radius:99px;padding:1px 7px;',txt:daysSince===0?'Showered today':'\u2713 Good'}));
  }
  txt.appendChild(hdRow);

  // Body copy — reason not instruction
  var bodyTxt;
  if(overdue){
    bodyTxt = 'A shower protects the skin around the PICC line \u2014 cracked or dirty skin near that line is a real infection risk. Docetaxel makes skin more fragile. 5 minutes is enough on a hard day.';
  } else if(fresh){
    bodyTxt = daysSince===0
      ? 'Fresh and protected. That 5 minutes matters more than it sounds.'
      : 'One day since last shower \u2014 you\u2019re good. Skin around your PICC line is protected.';
  } else {
    bodyTxt = 'It\u2019s been '+daysSince+' day'+(daysSince===1?'':'s')+'. A quick shower keeps the PICC site clean and your skin healthier while on chemo.';
  }
  txt.appendChild(mk('div',{css:'font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:8px;',txt:bodyTxt}));

  // Log shower button
  var btn = mk('button',{css:'background:'+(overdue?'#DD6B20':'var(--pu)')+';color:#fff;border:none;border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;font-family:var(--sans);cursor:pointer;'});
  btn.appendChild(mk('span',{txt:'Log a shower'}));
  btn.addEventListener('click', function(){
    lsSet('last-shower-date', TODAY).catch(function(){});
    if(typeof toast==='function') toast('Skaweaky clean \u2728');
    R();
  });
  txt.appendChild(btn);

  // Show last logged date quietly
  if(lastShower && daysSince < 99){
    txt.appendChild(mk('div',{css:'font-size:11px;color:var(--ink4);margin-top:5px;',
      txt:'Last logged: '+new Date(lastShower+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}));
  }

  card.appendChild(txt);
  wrap.appendChild(card);
  return wrap;
}

}

function renderSquadPatientView(){
  var wrap=mk('div',{cls:'fi'});
  // Header — warm, personal, Kendra-facing (NOT squad-facing)
  var ph=mk('div',{cls:'ph',css:'background:linear-gradient(135deg,var(--pud),var(--pu));padding:18px 16px 28px;position:relative;'});
  ph.appendChild(mk('div',{css:'font-family:var(--serif);font-size:22px;font-style:italic;color:#fff;margin-bottom:4px;',
    txt:'Your corner \u2665'}));
  ph.appendChild(mk('div',{css:'font-size:12px;color:rgba(255,255,255,.75);',
    txt:'People who love you\u2014right here'}));
  // Sign out
  var _so=mk('button',{css:'display:inline-flex;align-items:center;gap:4px;background:transparent;border:none;padding:4px 0;margin-top:10px;cursor:pointer;color:rgba(255,255,255,.8);font-family:var(--sans);font-size:11px;font-weight:700;'});
  var _soIc=lc('log-out',12,'rgba(255,255,255,.8)');if(_soIc)_so.appendChild(_soIc);
  _so.appendChild(mk('span',{txt:'Sign out'}));
  _so.addEventListener('click',doLogout);
  ph.appendChild(_so);
  wrap.appendChild(ph);

  var px=mk('div',{cls:'px',css:'padding:20px 16px 100px;'});

  // Cheers count header
  var cheers=S.cheers||[];
  var countMsg = cheers.length===0
    ? 'Your squad is here for you.'
    : (cheers.length===1 ? '1 person is rooting for you.' : cheers.length+' people are rooting for you.');
  px.appendChild(mk('div',{css:'font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink);margin-bottom:16px;',
    txt:countMsg}));

  // Cheer wall — read only
  if(cheers.length){
    cheers.slice().reverse().forEach(function(c){
      var card=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;'});
      var msg=mk('div',{css:'font-family:var(--serif);font-size:15px;font-style:italic;color:var(--ink);line-height:1.6;margin-bottom:6px;',txt:'\u201c'+c.msg+'\u201d'});
      var meta=mk('div',{css:'font-size:11.5px;color:var(--ink3);'});
      meta.appendChild(mk('span',{css:'font-weight:600;',txt:c.name||'Anonymous'}));
      if(c.ts){
        var d2=new Date(c.ts);
        meta.appendChild(mk('span',{txt:' \u00b7 '+d2.toLocaleDateString('en-US',{month:'short',day:'numeric'})}));
      }
      card.appendChild(msg); card.appendChild(meta);
      px.appendChild(card);
    });
  } else {
    var empty=mk('div',{css:'text-align:center;padding:32px 0;'});
    empty.appendChild(mk('div',{css:'font-size:32px;margin-bottom:12px;',txt:'\u2665'}));
    empty.appendChild(mk('div',{css:'font-family:var(--serif);font-size:16px;font-style:italic;color:var(--ink2);',
      txt:'Cheers from your squad will show up here.'}));
    px.appendChild(empty);
  }

  px.appendChild(mk('div',{css:'height:24px;'}));
  wrap.appendChild(px);
  return wrap;
}

function renderSquad() {
  // Role dispatch — three distinct experiences
  if(S.role!=='friends') return renderSquadPatientView();
  
  if(!S.sqTab) S.sqTab='home';
  var wrap=mk('div',{cls:'fi'});
  var ph=mk('div',{cls:'ph',css:'background:linear-gradient(135deg,#FF8FB1,#F65C8E);padding:18px 16px 72px 16px;position:relative;'});
  ph.appendChild(mk('div',{css:'font-family:var(--serif);font-size:22px;font-style:italic;color:#fff;margin-bottom:4px;',txt:"Kenny\'s Korner"}));
  ph.appendChild(mk('div',{css:'font-size:12px;color:rgba(255,255,255,.8);padding-right:110px;',txt:'Check in on Kendra \u00b7 send some love'}));
  var _sqOut=mk('button',{css:'display:inline-flex;align-items:center;gap:4px;background:transparent;border:none;padding:4px 0 0;cursor:pointer;color:rgba(255,255,255,.85);font-family:var(--sans);font-size:11px;font-weight:700;'});
  var _sqOutIc=lc('log-out',12,'rgba(255,255,255,.9)');if(_sqOutIc)_sqOut.appendChild(_sqOutIc);
  _sqOut.appendChild(mk('span',{txt:'Sign out'}));
  _sqOut.addEventListener('click',doLogout);
  ph.appendChild(_sqOut);
  var sqPeep=mk('div',{css:'position:absolute;right:14px;bottom:-6px;width:96px;height:96px;opacity:.95;'});
  var sqImg=document.createElement('img'); sqImg.src=KENNY_MASCOT; sqImg.style.cssText='width:96px;height:96px;object-fit:contain;';
  sqPeep.appendChild(sqImg); ph.appendChild(sqPeep);
  ph.style.paddingBottom='28px';

  wrap.appendChild(ph);
  var px=mk('div',{cls:'px',css:'padding-top:16px;'});

  function secLabel(t){
    px.appendChild(mk('div',{css:'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:4px 0 9px;',txt:t}));
  }

  // ── TODAY — what Kendra has shared ──
  secLabel("How Kendra\'s doing");
  var d=S.day||empty();
  var todayCard=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;'});
  var lastMood=(d.moods&&d.moods.length)?d.moods[d.moods.length-1]:null;
  if(lastMood){

  function todayCount(field){

    if(Array.isArray(v)) return v.length ? v.length+'' : '\u2014';
    if(field==='hyd') return v ? v+'' : '\u2014';
    if(field==='move') return (v&&v.laps) ? v.laps+' laps' : '\u2014';
    return '\u2014';
  }
  function frewCount(){
    var n=(d.frew&&d.frew.length)||0;
    return n ? n+'' : 'None';
  }

    ['frew','Nausea',frewCount()]
  ];
  if(!pt) bodyRows.push(['labs','Labs & procedures','']);

  var dayRows = [
    ['food','Food',todayCount('food')],
    ['hyd','Sippin',todayCount('hyd')],

  dayRows.forEach(function(r,i){ daySection.appendChild(navRow(r[0],r[1],r[2],i===dayRows.length-1)); });

  wrap.appendChild(mk('div',{css:'height:24px;'}));

// ── LABS & PROCEDURES (care team only) ──
function renderLabs(){
  if(isPt()){
    var blk=mk('div'); blk.appendChild(mk('div',{txt:'Not available in patient view.'})); return blk;
  }
  var wrap=mk('div');
  var allLabs=lsRead('labs')||[];

  // Intro
  wrap.appendChild(mk('div',{css:'font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px;',txt:'Labs & procedures'}));
  wrap.appendChild(mk('div',{css:'font-size:11.5px;color:var(--ink3);line-height:1.5;margin-bottom:18px;',txt:'Care-team view. Log bloodwork values and review trends. Kendra does not see this section.'}));

  // ── Add new lab panel ──
  var addCard=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:14px;margin-bottom:22px;'});
  addCard.appendChild(mk('div',{css:'font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px;',txt:'New lab panel'}));

  var nlDate=mk('input',{type:'date',css:'width:100%;height:38px;font-size:13px;margin-bottom:8px;'});
  nlDate.value=TODAY;
  addCard.appendChild(nlDate);

  var nlName=mk('input',{type:'text',css:'width:100%;height:38px;font-size:13px;margin-bottom:10px;'});
  nlName.setAttribute('placeholder','Panel name (e.g. CBC, CMP, LFT)');
  addCard.appendChild(nlName);

  // Dynamic rows of key/value/unit
  var rowsHost=mk('div');
  var pendingRows = S._labPendingRows = S._labPendingRows || [{key:'',val:'',unit:''}];
  function drawRows(){
    rowsHost.replaceChildren();
    pendingRows.forEach(function(r,ix){
      var row=mk('div',{css:'display:grid;grid-template-columns:1.3fr .8fr .6fr auto;gap:6px;margin-bottom:6px;'});
      var ki=mk('input',{type:'text',css:'height:34px;font-size:12px;'}); ki.setAttribute('placeholder','Test (e.g. Hgb)'); ki.value=r.key;
      ki.addEventListener('input',function(){ r.key=ki.value; });
      var vi=mk('input',{type:'text',css:'height:34px;font-size:12px;text-align:right;'}); vi.setAttribute('placeholder','Value'); vi.value=r.val;
      vi.addEventListener('input',function(){ r.val=vi.value; });
      var ui=mk('input',{type:'text',css:'height:34px;font-size:12px;'}); ui.setAttribute('placeholder','Unit'); ui.value=r.unit;
      ui.addEventListener('input',function(){ r.unit=ui.value; });
      var rm=mk('button',{css:'background:transparent;border:1px solid var(--div);color:var(--ink3);border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:14px;',txt:'\u00d7'});
      rm.addEventListener('click',function(){ pendingRows.splice(ix,1); if(!pendingRows.length) pendingRows.push({key:'',val:'',unit:''}); drawRows(); });
      row.appendChild(ki); row.appendChild(vi); row.appendChild(ui); row.appendChild(rm);
      rowsHost.appendChild(row);
    });
  }
  drawRows();
  addCard.appendChild(rowsHost);

  var addRowBtn=mk('button',{css:'background:transparent;border:1.5px dashed var(--div);color:var(--ink3);border-radius:8px;width:100%;height:36px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:4px;margin-bottom:10px;',txt:'+ Add row'});
  addRowBtn.addEventListener('click',function(){ pendingRows.push({key:'',val:'',unit:''}); drawRows(); });
  addCard.appendChild(addRowBtn);

  var nlNotes=mk('textarea',{css:'width:100%;height:54px;font-size:12.5px;resize:none;box-sizing:border-box;padding:8px 10px;margin-bottom:10px;'});
  nlNotes.setAttribute('placeholder','Notes (paste lab summary, link to portal screenshot, etc.)');
  addCard.appendChild(nlNotes);

  var saveBtn=mk('button',{css:'width:100%;height:40px;border-radius:var(--r-md);border:none;background:var(--pu);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);',txt:'Save panel'});
  saveBtn.addEventListener('click',function(){
    var rows=pendingRows.filter(function(r){return (r.key||'').trim() && (r.val||'').trim();});
    if(!rows.length && !(nlNotes.value||'').trim()){ if(typeof toast==='function')toast('Add at least one value or a note'); return; }
    var entry={
      id:Date.now(),
      date:nlDate.value||TODAY,
      name:(nlName.value||'Lab panel').trim(),
      values:rows.map(function(r){return {key:r.key.trim(),val:r.val.trim(),unit:(r.unit||'').trim()};}),
      notes:(nlNotes.value||'').trim()
    };
    var all=lsRead('labs')||[];
    all.push(entry);
    all.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    lsSet('labs',all);
    S._labPendingRows=[{key:'',val:'',unit:''}];
    if(typeof toast==='function')toast('Saved');
    R();
  });
  addCard.appendChild(saveBtn);
  wrap.appendChild(addCard);

  // ── Trends for any test that appears in >=2 panels ──
  if(allLabs.length){
    var byKey={};
    allLabs.forEach(function(p){
      (p.values||[]).forEach(function(v){
        var k=v.key.toLowerCase();
        if(!byKey[k]) byKey[k]={label:v.key,unit:v.unit||'',points:[]};
        var num=parseFloat(v.val);
        if(!isNaN(num)) byKey[k].points.push({date:p.date,val:num});
      });
    });
    var trended=Object.keys(byKey).filter(function(k){return byKey[k].points.length>=2;});
    if(trended.length){
      wrap.appendChild(mk('div',{css:'font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;',txt:'Trends'}));
      var trendBox=mk('div',{css:'margin-bottom:22px;'});
      trended.forEach(function(k){
        var t=byKey[k]; t.points.sort(function(a,b){return a.date<b.date?-1:1;});
        var row=mk('div',{css:'padding:12px 0;border-top:1px solid var(--div);display:flex;align-items:center;gap:14px;'});
        var info=mk('div',{css:'flex:1;min-width:0;'});
        info.appendChild(mk('div',{css:'font-size:13px;font-weight:600;color:var(--ink);',txt:t.label}));
        var first=t.points[0].val, last=t.points[t.points.length-1].val;
        var dir = last>first?'\u2197':last<first?'\u2198':'\u2192';
        info.appendChild(mk('div',{css:'font-size:11px;color:var(--ink3);margin-top:2px;',txt:first+(t.unit?' '+t.unit:'')+'  '+dir+'  '+last+(t.unit?' '+t.unit:'')+'  \u00b7  '+t.points.length+' draws'}));
        row.appendChild(info);
        // sparkline
        var w=110,hh=26,vals=t.points.map(function(p){return p.val;});
        var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals); if(mx===mn) mx=mn+1;
        var svgNs='http://www.w3.org/2000/svg';
        var svg=document.createElementNS(svgNs,'svg');
        svg.setAttribute('width',w); svg.setAttribute('height',hh); svg.setAttribute('viewBox','0 0 '+w+' '+hh);
        var step=w/(vals.length-1||1);
        var pts=vals.map(function(v,i){return [i*step, hh-2 - ((v-mn)/(mx-mn))*(hh-6)];});
        var ln=document.createElementNS(svgNs,'path');
        ln.setAttribute('d',pts.map(function(p,i){return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' '));
        ln.setAttribute('fill','none'); ln.setAttribute('stroke','#7C5CFC'); ln.setAttribute('stroke-width','1.75'); ln.setAttribute('stroke-linecap','round'); ln.setAttribute('stroke-linejoin','round');
        svg.appendChild(ln);
        var lpt=pts[pts.length-1];
        var dot=document.createElementNS(svgNs,'circle'); dot.setAttribute('cx',lpt[0]); dot.setAttribute('cy',lpt[1]); dot.setAttribute('r','2.5'); dot.setAttribute('fill','#7C5CFC');
        svg.appendChild(dot);
        row.appendChild(svg);
        trendBox.appendChild(row);
      });
      wrap.appendChild(trendBox);
    }
  }

  // ── Panel history list ──
  if(allLabs.length){
    wrap.appendChild(mk('div',{css:'font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;',txt:'Panels ('+allLabs.length+')'}));
    var list=mk('div',{css:'margin-bottom:22px;'});
    allLabs.slice().reverse().forEach(function(p,idx){
      var card=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:10px;padding:12px;margin-bottom:8px;'});
      var hd=mk('div',{css:'display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;'});
      hd.appendChild(mk('div',{css:'font-size:13px;font-weight:700;color:var(--ink);',txt:p.name||'Lab panel'}));
      hd.appendChild(mk('div',{css:'font-size:11px;color:var(--ink3);',txt:new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}));
      card.appendChild(hd);
      (p.values||[]).forEach(function(v){
        var r=mk('div',{css:'display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:2px 0;'});
        r.appendChild(mk('span',{txt:v.key}));
        r.appendChild(mk('span',{css:'font-variant-numeric:tabular-nums;color:var(--ink);',txt:v.val+(v.unit?' '+v.unit:'')}));
        card.appendChild(r);
      });
      if(p.notes) card.appendChild(mk('div',{css:'font-size:11.5px;color:var(--ink3);line-height:1.45;margin-top:6px;padding-top:6px;border-top:1px solid var(--div);',txt:p.notes}));
      var del=mk('button',{css:'background:transparent;border:none;color:var(--ink4);font-size:11px;cursor:pointer;margin-top:6px;padding:0;',txt:'Delete'});
      del.addEventListener('click',(function(eid){return function(){
        var f=(lsRead('labs')||[]).filter(function(x){return x.id!==eid;});
        lsSet('labs',f); R();
      };})(p.id));
      card.appendChild(del);
      list.appendChild(card);
    });
    wrap.appendChild(list);
  }

  // ── Procedure history — paracentesis volumes from events ──
  var paras=(S.events||[]).filter(function(e){return e.type==='para'&&e.date<=TODAY;}).sort(function(a,b){return a.date<b.date?-1:1;});
  if(paras.length){
    wrap.appendChild(mk('div',{css:'font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;',txt:'Paracentesis history ('+paras.length+')'}));
    var procBox=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:10px;overflow:hidden;margin-bottom:22px;'});
    paras.forEach(function(p,i){
      var r=mk('div',{css:'display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;'+(i<paras.length-1?'border-bottom:1px solid var(--div)':'')});
      r.appendChild(mk('span',{css:'font-size:12.5px;color:var(--ink);',txt:new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}));
      r.appendChild(mk('span',{css:'font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;',txt:p.vol?p.vol+' L':'\u2014'}));
      procBox.appendChild(r);
    });
    wrap.appendChild(procBox);
  }

  wrap.appendChild(mk('div',{css:'height:24px;'}));
  return wrap;
}
function renderNotes() {
  var d = S.day||empty(); var notes = d.notes||'';
  var wrap = mk('div');
  wrap.appendChild(mk('div',{css:'font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;',txt:'Daily notes'}));
  var ta = document.createElement('textarea');
  ta.className = 'inp';
  ta.placeholder = isPt() ? 'How am I feeling overall? Anything notable today...' : 'How is Kendra feeling overall? Anything notable today...';
  ta.style.cssText = 'height:160px;resize:none;';
  ta.value = notes;
  ta.addEventListener('input', function(){ S.day=S.day||empty(); S.day.notes=this.value; saveDay(); });
  wrap.appendChild(ta);

  function schedDosesPerDay(drug){
    var n=0;
    Object.keys(MED_SLOTS).forEach(function(k){ MED_SLOTS[k].meds.forEach(function(m){ if(m.drug===drug) n++; }); });
    return n;
  }
  function drugSupply(m){
    var rf=getRefills()[m.drug];
    if(!rf||!rf.fillDate||!(parseFloat(rf.qty)>0)) return null;
    var qty=parseFloat(rf.qty), perDose=m.perDose||1;
    var fillTs=new Date(rf.fillDate+'T00:00:00').getTime();
    var daysSince=Math.max(0,(Date.now()-fillTs)/86400000);
    var isPrn=String(m.id).indexOf('-prn')>=0;
    if(isPrn){
      var doses=(getPrnLog()[m.id]||[]).filter(function(t){return t>=fillTs;});
      var used=doses.length*perDose, left=qty-used;
      var span=Math.max(3,daysSince), perDay=used/span;
      var daysLeft=perDay>0?left/perDay:null;
      return {left:left,daysLeft:daysLeft,unit:m.unit,isPrn:true};
    }
    var dailyUnits=schedDosesPerDay(m.drug)*perDose;
    var left=qty-dailyUnits*daysSince;
    return {left:left,daysLeft:dailyUnits>0?left/dailyUnits:null,unit:m.unit,isPrn:false};
  }

function getCycleSuggestions(){
  var c=cycle(), d=S.day||empty(), evs=S.events||[], today=TODAY;
  var pt=isPt();

  // ── helpers ──────────────────────────────────────────────────
  function isPast(ev){
    if(!ev.time||ev.time.indexOf(':')<0) return false;
    var p=ev.time.split(':');
    var evMin=parseInt(p[0],10)*60+parseInt(p[1],10);
    var now=new Date();
    return (now.getHours()*60+now.getMinutes())>=evMin;
  }
  function daysFromDate(ds){
    return Math.round((new Date(today+'T12:00:00')-new Date(ds+'T12:00:00'))/86400000);
  }
  function nextEvent(type){
    return evs.filter(function(e){return e.type===type&&e.date>=today;}).sort(function(a,b){return a.date<b.date?-1:1;})[0]||null;
  }

  // ── detect states ─────────────────────────────────────────────
  var todayEvs = evs.filter(function(e){return e.date===today;});
  var hadPara  = todayEvs.some(function(e){return e.type==='para'&&isPast(e);});
  var hadChemo = todayEvs.some(function(e){return e.type==='chemo'&&isPast(e);});
  var tomorrowStr = (function(){ var t=new Date(today+'T12:00:00'); t.setDate(t.getDate()+1); return t.toISOString().slice(0,10); })();
  var prePara  = evs.some(function(e){return e.type==='para'&&e.date===tomorrowStr;});

  // post-para detection — last para event that has passed
  var lastPara=null;
  evs.forEach(function(e){
    if(e.type==='para'&&e.date<=today&&(!lastPara||e.date>lastPara)) lastPara=e;
  });
  var postParaDays = lastPara && !hadPara ? daysFromDate(lastPara.date) : null;

  // symptom layers from today's logged data
  var frewToday   = Array.isArray(d.frew)   ? d.frew.length   : 0;
  var bellyLogs   = Array.isArray(d.belly)  ? d.belly          : [];
  var latestBloat = bellyLogs.length ? bellyLogs[bellyLogs.length-1].bloat : null;
  var latestHr    = bellyLogs.length ? bellyLogs[bellyLogs.length-1].hr    : null;
  var latestMoodV = (d.moods&&d.moods.length) ? d.moods[d.moods.length-1].mood : null;
  var onionToday  = Array.isArray(d.onion)  ? d.onion.length  : 0;
  var demonToday  = Array.isArray(d.demon)  ? d.demon          : [];
  var NAUSEA_ACTIVE   = frewToday>0;
  var FATIGUE_HIGH    = latestMoodV!==null && latestMoodV<=1;
  var ASCITES_BUILDING = latestBloat!==null && latestBloat>=3 || onionToday>=2;
  var DIARRHEA_ACTIVE = demonToday.some(function(d){return d.type&&d.type<=2;});

  // chemo day (from cycle)
  var cd = c.day; // 1=chemo day, 2=day after, etc.
  var offWeek = (cd > 21);

  // ── build tip object factory ──────────────────────────────────
  function tip(label, color, food, activity, watch, care){
    return {label:label, color:color, food:food, activity:activity, watch:watch, care:care||watch};
  }

  // ── PRIORITY 1: CHEMO DAY 0 ──────────────────────────────────
  if(hadChemo || cd===1){
    return [tip(
      pt?'Chemo day \u2014 you\u2019ve got this':'Chemo day \u2014 Day 0',
      'var(--ro)',
      pt
        ? ['Eat something small now, even 3 crackers','Ginger chews or ginger tea on hand','Cold foods will sit better if nausea starts','Sip water or Pedialyte throughout']
        : ['Pre-meds: confirm IV dexamethasone 20mg + IV Zofran/Aloxi, full 30-min window \u2014 non-negotiable','Small bland snacks during infusion if tolerated','Ginger chews, flat ginger ale','Avoid dairy, high fat, spicy, caffeine'],
      pt
        ? 'Rest after \u2014 no pressure to do anything. Even walking from the car to the house counts.'
        : 'Rest day after infusion. Arrange driver. Zyprexa at bedtime tonight for overnight nausea.',
      pt
        ? 'Nausea peaks in 24\u201372 hrs. Keep Haldol on schedule \u2014 prevent, don\u2019t chase. Any fever over 100.4\u00b0F = call the CARE clinic immediately (720-848-4870).'
        : 'Watch during infusion: flushing/itching/difficulty breathing during Docetaxel = hypersensitivity, tell nurse immediately. PICC site burning = drug leaking. Zyprexa at bedtime. Haldol every 6 hrs.',

  }

  // ── PRIORITY 4: POST-PARA DAYS 1-2 ───────────────────────────
  if(postParaDays===1){
    return [tip(
      pt?'Day after your drain \u2014 you\u2019ll feel the relief today':'Post-para day 1 \u2014 peak relief',
      '#3B8EA5',
      pt
        ? ['Protein is your best friend today \u2014 eggs, yogurt, soft chicken','Every bite of protein helps keep fluid where it belongs','Calcium foods today: yogurt, soft cheese, fortified milk','Stay hydrated \u2014 Pedialyte or electrolyte drinks over plain water']

        : 'BP monitoring: hypotension persists 24-48h post-para. Drain site check. Any fever = CARE clinic. Fluid will begin slowly rebuilding \u2014 this is expected, not a sign of failure.',

    )];
  }
  if(postParaDays===2){
    return [tip(
      pt?'Two days out from your drain':'Post-para day 2',
      '#3B8EA5',
      pt
        ? ['Same protein focus: eggs, yogurt, chicken','Calcium every day helps','Keep up the fluids']
        : ['Continue protein + calcium priority','Hydration: Pedialyte preferred'],
      pt
        ? 'Same gentle approach as yesterday. Movement helps.'
        : 'Gentle activity. Continue encouraging mobility.',
      pt
        ? 'The fluid will be slowly building back \u2014 that\u2019s normal and expected. The chemo needs time to control it. Let the team know if you\u2019re feeling very uncomfortable sooner than expected.'
        : 'Rate of fluid return: flag to Dr. Wilky if back to severe discomfort under 48h from drain \u2014 may need to adjust paracentesis frequency. All same BP/fever/site flags as day 1.',
      'Post-para day 2. Monitor rate of ascites return. If patient very uncomfortable in <72h from drain, contact Dr. Wilky re: frequency. Continue BP monitoring, drain site checks, protein/calcium nutrition push.'
    )];
  }

  // ── CHEMO CYCLE DAYS ─────────────────────────────────────────
  var base;
  if(cd===2){
    base=tip(
      pt?'Day 2 \u2014 the hardest day is usually today':'Chemo Day 2 \u2014 peak nausea',
      'var(--ro)',
      pt
        ? ['Cold or room-temp foods only \u2014 heat makes smells worse','Cold banana, plain crackers, applesauce, ice chips','Even 3-4 bites an hour is enough \u2014 TPN has you covered','Sip Pedialyte continuously, or Pedialyte pops']
        : ['Cold/room-temp only \u2014 smell is the nausea trigger','BRAT: banana, rice, applesauce, toast','Pedialyte pops or cold electrolyte drinks','Avoid all dairy, fat, spice, caffeine, strong smells near food'],
      pt
        ? 'Rest. Ankle circles and leg pumps in bed \u2014 do these even if everything else feels impossible. They protect you from clots.'
        : 'Minimal activity day. Ankle circles and leg pumps in bed \u2014 DVT prevention is non-negotiable even on worst days. Sitting up in a chair counts as activity today.',
      pt
        ? 'Peak nausea day. Keep Haldol strictly on schedule \u2014 every 6 hours even overnight. If you can\u2019t keep anything down for 4+ hours, or fever hits 100.4\u00b0F, call the CARE clinic: 720-848-4870.'
        : 'Haldol every 6 hrs without fail \u2014 set an alarm. Zyprexa at bedtime. Methadone 6am/2pm/9pm strict schedule. Vomiting + unable to keep fluids down 4+ hrs = CARE clinic. Fever = CARE clinic.',
      'Day 2: worst nausea day for GemTax protocol. Anti-nausea medication adherence is the single most important intervention. If patient misses Haldol doses, nausea escalates rapidly. Monitor hydration closely.'
    );
  } else if(cd===3){
    base=tip(
      pt?'Day 3 \u2014 still rough, but you\u2019re through the worst':'Chemo Day 3 \u2014 GI effects peak',
      'var(--ro)',
      pt
        ? ['BRAT still: banana, rice, applesauce, toast','Pedialyte over plain water \u2014 your body is losing electrolytes','Plain scrambled egg if nausea eases a little \u2014 protein matters']
        : ['BRAT foundation','Add plain egg if tolerated: albumin support','Aggressive hydration: Pedialyte not plain water \u2014 burning diarrhea causes significant loss','Absolutely no dairy, high fiber, fried, spicy, raw'],
      pt
        ? 'Rest is still the priority. Ankle pumps. If you have a moment where you feel okay \u2014 even walking to the bathroom and back counts.'
        : 'Rest primary. Ankle pumps in bed. Brief walk only if nausea eases. Do not plan structured exercise today.',
      pt
        ? 'Burning diarrhea usually starts or peaks today. Vaseline or zinc oxide cream after every bathroom visit \u2014 this is the most effective thing for the burning. Hydration is critical. Same fever/vomiting flags as yesterday.'
        : 'GI protocol: Vaseline or zinc oxide externally after every BM. Hold senna if diarrhea active. >6-8 liquid BMs = CARE clinic. Blood in stool = CARE clinic immediately. Fever 100.4+ = CARE clinic.',
      'Day 3: dual peak (nausea + GI). Most difficult day overall by patient report. GI mucositis protocol active. Vaseline/zinc oxide critical. Senna on hold if diarrhea. Miralax/lactulose hold also \u2014 diarrhea is more likely than constipation today.'
    );
  } else if(cd===4){
    base=tip(
      pt?'Day 4 \u2014 turning the corner':'Chemo Day 4 \u2014 improvement beginning',
      'var(--am)',
      pt
        ? ['Eat the moment any hunger appears \u2014 that signal matters','Soft scrambled eggs: protein for your albumin','Plain yogurt, mashed potato, soft chicken if interested','Still nothing dairy if diarrhea continues']
        : ['Capitalize immediately on any appetite signal','Protein push: eggs (albumin), soft chicken, plain yogurt, mashed potato','Still no dairy if diarrhea active. No high fiber, raw, spicy, fried, caffeine.'],
      pt
        ? 'First day to gently push movement. A walk down the hallway and back. Seated arm exercises with a water bottle. Outside for fresh air if you feel up to it \u2014 under 20 minutes, hat and SPF.'
        : 'First day to encourage movement: one short walk, seated arm exercises (bicep curls, shoulder press, lateral raises with water bottle), ankle circles. Outside ok \u2014 <20 min, hat, SPF 30+. No core exercises.',
      pt
        ? 'Check methadone is on schedule if pain has crept up. PICC line daily check. Fever over 100.4\u00b0F \u2014 call CARE clinic.'
        : 'Pain check: if elevated, confirm methadone on exact schedule. PICC line: check for tenderness, swelling, warmth daily. DVT monitoring: left arm swelling. Bowel should be moving toward more formed stools.',
      'Day 4: turning point. Sun sensitivity still active \u2014 if outside, hat + SPF, avoid 11am-3pm peak. GI improving but watch for continued loose stools. Immune function still suppressed \u2014 fever protocol active.'
    );
  } else if(cd===5){
    base=tip(
      pt?'Day 5 \u2014 you\u2019re coming back':'Chemo Day 5 \u2014 meaningful improvement',
      'var(--am)',
      pt
        ? ['Protein at every meal: eggs, chicken, fish, Greek yogurt, cottage cheese','Calcium today: yogurt, fortified milk, soft cheese \u2014 your body needs it','Iron foods: red meat, spinach, beans \u2014 pair with a bit of Vitamin C to absorb twice as much','Small amounts frequently \u2014 every 1-2 hours']
        : ['Protein priority every meal: eggs, chicken, fish, Greek yogurt, cottage cheese','Calcium: yogurt, fortified milk, soft cheese \u2014 chronically low','Iron + Vitamin C pairing for anemia management','Vitamin D drops daily \u2014 critical for calcium absorption'],
      pt
        ? 'Two short walks today if possible. Seated resistance exercises \u2014 bicep curls, shoulder press, lateral raises with a water bottle. Leg exercises. Outside for fresh air, 20-30 minutes max with hat and SPF.'
        : 'Two walks. Full seated exercise routine: arm and leg protocol. Outside 20-30 min max with hat + SPF. No core exercises ever.',

        ? 'Still in the window where infection risk is elevated. Check your temperature if anything feels off. PICC line daily check. Any shortness of breath or chest tightness \u2014 call 911 immediately (clot risk).'
        : 'WBC approaching nadir (lowest point, days 5-7). Infection risk elevated: no sick visitors, hand washing, any fever = CARE clinic. Daily PICC line check. DVT monitoring. BP check \u2014 documented hypotension episodes.',
      'Day 5: nadir approaching. Immune surveillance critical. Continue PICC and DVT monitoring. Nutrition push: albumin support (protein), calcium supplement, Vitamin D drops daily.'
    );
  } else if(cd>=6 && cd<=7){
    base=tip(
      pt?'Day '+cd+' \u2014 momentum is building':'Chemo Day '+cd+' \u2014 recovery phase',
      'var(--te)',
      pt
        ? ['Back to eating more regularly \u2014 still small amounts frequently','Protein every time: eggs, chicken, yogurt, cottage cheese, soft tofu','Soft cooked vegetables are fine now: carrots, sweet potato, squash','Calcium and iron foods every day']
        : ['Protein priority daily: all sources now appropriate','Calcium daily: chronically low, needs consistent replenishment','Iron + Vitamin C','Soft cooked veg ok now. Still no raw.'],
      pt
        ? 'This is the push window. Two laps minimum or equivalent walk. Full seated exercise routine. Outside every day. Sitting at the table for meals rather than in bed \u2014 posture and routine matter more than you think.'
        : 'Push week. 2+ walks daily. Full seated exercise routine: arms + legs (no core). Outside daily. Encourage table meals. 1lb weights appropriate per Dr. Wilky.',

        ? 'Prep for day 8 infusion: cold cap inserts in the freezer the night before. Check if the Sancuso patch needs replacing (it lasts 7 days). Keep the fever protocol on \u2014 you\u2019re not fully clear yet.'
        : 'Day 8 prep: cold cap inserts in freezer night before. Confirm Sancuso patch replacement date. Confirm IV pre-medication protocol for Day 8 with infusion team before appointment. Fever protocol still active.',

  } else if(cd===8){
    base=tip(
      pt?'Day 8 dose today \u2014 the lighter one':'Chemo Day 8 \u2014 Gemcitabine alone',
      'var(--pu)',
      pt
        ? ['Eat something small before you go \u2014 even 3 crackers','Ginger on hand for nausea','Cold foods sit better','Stay ahead of fluids']
        : ['Same pre-med protocol as Day 0 \u2014 do not let them shortcut IV meds','Small bland snacks. Ginger for nausea. Cold foods preferred.','Avoid dairy, high fat, spicy, caffeine'],
      pt
        ? 'Gentler than the first dose, but rest after. Your body has been through a lot.'
        : 'Gemcitabine alone: typically less nausea than Day 0 combo. Fatigue compounds across cycles. Follow Day 1 protocol after.',
      pt
        ? 'Same pre-med confirmation as always: make sure they give you the IV anti-nausea medications before the chemo starts, not just pills. If you feel any reaction during infusion \u2014 burning at PICC site, flushing, difficulty breathing \u2014 tell the nurse immediately.'

  } else if(cd>=9 && cd<=14){
    base=tip(
      pt?'Day '+cd+' \u2014 nadir zone, take it easy':'Chemo Day '+cd+' \u2014 nadir / immune low',
      'var(--pu)',
      pt
        ? ['High protein every time you eat: chicken, eggs, cottage cheese','Cooked vegetables only \u2014 avoid raw fruit and raw veg (infection risk during nadir)','Small frequent amounts','Calcium and iron daily']
        : ['Protein priority','Cooked foods only \u2014 raw produce infection risk during nadir','Calcium and iron daily','No immune-suppressing foods'],
      pt
        ? 'Keep it gentle \u2014 mobility circuit only. No intense exercise. Movement still matters though \u2014 even ankle pumps count.'
        : 'Mobility circuit only. No strenuous exercise. DVT prevention mandatory: ankle pumps every 2 hours if sedentary.',

        ? 'Lowest immune point of the cycle. No sick visitors. Wash hands constantly. Any fever over 100.4\u00b0F \u2014 call CARE clinic immediately: 720-848-4870. This is the most important rule of nadir.'
        : 'WBC nadir. Infection protocol: no sick visitors, strict hand hygiene, no raw produce. Any fever = CARE clinic immediately (720-848-4870). Daily PICC check. DVT monitoring.',
      'Nadir zone: WBC at or approaching lowest point. Fever response must be rapid. Isolation precautions. Continue all daily monitoring protocols.'
    );
  } else if(offWeek){
    base=tip(
      pt?'Off week \u2014 your best week. Use it.':'Chemo off week \u2014 peak recovery',
      'var(--sg)',
      pt
        ? ['No restrictions except what your gut has told you it doesn\u2019t like','Protein every single day: eggs, chicken, fish, Greek yogurt','Calcium daily: dairy, broccoli, almonds, fortified milk','Iron daily: red meat, spinach, beans','Vitamin D drops every day','Try new things this week \u2014 find what you like']
        : ['Protein every meal','Calcium every day \u2014 chronically low','Iron + Vitamin C pairing','Vitamin D drops daily','This is the week to identify new foods she tolerates well'],
      pt
        ? 'Every day should have movement this week. Two laps minimum or an equivalent walk. Full exercise routine. Outside every day. Build toward slightly longer walks. This is the week to build strength for next cycle.'
        : '2+ walks daily. Full exercise routine: arms + legs (no core). Outside every day. 1lb weights appropriate. Encourage table meals, normal routine.',
      pt

        : 'Pre-cycle prep: cold cap inserts frozen night before, confirm pre-med protocol with infusion team, confirm driver. Monitor ascites: if visibly distending contact CARE clinic re: paracentesis timing. Lovenox 2x daily non-negotiable.',
      'Off week: peak window for nutrition, exercise, and strength-building. Pre-cycle checklist: cold cap, pre-med confirmation, driver, Sancuso patch check. Ascites monitoring. Lovenox adherence critical.'
    );
  } else {
    base=tip(
      pt?'Day '+cd+' \u2014 building back up':'Day '+cd+' \u2014 recovery continuing',
      'var(--sg)',
      pt
        ? ['Protein every time you eat','Calcium and iron daily','Small amounts frequently \u2014 stomach is still smaller than normal from fluid','Push fluids']
        : ['Protein priority. Calcium. Iron.','Small frequent meals for ascites-reduced stomach capacity','Hydration push'],
      pt
        ? 'Strength circuit when energy allows. Outdoor walk encouraged. Move every day.'
        : 'Full exercise protocol if energy allows. Outdoor walk. Full seated routine.',
      pt
        ? 'PICC line daily check. Any fever over 100.4\u00b0F = call CARE clinic immediately.'
        : 'Daily PICC check. DVT monitoring. Fever protocol active.',
      'Continue all daily monitoring protocols.'
    );
  }

  // ── LAYER: SYMPTOM OVERRIDES (appended to base or prepended as priority) ──
  var layers=[];

  if(NAUSEA_ACTIVE){
    var nTip=tip(
      pt?'Nausea active \u2014 priority right now':'Nausea active today ('+frewToday+' vomit event'+(frewToday===1?'':'s')+')',
      'var(--ro)',
      pt
        ? ['Cold or room-temp foods only \u2014 heat makes nausea worse','Ginger in any form: tea, flat ginger ale, chews','Small sips of cold Pedialyte continuously','Popsicles or ice chips if nothing else works','Remove strong smells from the room \u2014 even pleasant ones']
        : ['Cold/room-temp only. No hot food.','Ginger tea, flat ginger ale, chews','Pedialyte pops or sips continuously','Clear room of strong smells including scented products and flowers'],
      pt
        ? 'Rest. Keep the room ventilated. Don\u2019t force eating.'
        : 'Ensure Haldol is on schedule. Check Sancuso patch is on skin. Zyprexa at bedtime if evening. Remove scented items from room.',
      pt
        ? 'If you can\u2019t keep any fluids down for 4+ hours \u2014 call the CARE clinic: 720-848-4870. Don\u2019t wait.'
        : 'If unable to keep fluids down 4+ hours = CARE clinic. If nausea rated 8+ not responding to Haldol in 2 hours = CARE clinic. Fever with nausea = CARE clinic.',
      'Nausea protocol active. Check Haldol adherence (every 6 hrs). Sancuso patch on skin. Anti-emetic escalation if not responding. Hydration monitoring critical.'
    );
    layers.unshift(nTip); // nausea goes first
  }

  if(ASCITES_BUILDING){
    var aTip=tip(
      pt?'Belly feels full and tight':'Ascites building \u2014 abdomen distending',
      'var(--am)',
      pt
        ? ['Smaller amounts than usual \u2014 stomach is being squeezed','Nothing that adds gas: no beans, broccoli, carbonated','Low sodium where possible \u2014 salt makes your body hold more fluid']
        : ['Reduce portion sizes further: ascites compressing stomach capacity','Eliminate gas-producing foods: beans, cruciferous veg, carbonated drinks','Low sodium diet where possible'],
      pt
        ? 'Sitting upright helps more than lying flat right now. Gentle walking helps redistribute the fluid slightly. Try not to lie completely flat for long stretches.'
        : 'Encourage upright positioning: sitting in chair > lying flat. Fluid pressure on diaphragm is worse lying down. Gentle walking helps redistribution.',
      pt
        ? 'If your abdomen is getting hard and tight, eating feels nearly impossible, or breathing feels labored \u2014 call the CARE clinic about paracentesis timing: 720-848-4870.'
        : 'Escalation: abdomen hard + patient very uncomfortable + eating nearly impossible + labored breathing = contact CARE clinic re: paracentesis. Hard abdomen ≠ soft bloating: distinguish.',
      'Ascites building protocol. Signs requiring paracentesis escalation: abdomen visibly hard and distended, eating essentially impossible, labored breathing. Contact Dr. Wilky or CARE clinic.'
    );
    layers.push(aTip);
  }

  if(DIARRHEA_ACTIVE){
    var dTip=tip(
      pt?'GI acting up today':'Diarrhea active',
      'var(--ro)',
      pt
        ? ['BRAT strictly: banana, rice, applesauce, toast','Pedialyte not plain water \u2014 you\u2019re losing electrolytes','No dairy, caffeine, high fat, raw veg, spicy, high fiber']
        : ['BRAT strictly. No dairy, caffeine, high fat, raw, spicy, high fiber.','Pedialyte preferred: significant electrolyte loss with diarrhea','Hold senna. Hold Miralax.'],
      pt
        ? 'Vaseline or zinc oxide cream after every bathroom visit \u2014 this genuinely helps the burning. Keep bathroom access close if you need to go out.'
        : 'Vaseline or zinc oxide externally after every BM \u2014 most effective GI comfort intervention. Hold all bowel stimulants. Bathroom proximity required for any activity.',
      pt
        ? 'More than 6-8 liquid bowel movements in a day, blood in stool, or fever \u2014 call the CARE clinic immediately: 720-848-4870.'
        : '>6-8 liquid BMs/day = CARE clinic. Blood in stool = CARE clinic immediately. Fever = CARE clinic. Dehydration signs: dark urine, extreme dizziness, confusion.',
      'Diarrhea protocol: GI mucositis + bile acid malabsorption from GemTax. Senna and Miralax on hold. Vaseline/zinc oxide barrier cream. Aggressive electrolyte replacement. Escalation threshold: >6-8 liquid BMs, blood, fever.'
    );
    layers.push(dTip);
  }

  if(FATIGUE_HIGH && layers.length===0){
    // Only surface fatigue tip if no higher-priority symptoms already noted
    var fTip=tip(
      pt?'Low energy day \u2014 small things still count':'Fatigue high today',
      'var(--ink3)',
      pt
        ? ['Even just a few bites of something counts','Protein if you can manage it: yogurt, soft egg','Sip fluids regularly']
        : ['Small frequent nutritional bites. Protein priority even in small amounts.'],
      pt
        ? 'The minimum floor today: ankle circles and leg pumps in bed, every couple of hours. Change position. Sit on the edge of the bed for even 5 minutes at some point. This is different from regular tiredness \u2014 rest alone won\u2019t help. Movement is the medicine.'
        : 'FATIGUE_HIGH: minimum floor regardless of fatigue level: ankle circles + leg pumps q2h (DVT), position changes q2h, sitting on bed edge for 5 min minimum. Cancer fatigue worsens with rest. Movement is the treatment.',
      pt
        ? 'You don\u2019t have to feel motivated. You just have to do the ankle circles. That\u2019s enough for today.'
        : 'Do not cancel all activity recommendations. Reduce to minimum floor but maintain. Frame as: even this one small thing helps. DVT risk is real and elevated with immobility.',
      'High fatigue protocol: minimum floor is non-negotiable (ankle pumps, position changes, brief sitting). Immobility + DVT risk combination requires this regardless of fatigue level.'
    );
    layers.push(fTip);
  }

  // Combine: active symptom layers first, then base chemo/para state
  return layers.concat([base]);
}

function addFood(item,meal){
  S.day=S.day||empty();
  (S.day.food=S.day.food||[]).push({item:item,meal:meal||'snack',ts:Date.now()});
  var fc=lsGet('food-freq')||{}; fc[item]=(fc[item]||0)+1; lsSet('food-freq',fc);
  saveDay();R();
}
function rmFood(i){if(!S.day||!S.day.food)return;S.day.food.splice(i,1);saveDay();R();}
function selBris(n){selB=n;var bs=document.querySelectorAll('.bb');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');var el=document.getElementById('b'+n);if(el)el.classList.add('on');}
function togTag(id){var idx=selT.indexOf(id);if(idx>=0)selT.splice(idx,1);else selT.push(id);var els=document.querySelectorAll('[id^=dt]');for(var i=0;i<els.length;i++)els[i].classList.toggle('on',selT.indexOf(els[i].id.replace('dt',''))>=0);}

function getCustomFoods(){ return lsGet('custom-foods')||{}; }
function catList(){
  var cf=getCustomFoods(), out=[];
  FOOD_CATS.forEach(function(c){
    var items=c.items.slice();
    if(cf[c.cat]) cf[c.cat].forEach(function(x){ if(items.indexOf(x)<0) items.push(x); });
    out.push({cat:c.cat,items:items});
  });
  return out;
}
function addCustomFood(){
  var v=(S.foodCustom||'').trim();
  if(!v) return;
  var cat=S.foodCustomCat||'';
  if(cat){
    var cf=getCustomFoods();
    if(!cf[cat]) cf[cat]=[];
    if(cf[cat].indexOf(v)<0) cf[cat].push(v);
    lsSet('custom-foods',cf);
  }
  addFood(v);
  S.foodCustom='';
  var el=document.getElementById('fc');if(el)el.value='';
}


function logDemon(){
  if(selB===null){toast('Pick a Bristol type first');return;}
  S.day=S.day||empty();(S.day.demon=S.day.demon||[]).push({b:selB,tags:selT.slice(),t:Date.now()});
  var sb=selB,st=selT.slice();
  saveDay();selB=null;selT=[];
  var msg=null;
  if(st.indexOf('spicy')>=0||sb>=6) msg='Lava mode. Vaseline barrier cream, Pedialyte, avoid acidic foods.';
  else if(st.indexOf('grumbles')>=0) msg='Warning system on. Stay close, keep loperamide handy.';
  else if(st.indexOf('shart')>=0) msg='Textbook GemTax. Vaseline undies routine is your friend.';
  else if(st.indexOf('winner')>=0||sb===4){msg='Solid W. A normal demon is a genuine victory.';confetti();}
  R();
  if(msg){
    var te=document.getElementById('demon-tip');
    if(te){
      te.replaceChildren();
      var tc=document.createElement('div');
      tc.className='card mt3';
      tc.style.cssText='background:var(--pul);padding:12px 14px;font-size:13px;color:var(--pud);';
      tc.textContent=msg;
      te.appendChild(tc);
    }
  }
  toast('Demon logged.');
}

function rmDemon(i){if(!S.day||!S.day.demon)return;S.day.demon.splice(i,1);saveDay();R();}

function doExport(){
  var d=S.day||empty(),c=cycle(),moods=d.moods||[],lm=latestMood(d);
  var date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  var lines=['KENDRA DAILY LOG — '+date,'Cycle Day '+c.day+' of '+c.tot+' ('+c.z+')','','Meds: AM '+(d.meds&&d.meds.am?'Done':'Not done')+' | PM '+(d.meds&&d.meds.pm?'Done':'Not done')];
  if(moods.length){lines.push('');lines.push('Mood check-ins ('+moods.length+'x):');for(var i=0;i<moods.length;i++){var m=moods[i];lines.push('  - '+fmtT(m.ts)+' — '+ML[m.mood]+(m.nausea!=null?' / Nausea: '+['Bad','Medium','Mild','None'][m.nausea]:'')+(m.pain!=null?' / Pain: '+['Bad','Medium','Mild','None'][m.pain]:'')+(m.notes?' / "'+m.notes+'"':''));}}
  if((d.food||[]).length){lines.push('');lines.push('Food ('+d.food.length+' nibbles):');for(var i=0;i<d.food.length;i++)lines.push('  - '+d.food[i].item+' — '+(d.food[i].kd===true?'kept':d.food[i].kd===false?'lost':'untracked'));}
  lines.push('Sippin: '+(d.hyd||0)+' glasses');
  if((d.demon||[]).length){lines.push('');lines.push('Pewps ('+d.demon.length+'x):');for(var i=0;i<d.demon.length;i++){var de=d.demon[i],bm=null;for(var j=0;j<BRIT.length;j++){if(BRIT[j].n===de.b){bm=BRIT[j];break;}}lines.push('  - '+(de.t?new Date(de.t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'  ':'')+'Bristol '+de.b+' ('+(bm?bm.l:'?')+') — '+((de.tags||[]).join(', ')||'no tags'));}}
  var mv=d.move||{};if(mv.laps)lines.push('Laps: '+mv.laps);if(mv.dist)lines.push('Distance: '+mv.dist);if(mv.out)lines.push('Went outside: yes');
  if((d.wos||[]).length)lines.push('Training: '+d.wos.map(function(w){return w.type+' ('+w.dur+'m)';}).join(', '));
  var txt=lines.join('\n');
  var el=document.getElementById('exp-out');
  if(el){
    el.style.display='block';
    el.replaceChildren();
    var pre=document.createElement('div');
    pre.style.cssText='background:var(--raised);border-radius:10px;padding:16px;border:1.5px dashed var(--div);font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--ink);font-family:monospace;';
    pre.textContent=txt;
    var copyBtn=document.createElement('button');
    copyBtn.className='btn btn-ink btn-sm';
    copyBtn.style.marginTop='10px';
    copyBtn.textContent='Copy to clipboard';
    copyBtn.onclick=function(){navigator.clipboard.writeText(txt).then(function(){toast('Copied!');});};
    el.appendChild(pre);
    el.appendChild(copyBtn);
}
}


function quickLogProc(type){
  var label=evLabel(type);
  var ev={id:Date.now(),date:TODAY,title:label,type:type,time:'',notes:''};
  S.events=(S.events||[]).concat(ev);
  if(type==='para'){
    var volStr=prompt('How many liters were drained? (e.g. 3.5)','');
    var vol=volStr&&parseFloat(volStr)>0?parseFloat(volStr):null;
    var base=new Date(TODAY+'T12:00:00');
    for(var wi=3;wi<=6;wi++){
      var wd=new Date(base);wd.setDate(wd.getDate()+wi);
      var wdt=wd.toISOString().split('T')[0];
      S.events.push({id:Date.now()+wi,date:wdt,title:'Tummy watch (day '+wi+')',type:'para-watch',time:'',notes:'Monitor for bloating.',soft:true});
    }
    confetti();toast('Para logged'+(vol?' — '+vol+'L drained':'')+' — watch days 3-6 added');
  } else if(type==='chemo'){
    localStorage.setItem('gk-lc',TODAY);recomputeCycleDates();
    confetti('big');toast('Chemo day logged! Cycle reset to today.');
  } else {
    toast(label+' logged');
  }
  saveEvents();R();
}

function startWo(type){
  var ex=type==='mobility'?MOB:type==='advanced'?STR_ADV:STR;
  S.wo={type:type,ex:ex,i:0,set:1,ph:'ready',t:0,total:Date.now()};
  S.woi=setInterval(tickWo,1000);R();
}

function beginEx(){
  if(!S.wo)return;
  var ex=S.wo.ex[S.wo.i];
  S.wo.ph='work';
  // Timed exercise → countdown. Rep exercise → no clock, user-paced.
  S.wo.t=ex&&ex.dur?ex.dur:0;
  R();
}
function isReps(ex){ return !!(ex&&ex.r); }
function completeSet(){
  if(!S.wo||S.wo.ph!=='work')return;
  var w=S.wo, ex=w.ex[w.i];
  if(isReps(ex)&&ex.s&&w.set<ex.s){ w.ph='rest'; w.t=20; }
  else { w.i++; if(w.i>=w.ex.length){ doneWo(); return; } w.set=1; w.ph='ready'; }
  R();
}
function tickWo(){
  if(!S.wo||S.wo.ph==='ready') return;
  var w=S.wo, e=w.ex[w.i];
  // Rep exercises in 'work' have no clock — they wait for the Done button.
  if(w.ph==='work'&&isReps(e)) return;
  w.t--;
  if(w.t<=0){
    if(w.ph==='work'){
      if(e.s&&w.set<e.s){w.ph='rest';w.t=20;}
      else{w.i++;if(w.i>=w.ex.length){doneWo();return;}w.set=1;w.ph='ready';}
    } else {w.set++;w.ph='work';w.t=0;}
  }
  R();
}

function doneWo(){
  clearInterval(S.woi);
  var dur=Math.round((Date.now()-S.wo.total)/60000),done=S.wo.ex.length,type=S.wo.type;
  S.wo=null;S.day=S.day||empty();
  S.day.wos=(S.day.wos||[]).concat({type:type,dur:dur,done:done});
  saveDay();R();
  confetti('big');toast(type==='mobility'?'Mobility done. Peepsqueak is so proud!':'Strength done. Peepsi is proud of those gains!');
}

function exD(ex){if(!ex)return 30;if(ex.dur)return ex.dur;if(ex.r)return 45;return 30;}

function skipEx(){if(!S.wo)return;S.wo.i++;if(S.wo.i>=S.wo.ex.length){doneWo();return;}S.wo.set=1;S.wo.ph='ready';R();}
function skipRest(){if(!S.wo||S.wo.ph!=='rest')return;S.wo.set++;S.wo.ph='work';S.wo.t=0;R();}
