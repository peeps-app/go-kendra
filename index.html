<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Go Kendra</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.395.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
:root{
  /* Brand */
  --pu:#7C5CFC; --pum:#C4B5FD; --pul:#EDE9FE; --pud:#4C1D95; --pus:#F5F3FF;
  --te:#2DD4BF; --tel:#CCFBF1; --tes:#0F766E;
  --am:#8A6D00; --aml:#EAF27C; --sg:#7C5CFC; --sgl:#D6C7F2; --ro:#FF674D; --rol:#FFE3DD;
  --amd:#4A3B00; --sgd:#FFFFFF; --rod:#FFFFFF;
  --blue:#6366F1; --bluel:#EEF2FF;
  /* Ink */
  --ink:#0F0A2E; --ink2:#3D3659; --ink3:#8B7FB5; --ink4:#BDB5D6;
  /* Surface */
  --bg:#F8F7FF; --card:#FFFFFF; --raised:#F3F1FF; --div:#E9E5F8;
  /* Fonts */
  --serif:'Instrument Serif',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  /* Radius */
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  /* Shadow */
  --sh-sm:0 1px 3px rgba(124,92,252,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(124,92,252,.10),0 2px 6px rgba(0,0,0,.05);
  --sh-lg:0 12px 32px rgba(124,92,252,.14),0 4px 12px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}
#nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(248,247,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--div);z-index:100;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:stretch;justify-content:space-around;gap:2px;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;border:none;background:none;cursor:pointer;border-radius:12px;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase;transition:all .15s;min-height:52px;}
.nb svg{transition:all .15s;}
.nb.on{color:var(--pu);}
.nb.on svg{stroke:var(--pu);}
.nb:active{transform:scale(.93);}

/* ── TYPOGRAPHY ── */
h1,h2,h3{font-family:var(--serif);font-style:italic;}
.serif{font-family:var(--serif);font-style:italic;}

/* ── LAYOUT ── */
.fi{padding-bottom:88px;min-height:100vh;}
.ph{padding:20px 16px 16px;background:var(--card);border-bottom:1px solid var(--div);position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);}
.px{padding:0 16px;}
.sec{margin-bottom:20px;}
.mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt5{margin-top:20px;} .mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;} .mb5{margin-bottom:20px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.flex{display:flex;} .fca{align-items:center;} .fjb{justify-content:space-between;} .g3px{gap:3px;}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:16px;box-shadow:var(--sh-sm);}
.card-flush{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);overflow:hidden;box-shadow:var(--sh-sm);}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--div);}
.row:last-child{border-bottom:none;}

/* ── STAT TILES ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.st{background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;box-shadow:var(--sh-sm);}
.st.ok{background:var(--pul);border-color:var(--pum);}
.st.ok svg{stroke:var(--pu);}
.sv{font-size:16px;font-weight:700;color:var(--ink);line-height:1;}
.ss{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);}

/* ── LABELS ── */
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);}
.tinp{border:1.5px solid var(--div);border-radius:10px;background:var(--card);padding:0 12px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
.tseg{display:flex;align-items:center;gap:6px;}
.tnum{width:54px;height:48px;border:1.5px solid var(--div);border-radius:10px;background:var(--card);text-align:center;font-family:var(--sans);font-size:18px;font-weight:700;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
.tnum:focus{border-color:var(--pu);}
.tcol{font-size:18px;font-weight:700;color:var(--ink3);}
.tap{flex:1;height:48px;border:1.5px solid var(--div);border-radius:10px;background:var(--card);font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink3);cursor:pointer;outline:none;}
.tap.on{background:var(--pu);border-color:var(--pu);color:#fff;}
.tinp:focus{border-color:var(--pu);}
.tinp::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.chip-pu{background:var(--pul);color:var(--pud);}
.chip-te{background:var(--tel);color:var(--tes);}
.chip-am{background:var(--aml);color:#92400E;}
.chip-ro{background:var(--rol);color:#991B1B;}
.chip-sg{background:var(--sgl);color:#15803D;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;height:48px;min-height:48px;border:none;border-radius:var(--r-xl);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%;font-family:var(--sans);}
.btn-ink{background:var(--ink);color:#fff;}
.btn-ink:active{background:#1a1040;}
.btn-pu{background:var(--pu);color:#fff;box-shadow:0 4px 12px rgba(124,92,252,.35);}
.btn-pu:active{transform:scale(.97);}
.btn-out{background:transparent;color:var(--pu);border:2px solid var(--pum);}
.btn-te{background:var(--te);color:#fff;}
.btn-sm{height:38px;min-height:38px;font-size:13px;padding:0 14px;}
.btn-auto{width:auto;}

/* ── INPUTS ── */
.inp{width:100%;padding:13px 16px;border:1.5px solid var(--div);border-radius:var(--r-md);font-size:15px;font-family:var(--sans);background:var(--card);color:var(--ink);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--pu);}
textarea.inp{resize:none;line-height:1.5;}
select.inp{appearance:none;}

/* ── MOOD / CIN ── */
.mc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.mb{border:2px solid var(--div);border-radius:var(--r-md);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .15s;background:var(--card);}
.mb.on{border-color:var(--pu);background:var(--pul);}
.mb-dot{width:24px;height:24px;border-radius:50%;}
.mb-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);}

/* ── PROGRESS ── */
.pb{width:100%;height:6px;background:var(--div);border-radius:99px;overflow:hidden;}
.pb-fill{height:100%;border-radius:99px;transition:width .4s ease;}

/* ── CYCLE BANNER ── */
.cycle-band{border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden;}
.cycle-band::before{content:'';position:absolute;inset:0;opacity:.07;background:currentColor;}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:99px;font-size:10px;font-weight:700;background:var(--ro);color:#fff;}

/* ── TIMELINE ── */
.tli{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--div);}
.tli:last-child{border-bottom:none;}
.tld{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tlb{flex:1;min-width:0;}
.tlt{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:1px;}
.tll{font-size:13px;font-weight:700;}
.tls{font-size:12px;color:var(--ink3);}

/* ── CHECKIN OVERLAY ── */
#cin{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.cin-backdrop{position:absolute;inset:0;background:rgba(15,10,46,.5);backdrop-filter:blur(4px);}
.cin-sheet{position:relative;width:100%;max-width:430px;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(0,0,0,.15);}
.cin-handle{width:40px;height:4px;background:var(--div);border-radius:99px;margin:0 auto 20px;}

/* ── WORKOUT ── */
.wo-ex{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:16px;margin-bottom:10px;}
.wo-prog{height:4px;background:var(--div);border-radius:99px;overflow:hidden;margin-top:10px;}
.wo-prog-fill{height:100%;background:var(--pu);border-radius:99px;transition:width .3s;}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid transparent;}
.cal-day.today{background:var(--pu);color:#fff;font-weight:700;}
.cal-day.has-ev{background:var(--pul);color:var(--pud);}
.cal-day:hover:not(.today){background:var(--raised);}
.cal-day.dim{opacity:.35;}

/* ── EMPTY STATE ── */
.empty-s{text-align:center;padding:40px 20px;color:var(--ink3);}

/* ── CHEER CARD ── */
.cheer-c{padding:12px 0;border-bottom:1px solid var(--div);}
.cheer-c:last-child{border-bottom:none;}
.cheer-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}

/* ── TOG ── */
.tog{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--div);border-radius:99px;cursor:pointer;transition:.2s;}
.tog-sl::before{content:'';position:absolute;left:3px;bottom:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog input:checked+.tog-sl{background:var(--pu);}
.tog input:checked+.tog-sl::before{transform:translateX(18px);}

/* ── DROP ── */
.drop{width:18px;height:18px;border-radius:50%;border:2px solid var(--div);cursor:pointer;transition:all .12s;display:inline-block;}
.drop.on{background:var(--pu);border-color:var(--pu);}

/* ── ANIMATION ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(.94);}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ── HOME SPECIFIC ── */
.home-header{background:linear-gradient(135deg,var(--pul) 0%,var(--bluel) 100%);padding:20px 16px 16px;border-bottom:1px solid var(--pum);}
.score-ring-wrap{display:flex;justify-content:center;margin:8px 0 16px;}
.mood-cta{background:var(--card);border:2px dashed var(--pum);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.mood-cta:active{transform:scale(.98);}
.mood-logged{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--div);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh-sm);}

/* ── ZONE BANNER ── */
.zone-rough{background:linear-gradient(135deg,#FEE2E2,#FCE7F3);}
.zone-early{background:linear-gradient(135deg,#FEF3C7,#FEF9EC);}
.zone-nadir{background:linear-gradient(135deg,#EDE9FE,#E0E7FF);}
.zone-build{background:linear-gradient(135deg,#DCFCE7,#D1FAE5);}

/* ── FOOD PILLS ── */
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.fp{background:var(--card);border:1.5px solid var(--div);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);font-family:var(--sans);transition:all .12s;white-space:nowrap;}
.fp:active,.fp:hover{background:var(--pul);border-color:var(--pum);color:var(--pud);}

/* ── WORKOUT FULLSCREEN ── */
.wo-fs{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center;}
.wp{height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-bottom:8px;}
.wpf{height:100%;background:#fff;border-radius:99px;transition:width .4s ease;}

/* ── BRISTOL / DEMON BUTTONS ── */
.bb{width:44px;height:44px;border-radius:50%;border:2px solid var(--div);background:var(--card);cursor:pointer;font-size:15px;font-weight:700;position:relative;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.bb.on{border-color:var(--pu);background:var(--pul);color:var(--pud);}
.bl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;color:var(--ink3);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 12px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;}
.chip.on{background:var(--pul);border-color:var(--pum);color:var(--pud);}

/* ── MOOD ROW ── */
.mood-row{display:flex;gap:6px;}
.mo{flex:1;border-radius:10px;border:2px solid var(--div);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .12s;background:var(--card);}
.mo.on{border-color:var(--mc,var(--pu));}
.dot{width:20px;height:20px;border-radius:50%;transition:all .12s;}

/* ── LOG TABS ── */
.stabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:0px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.stabs::-webkit-scrollbar{display:none;}
.stab{flex-shrink:0;padding:7px 16px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink3);font-family:var(--sans);transition:all .12s;white-space:nowrap;}
.stab.on{background:var(--pu);border-color:var(--pu);color:#fff;}
.stab:active{transform:scale(.95);}

/* ── HYDRATION ── */
.prog{width:100%;height:8px;background:var(--div);border-radius:99px;overflow:hidden;}
.pf{height:100%;background:var(--te);border-radius:99px;transition:width .4s ease;}
.drops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.dr{width:32px;height:32px;border-radius:50%;background:var(--div);border:none;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;}
.dr.on{background:var(--te);}

/* ── BRISTOL BUTTONS ── */
.bg{display:flex;gap:10px;justify-content:space-between;margin-bottom:24px;}

/* ── LOG TAB BAR — own sticky row ── */
.log-tabs{position:sticky;top:57px;z-index:39;background:var(--bg);border-bottom:1px solid var(--div);padding:10px 16px 10px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.log-tabs::-webkit-scrollbar{display:none;}
.lt{flex-shrink:0;padding:8px 16px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink3);font-family:var(--sans);transition:all .12s;white-space:nowrap;min-height:38px;}
.lt.on{background:var(--pu);border-color:var(--pu);color:#fff;box-shadow:0 2px 8px rgba(124,92,252,.3);}
.lt:active{transform:scale(.95);}

/* ── FOOD CATEGORY HEADERS ── */
.food-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink4);margin:16px 0 8px;}
.food-cat:first-child{margin-top:0;}

#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:var(--sans);font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:var(--sh-lg);z-index:10000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:300px;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="nav" style="display:none">
  <button class="nb" data-t="home" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Today</button>
  <button class="nb" data-t="log" onclick="go('log')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="12" y1="11" x2="16" y2="11"/><line x1="12" y1="15" x2="16" y2="15"/></svg>Log</button>
  <button class="nb" data-t="train" onclick="go('train')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="5" width="3" height="14" rx="1"/><rect x="15" y="5" width="3" height="14" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/></svg>Train</button>
  <button class="nb" data-t="cal" onclick="go('cal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</button>

// ── Core DOM factory ─────────────────────────────────────────
function mk(tag, attrs, children) {
  var el = document.createElement(tag || 'div');
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'cls')       el.className = attrs[k];
      else if (k === 'css')  el.style.cssText = attrs[k];
      else if (k === 'txt')  el.textContent = attrs[k];
      else if (k === 'html') { var _s=document.createElement('span'); _s.innerHTML=attrs[k]; while(_s.firstChild) el.appendChild(_s.firstChild); }
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
  }
  if (children) {
    children.forEach(function(c) {
      if (!c) return;
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
  }
  return el;
}


function lc(name, sz, col) {
  sz = sz||16;
  if(typeof lucide !== 'undefined' && lucide[name.split('-').map(function(w){return w[0].toUpperCase()+w.slice(1);}).join('')]) {
    var key = name.split('-').map(function(w){return w[0].toUpperCase()+w.slice(1);}).join('');
    var el = lucide.createElement(lucide[key]);
    el.setAttribute('width', sz);
    el.setAttribute('height', sz);
    if(col) el.setAttribute('stroke', col);
    el.style.cssText = 'display:inline-block;vertical-align:middle;flex-shrink:0;';
    return el;
  }
  // Fallback: use existing ICONS dict or plain text
  if(ICONS[name]) {
    var s = document.createElement('span');
    s.innerHTML = ico(name, sz, col);
    return s.firstChild || s;
  }
  return mk('span',{txt:'[•]'});
}

function svgWrap(str){var s=document.createElement("span");s.innerHTML=str;return s.firstChild||s;}
function tx(text) { return document.createTextNode(String(text || '')); }

function R() {
  var app = document.getElementById('app');
  var nav = document.getElementById('nav');
  if (!app){ console.error('BOOT: #app not found'); return; }
  try{
    app.innerHTML = '';
  }catch(e){ console.error('BOOT: clear failed',e); }

  if (S.v === 'loading') { nav.style.display='none'; app.appendChild(renderLoading()); return; }
  if (S.v === 'pw')      { nav.style.display='none'; app.innerHTML=''; renderPw(); return; }
  if (S.v === 'ob')      { nav.style.display='none'; app.appendChild(renderOb());      return; }
  if (S.role === 'friends' && S.tab!=='squad') S.tab='squad';

  nav.style.display = (S.role==='friends') ? 'none' : 'flex';
  var nbs = document.querySelectorAll('.nb');
  for (var i=0; i<nbs.length; i++) nbs[i].classList.toggle('on', nbs[i].dataset.t === S.tab);
  var medBtn = document.getElementById('nb-medical');
  if (medBtn) medBtn.style.display = S.role === 'care' ? 'flex' : 'none';
  var medsBtn = document.getElementById('nb-meds');
  if (medsBtn) medsBtn.style.display = (S.role==='patient'||S.role==='care') ? 'flex' : 'none';
  // Role-based nav: friends see only Squad + Calendar
  var _fr = S.role==='friends';
  ['home','log','train','cal'].forEach(function(t){
    var b=document.querySelector('.nb[data-t="'+t+'"]');
    if(b) b.style.display = _fr ? 'none' : 'flex';
  });
  var sqBtn=document.querySelector('.nb[data-t="squad"]');
  if(sqBtn) sqBtn.style.display='flex';
  var medicalBtn=document.getElementById('nb-medical');
  if(medicalBtn) medicalBtn.style.display = (S.role==='patient'||S.role==='care') ? 'flex' : 'none';

  var screens = { home:renderHome, log:renderLog, train:renderTrain, cal:renderCal,
                  squad:renderSquad, meds:renderMeds, medical:renderMedical };
  var _tab = (S.role==='friends' && S.tab==='home') ? 'squad' : S.tab;
  var fn = S.wo ? null : (screens[_tab] || renderHome);
  app.appendChild(fn ? fn() : renderHome());

  if (S.wo) renderWoOverlay();
  else hideWoOverlay();
}

function moodFace(i,sz,sel){
  var col=MC[i], light=MCL[i];
  var face=mk('div',{css:'position:relative;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+light+';border:'+(sel?'3px solid '+col:'2px solid var(--div)')+';box-sizing:border-box;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;'});
  var im=mk('img',{css:'width:'+Math.round(sz*0.84)+'px;height:'+Math.round(sz*0.84)+'px;object-fit:contain;'});
  im.src=MOOD_IMG[i]; im.alt='';
  face.appendChild(im);
  return face;
}
function logMood(i){
  S.day=S.day||empty();
  if(!Array.isArray(S.day.moods)) S.day.moods=[];
  var arr=S.day.moods, last=arr[arr.length-1];
  if(last && last.quick && (Date.now()-(last.id||0))<300000){ last.mood=i; }
  else { arr.push({id:Date.now(),ts:new Date().toISOString(),mood:i,nausea:null,pain:null,energy:null,notes:'',quick:true}); }
  saveDay(); R();
}
function renderLog() {
  var wrap = mk('div',{cls:'fi'});
  // Sticky header
  var ph = mk('div',{cls:'ph',css:'padding:16px 16px 12px;'});
  var phTitle = mk('div',{css:'font-family:var(--serif);font-size:20px;font-style:italic;color:var(--ink);',txt:'Daily Log'});
  var phDate  = mk('div',{css:'font-size:12px;color:var(--ink3);margin-top:2px;',
    txt:new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})});
  ph.appendChild(phTitle); ph.appendChild(phDate);
  // Tab bar
  var tabBar = mk('div',{cls:'log-tabs'});
  var tabs = [{id:'food',l:'Food'},{id:'demon',l:'Pewp'},{id:'hyd',l:'Sippin'},{id:'move',l:'Steps'},{id:'onion',l:'Onion-ie'},{id:'belly',l:'Belly + HR'},{id:'notes',l:'Notes'}];
  tabs.forEach(function(t){
    var lt = S.lt||'food';
    var btn = mk('button',{cls:'lt'+(lt===t.id?' on':''),txt:t.l});
    btn.addEventListener('click',(function(tid){ return function(){ S.lt=tid; R(); }; })(t.id));
    tabBar.appendChild(btn);
  });
  var content = mk('div',{cls:'px',css:'padding-top:16px;'});
  var lt = S.lt||'food';
  if(lt==='food')  content.appendChild(renderFood());
  else if(lt==='demon') content.appendChild(renderDemon());
  else if(lt==='hyd')   content.appendChild(renderHyd());
  else if(lt==='move')  content.appendChild(renderMove());
  else if(lt==='onion') content.appendChild(renderOnion());
  else if(lt==='belly') content.appendChild(renderBelly());
  else                  content.appendChild(renderNotes());
  var _md=S.day||empty();
  var _lm=(_md.moods&&_md.moods.length)?_md.moods[_md.moods.length-1]:null;
  var moodSec=mk('div',{cls:'px',css:'padding-top:14px;'});
  var moodCard=mk('div',{css:'background:var(--card);border:1px solid var(--div);border-radius:var(--r-md);padding:13px 14px;'});
  moodCard.appendChild(mk('div',{css:'font-size:13px;font-weight:700;color:var(--ink);',txt:isPt()?'How am I feeling?':'How is Kendra feeling?'}));
  moodCard.appendChild(mk('div',{css:'font-size:11px;color:var(--ink3);margin-bottom:12px;margin-top:1px;',txt:_lm?('Last set '+new Date(_lm.id||Date.parse(_lm.ts)).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' \u00b7 tap to update'):(isPt()?'Tap a Peepachu to log how I feel':'Tap a Peepachu to log how she feels')}));
  var faceRow=mk('div',{css:'display:flex;gap:7px;'});
  for(var _mi=0;_mi<5;_mi++){
    var _sel=!!(_lm&&_lm.mood===_mi);
    var fcol=mk('div',{css:'flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;'});
    fcol.appendChild(moodFace(_mi,46,_sel));
    fcol.appendChild(mk('div',{css:'font-size:9.5px;font-weight:'+(_sel?'800':'600')+';text-transform:uppercase;letter-spacing:.03em;color:'+(_sel?MC[_mi]:'var(--ink4)')+';',txt:ML[_mi]}));
    fcol.addEventListener('click',(function(ix){return function(){logMood(ix);};})(_mi));
    faceRow.appendChild(fcol);
  }
  moodCard.appendChild(faceRow);
  moodSec.appendChild(moodCard);
  wrap.appendChild(ph); wrap.appendChild(moodSec); wrap.appendChild(tabBar); wrap.appendChild(content);
  return wrap;
}

// ── FOOD TAB ──────────────────────────────────────────────────
function renderFood() {
  var d = S.day||empty();
  if(!Array.isArray(d.food)) d.food=[];
  var food = d.food;
  var wrap = mk('div');
  var MEALS = [{id:'breakfast',l:'Breakfast'},{id:'lunch',l:'Lunch'},{id:'dinner',l:'Dinner'},{id:'snack',l:'Snacks'}];

  // ── popular foods, ranked by logged frequency ──
  function popularFoods(){
    var fc=lsGet('food-freq')||{};
    var arr=Object.keys(fc).map(function(k){return {name:k,n:fc[k]};});
    arr.sort(function(a,b){return b.n-a.n;});
    if(arr.length<6){
      FOOD.forEach(function(f){ if(!fc[f] && arr.length<10) arr.push({name:f,n:0}); });
    }
    return arr.slice(0,10).map(function(x){return x.name;});
  }

  // ── search / type-to-add ──
  var srch = mk('div',{css:'position:relative;margin-bottom:6px;'});
  var ico = mk('span',{css:'position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink4);pointer-events:none;display:flex;',html:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'});
  var inp = mk('input',{type:'text',cls:'inp',placeholder:'Search or type a food\u2026',css:'padding-left:36px;height:46px;',value:S.foodQ||''});
  var _foodDeb=null;
  inp.addEventListener('input', function(){
    S.foodQ=this.value;
    if(_foodDeb) clearTimeout(_foodDeb);
    _foodDeb=setTimeout(function(){
      var el=document.getElementById('app');
      if(!el) return;
      var active=document.activeElement;
      var atEnd=active&&active.tagName==='INPUT';
      var pos=atEnd?active.selectionStart:null;
      R();
      if(atEnd){
        var ni=el.querySelector('input.inp');
        if(ni){ ni.focus(); try{ni.setSelectionRange(pos,pos);}catch(e){} }
      }
    },220);
  });
  srch.appendChild(ico); srch.appendChild(inp);
  wrap.appendChild(srch);

  // meal selector for what you're adding
  var curMeal = S.foodMeal||'breakfast';
  var mealPick = mk('div',{css:'display:flex;gap:5px;margin-bottom:12px;'});
  MEALS.forEach(function(m){
    var on=curMeal===m.id;
    var b=mk('button',{css:'flex:1;padding:7px 4px;border-radius:var(--r-sm);border:1.5px solid '+(on?'var(--pu)':'var(--div)')+';background:'+(on?'var(--pul)':'var(--card)')+';font-size:11.5px;font-weight:700;color:'+(on?'var(--pud)':'var(--ink3)')+';cursor:pointer;font-family:var(--sans);',txt:m.l});
    b.addEventListener('click',(function(id){return function(){S.foodMeal=id;R();};})(m.id));
    mealPick.appendChild(b);
  });
  wrap.appendChild(mealPick);

  var q=(S.foodQ||'').toLowerCase().trim();

  // ── search results / quick-tap chips ──
  if(q){
    var matches=[];
    var fc=lsGet('food-freq')||{};
    Object.keys(fc).forEach(function(k){ if(k.toLowerCase().indexOf(q)>=0) matches.push(k); });
    FOOD.forEach(function(f){ if(f.toLowerCase().indexOf(q)>=0 && matches.indexOf(f)<0) matches.push(f); });
    var chips=mk('div',{css:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;'});
    matches.slice(0,12).forEach(function(f){
      var b=mk('button',{css:'padding:7px 12px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:var(--sans);',txt:f});
      b.addEventListener('click',(function(fi){return function(){ addFood(fi,S.foodMeal||'breakfast'); S.foodQ=''; };})(f));
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    // add exactly what was typed
    var addNew=mk('button',{css:'width:100%;height:44px;border-radius:var(--r-md);border:none;background:var(--pu);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-bottom:18px;',txt:'Add \u201C'+(S.foodQ.trim())+'\u201D to '+(MEALS.filter(function(m){return m.id===curMeal;})[0].l)});
    addNew.addEventListener('click',function(){ var v=(S.foodQ||'').trim(); if(v){ addFood(v,S.foodMeal||'breakfast'); S.foodQ=''; } });
    wrap.appendChild(addNew);
  } else {
    var pop=popularFoods();
    if(pop.length){
      wrap.appendChild(mk('div',{css:'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:7px;',txt:'Quick add'}));
      var pchips=mk('div',{css:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;'});
      pop.forEach(function(f){
        var b=mk('button',{css:'padding:7px 12px;border-radius:99px;border:1.5px solid var(--div);background:var(--card);font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:var(--sans);',txt:f});
        b.addEventListener('click',(function(fi){return function(){ addFood(fi,S.foodMeal||'breakfast'); };})(f));
        pchips.appendChild(b);
      });
      wrap.appendChild(pchips);
    }
  }

  // ── meal sections with logged entries ──
  MEALS.forEach(function(m){
    var items=food.map(function(x,i){return {x:x,i:i};}).filter(function(o){return (o.x.meal||'snack')===m.id;});
    var sec=mk('div',{css:'margin-bottom:14px;'});
    var hd=mk('div',{css:'display:flex;align-items:baseline;gap:7px;margin-bottom:7px;'});
    hd.appendChild(mk('div',{css:'font-size:13px;font-weight:800;color:var(--ink);',txt:m.l}));
    hd.appendChild(mk('div',{css:'flex:1;height:1px;background:var(--div);'}));
    if(items.length) hd.appendChild(mk('div',{css:'font-size:11px;font-weight:700;color:var(--ink3);',txt:items.length+(items.length===1?' item':' items')}));
    sec.appendChild(hd);
    if(items.length){

function renderMeds() {

  var takenKey = 'med-taken-'+TODAY;

  function getTaken(){ return lsGet(takenKey)||{}; }
  function toggleTaken(id){ var t=getTaken(); t[id]=t[id]?false:Date.now(); lsSet(takenKey,t); R(); }
  function getOverride(id){ var o=lsGet('med-overrides')||{}; return o[id]||null; }
  var DOSE_DEFAULTS = {};  // no live-merged phantom doses — seeded once into storage at init
  function getPrnRaw(){ return lsGet('prn-doses')||{}; }
  function getPrnLog(){ var saved=getPrnRaw(), out={}, k; for(k in DOSE_DEFAULTS) out[k]=DOSE_DEFAULTS[k].slice(); for(k in saved) out[k]=(out[k]||[]).concat(saved[k]); for(k in out) out[k].sort(function(a,b){return a-b;}); return out; }
  function logPrn(id,name){ var l=getPrnRaw(); (l[id]=l[id]||[]).push(Date.now()); if(l[id].length>60)l[id]=l[id].slice(-60); lsSet('prn-doses',l); if(typeof toast==='function')toast(name+' logged \u00b7 '+fmtClock(Date.now())); R(); }
  function undoPrn(id){ var l=getPrnRaw(); if(l[id]&&l[id].length){ l[id].pop(); lsSet('prn-doses',l); R(); } }
  function openDoseModal(id,name){
    S.doseModal={id:id,name:name};
    var now=new Date();
    var hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');

  }
  function confirmDoseLog(){
    var dm=S.doseModal; if(!dm) return;
    var inp=document.getElementById('dose-modal-time');
    var v=inp?inp.value:'';
    logPrnAt(dm.id,dm.name,v);
    closeDoseModal();
  }
  window.openDoseModal=openDoseModal;
  window.closeDoseModal=closeDoseModal;
  window.confirmDoseLog=confirmDoseLog;
  function logPrnAt(id,name,hhmm){
    if(!hhmm||hhmm.indexOf(':')<0){ if(typeof toast==='function')toast('Pick a time first'); return; }
    var p=hhmm.split(':');
    var d=new Date(); d.setHours(parseInt(p[0],10),parseInt(p[1],10),0,0);
    if(d.getTime()>Date.now()) d.setDate(d.getDate()-1); // a future time = earlier today/yesterday
    var l=getPrnRaw(); (l[id]=l[id]||[]).push(d.getTime());
    l[id].sort(function(a,b){return a-b;});
    if(l[id].length>60)l[id]=l[id].slice(-60);
    lsSet('prn-doses',l);
    if(typeof toast==='function')toast(name+' logged \u00b7 '+fmtClock(d.getTime()));
    R();
  }
  function fmtClock(ts){ return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
  function fmtLeft(ms){ if(ms<=0) return null; var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000); if(h>=48)return Math.floor(h/24)+'d'; if(h>=1)return h+'h '+m+'m'; return m+'m'; }
  function isToday(ts){ return new Date(ts).toDateString()===now.toDateString(); }

  // ── HEADER ──────────────────────────────────────────────
  var ph = mk('div',{cls:'ph',css:'padding:14px 16px 12px;'});
  ph.appendChild(mk('div',{css:'font-family:var(--serif);font-size:22px;font-style:italic;color:var(--ink);',txt:isPt()?'My Meds':"Kendra's Meds"}));
  ph.appendChild(mk('div',{css:'font-size:12px;color:var(--ink3);margin-top:1px;',txt:now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}));
  wrap.appendChild(ph);

  var px = mk('div',{cls:'px',css:'padding-top:16px;'});

  // ── CALCULATED REFILL TRACKING ──────────────────────────
  var REFILL_DEFAULTS = {
    decadron:{fillDate:'2026-05-13',qty:30,refills:5},
    protonix:{fillDate:'2026-05-13',qty:60,refills:4},
    cymbalta:{fillDate:'2026-05-13',qty:30,refills:4},
    methadone:{fillDate:'2026-05-13',qty:270,refills:0},
    eliquis:{fillDate:'2026-05-13',qty:60,refills:40},
    haldol:{fillDate:'2026-05-13',qty:87,refills:1},
    zyprexa:{fillDate:'2026-05-13',qty:30,refills:4},
    flexeril:{fillDate:'2026-05-16',qty:27,refills:4},
    dilaudid:{fillDate:'2026-05-15',qty:57,refills:0},
    pepcid:{fillDate:'2026-05-16',qty:8},
    gummyday:{fillDate:'2026-05-13',qty:10},
    gummysleep:{fillDate:'2026-05-13',qty:18}
  };
  function getRefills(){ var saved=lsGet('med-refills')||{}; var out={}; for(var k in REFILL_DEFAULTS) out[k]=REFILL_DEFAULTS[k]; for(var k2 in saved) out[k2]=saved[k2]; return out; }
  function schedDosesPerDay(drug){
    var n=0;
    Object.keys(MED_SLOTS).forEach(function(k){ MED_SLOTS[k].meds.forEach(function(m){ if(m.drug===drug) n++; }); });
    return n;
  }
  function drugSupply(m){
    var rf=getRefills()[m.drug];
    if(!rf||!rf.fillDate||!(parseFloat(rf.qty)>0)) return null;
    var qty=parseFloat(rf.qty), perDose=m.perDose||1;
    var fillTs=new Date(rf.fillDate+'T00:00:00').getTime();
    var daysSince=Math.max(0,(Date.now()-fillTs)/86400000);
    var isPrn=String(m.id).indexOf('-prn')>=0;
    if(isPrn){
      var doses=(getPrnLog()[m.id]||[]).filter(function(t){return t>=fillTs;});
      var used=doses.length*perDose, left=qty-used;
      var span=Math.max(3,daysSince), perDay=used/span;
      var daysLeft=perDay>0?left/perDay:null;
      return {left:left,daysLeft:daysLeft,unit:m.unit,isPrn:true};
    }
    var dailyUnits=schedDosesPerDay(m.drug)*perDose;
    var left=qty-dailyUnits*daysSince;
    return {left:left,daysLeft:dailyUnits>0?left/dailyUnits:null,unit:m.unit,isPrn:false};
  }
  (function(){
    var seen={}, drugs=[];
    Object.keys(MED_SLOTS).forEach(function(k){ MED_SLOTS[k].meds.forEach(function(m){ if(!seen[m.drug]){seen[m.drug]=1;drugs.push(m);} }); });
    MED_PRN.concat(MED_PRN_RARE).forEach(function(m){ if(!seen[m.drug]){seen[m.drug]=1;drugs.push(m);} });
    var due=[];
    drugs.forEach(function(m){ var s=drugSupply(m); if(s && s.daysLeft!=null && s.daysLeft<=10) due.push({m:m,s:s}); });

        var rw=mk('div',{css:'padding:3px 0;'});

        var lbl=x.s.left<=0?'out \u2014 order now':(dl<=0?'~today':'~'+dl+' day'+(dl===1?'':'s')+' left');
        row.appendChild(mk('div',{css:'font-size:11.5px;font-weight:700;color:'+(low?'var(--ro)':'var(--amd)')+';',txt:lbl}));
        rw.appendChild(row);
        if(rf.refills===0) rw.appendChild(mk('div',{css:'font-size:10px;font-weight:700;color:var(--ro);margin-top:1px;',txt:'No refills left \u2014 needs a new prescription'}));

        card.appendChild(rw);
      });
      px.appendChild(card);
    }
  })();


  // ── shared edit panel ───────────────────────────────────
  function detailPanel(m, dose, note, isPrn){
    var panel = mk('div',{css:'grid-column:1/-1;background:var(--pus);border:1.5px solid var(--pum);border-radius:var(--r-md);padding:12px;margin-top:8px;margin-bottom:2px;'});

function getCycleSuggestions(){
  var c=cycle(),d=S.day||empty(),evs=eventsForDay(TODAY);
  function isPast(e){
    // No time = treat as not-yet-happened scheduled item (do NOT assume done)
    if(!e.time||e.time.indexOf(':')<0) return false;
    var p=e.time.split(':');
    var now=new Date();
    var evMin=parseInt(p[0],10)*60+parseInt(p[1],10);
    return (now.getHours()*60+now.getMinutes())>=evMin;
  }
  var hadPara=evs.some(function(e){return e.type==='para'&&isPast(e);});
  var hadChemo=evs.some(function(e){return e.type==='chemo'&&isPast(e);});
  var tips=[];
  // Override: paracentesis today
  if(hadPara){
    return [{
      label:'You had a paracentesis today',
      color:'var(--bl)',
      food:['Clear broths','Electrolyte drinks','Pedialyte popsicles','Small soft nibbles'],
      activity:'Rest completely today. No laps, no workout. Let your body stabilize.',
      watch:'Watch for: dizziness when standing, unusual pain at the site, fever over 100.4\u00B0F.'
    }];
  }
  // Override: chemo today
  if(hadChemo||c.day===1){
    return [{
      label:'Chemo day',
      color:'var(--ro)',
      food:['Cold foods tolerate better','Small bites every 1-2 hrs','Ginger ale (flat)','Bland starchy foods','Avoid strong smells near food'],
      activity:'Gentle movement only — a slow walk to the window counts.',
      watch:'Nausea peaks 24-72 hrs after infusion. Keep anti-nausea meds close.'
    }];
  }
  // Day-by-day chemo guidance (c.day = days since last chemo; day 1 handled above)
  if(c.day===2){
    tips=[{
      label:'Day 2 — usually the toughest',
      color:'var(--ro)',
      food:['Small frequent bites only','Flat ginger ale, ginger chews','Cold or bland foods go down easier','Pedialyte if not eating much'],
      activity:'Rest. Ankle circles and leg pumps in bed to protect against clots. No pressure to do more.',
      watch:'Worst nausea day and fatigue peak. Keep every anti-nausea med on schedule \u2014 prevent, do not chase. Sit upright after eating.'
    }];
  } else if(c.day===3){
    tips=[{
      label:'Day 3 — still rough',
      color:'var(--ro)',
      food:['BRATY: banana, rice, applesauce, toast, yogurt','Pedialyte over plain water','Avoid dairy, caffeine, high fat, spicy, raw veg'],
      activity:'Rest. Gentle ankle pumps in bed. A slow lap only if you feel up to it.',
      watch:'Burning diarrhea and cramping ramp up now and peak days 3\u20135. Vaseline or zinc oxide after every bathroom visit. Hydration is critical.'
    }];
  } else if(c.day===4 || c.day===5){
    tips=[{
      label:'Day '+c.day+' \u2014 GI effects peak',
      color:'var(--ro)',
      food:['BRATY: banana, rice, applesauce, toast, yogurt','Pedialyte over plain water','Avoid dairy, caffeine, high fat, spicy, raw veg'],
      activity:'Gentle only. A short walk if you feel up to it \u2014 no pressure.',
      watch:'Burning diarrhea and cramping usually peak days 3\u20135. Vaseline or zinc oxide after every bathroom visit. Hydration is critical.'
    }];
  } else if(c.day<=7){
    tips=[{
      label:'Day '+c.day+' \u2014 improvement begins',
      color:'var(--am)',
      food:['Eggs, yogurt, soft proteins','Eat the moment hunger appears','Avoid raw veg, spicy, fried'],
      activity:'Gentle arm exercises and short walks. Build up gradually.',
      watch:'The rough window (days 2\u20137) is easing. Bowel issues may continue but less intense. Call if any fever over 100.4\u00B0F.'
    }];
  } else if(c.day===8){
    tips=[{
      label:'Day 8 — second dose day',
      color:'var(--pu)',
      food:['Same pre-med protocol applies','Small bites, ginger for nausea','Stay ahead of fluids'],
      activity:'Gentle movement. Rest more than you think you need.',
      watch:'Gemcitabine alone is usually easier than the day-1 combo. Fatigue compounds each cycle.'
    }];
  } else if(c.day<=14){
    tips=[{
      label:'Day '+c.day+' — nadir zone',
      color:'var(--pu)',
      food:['High protein: chicken, eggs, cottage cheese','Cooked veg only \u2014 avoid raw fruit/veg (infection risk)','Small frequent meals'],
      activity:'Keep it gentle \u2014 mobility circuit only. No intense exertion.',
      watch:'Lowest immune point. No sick visitors. Wash hands constantly. Any fever = call the team immediately.'
    }];
  } else {
    tips=[{
      label:'Day '+c.day+' — building back',
      color:'var(--sg)',
      food:['More variety \u2014 the body can handle it','High calorie, high protein every time you eat','Push fluids'],
      activity:'Strength circuit is fair game if energy is there. Outdoor walk encouraged.',
      watch:'Counts coming back up. Good time to push movement a bit more.'
    }];
  }
  return tips;
}

function quickLogProc(type){
  var label=evLabel(type);
  var ev={id:Date.now(),date:TODAY,title:label,type:type,time:'',notes:''};
  S.events=(S.events||[]).concat(ev);
  if(type==='para'){
    var volStr=prompt('How many liters were drained? (e.g. 3.5)','');
    var vol=volStr&&parseFloat(volStr)>0?parseFloat(volStr):null;
    var base=new Date(TODAY+'T12:00:00');
    for(var wi=3;wi<=6;wi++){
      var wd=new Date(base);wd.setDate(wd.getDate()+wi);
      var wdt=wd.toISOString().split('T')[0];
      S.events.push({id:Date.now()+wi,date:wdt,title:'Tummy watch (day '+wi+')',type:'para-watch',time:'',notes:'Monitor for bloating.',soft:true});
    }
    confetti();toast('Para logged'+(vol?' — '+vol+'L drained':'')+' — watch days 3-6 added');
  } else if(type==='chemo'){
    localStorage.setItem('gk-lc',TODAY);recomputeCycleDates();
    confetti('big');toast('Chemo day logged! Cycle reset to today.');
  } else {
    toast(label+' logged');
  }
  saveEvents();R();
}

function saveChemoDates(){

function startWo(type){
  var ex=type==='mobility'?MOB:type==='advanced'?STR_ADV:STR;
  S.wo={type:type,ex:ex,i:0,set:1,ph:'ready',t:0,total:Date.now()};
  S.woi=setInterval(tickWo,1000);R();
}

function beginEx(){
  if(!S.wo)return;
  var ex=S.wo.ex[S.wo.i];
  S.wo.ph='work';
  // Timed exercise → countdown. Rep exercise → no clock, user-paced.
  S.wo.t=ex&&ex.dur?ex.dur:0;
  R();
}
function isReps(ex){ return !!(ex&&ex.r); }
function completeSet(){
  if(!S.wo||S.wo.ph!=='work')return;
  var w=S.wo, ex=w.ex[w.i];
  if(isReps(ex)&&ex.s&&w.set<ex.s){ w.ph='rest'; w.t=20; }
  else { w.i++; if(w.i>=w.ex.length){ doneWo(); return; } w.set=1; w.ph='ready'; }
  R();
}
function tickWo(){
  if(!S.wo||S.wo.ph==='ready') return;
  var w=S.wo, e=w.ex[w.i];
  // Rep exercises in 'work' have no clock — they wait for the Done button.
  if(w.ph==='work'&&isReps(e)) return;
  w.t--;
  if(w.t<=0){
    if(w.ph==='work'){
      if(e.s&&w.set<e.s){w.ph='rest';w.t=20;}
      else{w.i++;if(w.i>=w.ex.length){doneWo();return;}w.set=1;w.ph='ready';}
    } else {w.set++;w.ph='work';w.t=0;}
  }
  R();
}

function doneWo(){
  clearInterval(S.woi);
  var dur=Math.round((Date.now()-S.wo.total)/60000),done=S.wo.ex.length,type=S.wo.type;
  S.wo=null;S.day=S.day||empty();
  S.day.wos=(S.day.wos||[]).concat({type:type,dur:dur,done:done});
  saveDay();R();
  confetti('big');toast(type==='mobility'?'Mobility done. Peepsqueak is so proud!':'Strength done. Peepsi is proud of those gains!');
}

function exD(ex){if(!ex)return 30;if(ex.dur)return ex.dur;if(ex.r)return 45;return 30;}

function skipRest(){if(!S.wo||S.wo.ph!=='rest')return;S.wo.set++;S.wo.ph='work';S.wo.t=0;R();}

}

function renderCin(){
  var d=S.cinD;
  var timeEl=document.getElementById('cin-time');

    }
  }

  if(d.mood!=null){
    renderCinScale('cin-nausea','Nausea','nausea',d.nausea);

function renderCinScale(cid,label,key,val){
  var con=document.getElementById(cid);
  if(!con) return;
  con.replaceChildren();
  var wrap=document.createElement('div');
  wrap.style.marginBottom='14px';
  var lbl=document.createElement('div');
  lbl.style.cssText='font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;';
  lbl.textContent=label;
  var row=document.createElement('div');
  row.style.cssText='display:flex;gap:6px;';
  var opts=['Bad','Medium','Mild','None'];
  for(var i=0;i<opts.length;i++){
    var on=val===i;
    var btn=document.createElement('button');
    btn.type='button';
    btn.setAttribute('onclick','pickScale("'+key+'",'+i+')');
    btn.style.cssText='flex:1;border-radius:8px;border:1.5px solid '+(on?'var(--pu)':'var(--div)')+';background:'+(on?'var(--pul)':'var(--card)')+';padding:9px 4px;font-size:12px;font-weight:'+(on?'700':'500')+';color:'+(on?'var(--pud)':'var(--ink3)')+';cursor:pointer;font-family:var(--sans);';
    btn.textContent=opts[i];
    row.appendChild(btn);
  }
  wrap.appendChild(lbl);wrap.appendChild(row);
  con.appendChild(wrap);
}

function renderWoOverlay(){
  var w=S.wo;if(!w) return;
  var ov=document.getElementById('wo-overlay');
  if(!ov) return;
  var ex=w.ex[w.i];
  var mob=w.type==='mobility',adv=w.type==='advanced';
  var accentCol='var(--pu)';
  ov.style.background='var(--bg)';
  ov.style.display='flex';
  var pf0=document.getElementById('wo-progress-fill'); if(pf0) pf0.style.background=accentCol;
  var mb0=document.getElementById('wo-main-btn'); if(mb0) mb0.style.background=accentCol;
  // Phase label
  var phLabel=document.getElementById('wo-phase-label');
  if(phLabel) phLabel.textContent=(mob?'Mobility':'Strength')+(adv?' · Advanced':'')+' · '+(w.i+1)+' of '+w.ex.length;
  // Progress bar
  var pf=document.getElementById('wo-progress-fill');
  if(pf){
    // Progress across all sets of all exercises, not just exercise index.
    var totalSets=0, doneSets=0;
    for(var _x=0;_x<w.ex.length;_x++){
      var _s=(w.ex[_x].s||1);
      totalSets+=_s;
      if(_x<w.i) doneSets+=_s;
      else if(_x===w.i) doneSets+=(w.set-1)+((w.ph==='rest')?1:0);
    }
    pf.style.width=Math.round(doneSets/totalSets*100)+'%';
  }
  // Exercise name
  var nameEl=document.getElementById('wo-exercise-name');
  if(nameEl) nameEl.textContent=w.ph==='rest'?'Rest':ex.n;
  // Equipment
  var eqEl=document.getElementById('wo-equipment');
  if(eqEl){
    var hdrTxt='';
    if(w.ph==='rest') hdrTxt='Rest';
    else if(ex.s&&ex.r) hdrTxt='Set '+w.set+' of '+ex.s;
    else if(ex.r) hdrTxt='Reps';
    else if(ex.dur) hdrTxt='Timed';
    eqEl.textContent=hdrTxt;
    eqEl.style.color='var(--pu)';
  }
  // Note
  var noteEl=document.getElementById('wo-note');
  var noteWrap=document.getElementById('wo-note-wrap');
  if(noteEl&&noteWrap){
    if(ex.note&&w.ph!=='rest'){noteEl.textContent=ex.note;noteWrap.style.display='block';}
    else noteWrap.style.display='none';
  }
  // Rep/set or timer
  var repEl=document.getElementById('wo-rep-display');
  var timerEl=document.getElementById('wo-timer-display');
  var timerLbl=document.getElementById('wo-timer-label');
  if(repEl&&timerEl&&timerLbl){
    // Single, consistent number display for every phase.
    timerEl.style.display='none';
    timerLbl.style.display='none';
    repEl.replaceChildren();
    var bigNum, unitTxt, setTxt='';
    if(w.ph==='rest'){
      bigNum=('0'+Math.floor(w.t/60)).slice(-2)+':'+('0'+(w.t%60)).slice(-2);
      unitTxt='rest';
    } else if(ex.dur){
      // Timed exercise — countdown while working, target while ready.
      if(w.ph==='work'){ bigNum=('0'+Math.floor(w.t/60)).slice(-2)+':'+('0'+(w.t%60)).slice(-2); }
      else { bigNum=ex.dur; }
      unitTxt='seconds';
    } else {
      // Rep exercise — static target, persists until she advances.
      bigNum=ex.r;
      unitTxt='reps';
    }
    var bn=document.createElement('div');
    bn.style.cssText='font-size:88px;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;padding:4px 0;display:block;';
    bn.textContent=bigNum;
    repEl.appendChild(bn);
    var ul=document.createElement('div');
    ul.style.cssText='font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink3);margin-top:6px;';
    ul.textContent=unitTxt;
    repEl.appendChild(ul);
    if(setTxt){
      var st=document.createElement('div');
      st.style.cssText='font-size:13px;font-weight:600;color:var(--ink3);margin-top:10px;';
      st.textContent=setTxt;
      repEl.appendChild(st);
    }
  }

  // Tip
  var tipEl=document.getElementById('wo-tip');
  if(tipEl) tipEl.textContent=w.ph==='rest'?'':ex.tip?'“'+ex.tip+'”':'';
  // Main button
  var mainBtn=document.getElementById('wo-main-btn');
  if(mainBtn){
    if(w.ph==='ready'){
      mainBtn.textContent='Start';
      mainBtn.onclick=beginEx;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
    } else if(w.ph==='rest'){
      mainBtn.textContent='Skip rest';
      mainBtn.onclick=skipRest;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
    } else if(w.ph==='work'&&isReps(ex)){
      mainBtn.textContent='Done';
      mainBtn.onclick=completeSet;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
    } else {
      mainBtn.textContent='Skip exercise';
      mainBtn.onclick=skipEx;
      mainBtn.style.background='var(--raised)';mainBtn.style.color='var(--ink2)';
    }
  }
  // Skip rest
  var skipBtn=document.getElementById('wo-skip-btn');
  if(skipBtn){
    if(w.ph==='rest'){ skipBtn.textContent='Skip rest'; skipBtn.onclick=skipRest; skipBtn.style.display='block'; }
    else if(w.ph==='work'&&isReps(ex)){ skipBtn.textContent='Skip exercise'; skipBtn.onclick=skipEx; skipBtn.style.display='block'; }
    else { skipBtn.style.display='none'; }
  }
  // Up next
  var nxtDiv=document.getElementById('wo-up-next');
  var nxtName=document.getElementById('wo-up-next-name');
  var nxt=w.i+1<w.ex.length?w.ex[w.i+1]:null;
  if(nxtDiv&&nxtName){
    if(nxt&&w.ph==='ready'){nxtName.textContent=nxt.n;nxtDiv.style.display='block';}
    else nxtDiv.style.display='none';
  }
}

function _segIds(which){
  return which==='appt'

function _segGet(which){
  var id=_segIds(which);
  var hEl=document.getElementById(id.h), mEl=document.getElementById(id.m);
  if(!hEl||!mEl) return '';
  var amOn=document.getElementById(id.am).classList.contains('on');
  var pmOn=document.getElementById(id.pm).classList.contains('on');
  var h=parseInt(hEl.value,10), m=parseInt(mEl.value,10);
  if(isNaN(h)||(!amOn&&!pmOn)) return '';
  if(isNaN(m)) m=0;
  if(h<1) h=1; if(h>12) h=12; if(m>59) m=59;
  var h24=h%12; if(pmOn) h24+=12;
  return String(h24).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function _segSet(which,hhmm){
  var id=_segIds(which);
  var hEl=document.getElementById(id.h), mEl=document.getElementById(id.m);
  var amB=document.getElementById(id.am), pmB=document.getElementById(id.pm);
  if(!hEl) return;
  if(!hhmm||hhmm.indexOf(':')<0){ hEl.value='';mEl.value='';amB.classList.remove('on');pmB.classList.remove('on'); return; }
  var p=hhmm.split(':'), h=parseInt(p[0],10), m=parseInt(p[1],10);
  var ap=h>=12?'PM':'AM', h12=h%12||12;
  hEl.value=String(h12); mEl.value=String(m).padStart(2,'0');
  amB.classList.toggle('on',ap==='AM'); pmB.classList.toggle('on',ap==='PM');
}

function buildMedEditor(medList){
  var html='<div class="mt4"><div class="lbl mb2">Medication list</div><div class="card-flush mb3">';
  if(medList.length){for(var i=0;i<medList.length;i++){var m=medList[i];html+='<div class="row"><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;">'+m.name+'</div><div style="font-size:12px;color:var(--ink3);">'+m.dose+' \u00B7 '+(m.prn?'As needed (every '+m.intervalHours+'h)':formatTimeStr(m.time))+'</div></div><button onclick="removeMed('+m.id+')" style="background:none;border:none;cursor:pointer;color:var(--ink3);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';}}else{html+='<div style="padding:16px;font-size:13px;color:var(--ink3);">No meds yet</div>';}
  html+='</div><div class="lbl mb2">Add medication</div><div class="card mb3"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><input class="inp" type="text" id="med-name" placeholder="Name"><input class="inp" type="text" id="med-dose" placeholder="Dose"></div><div style="display:flex;gap:8px;margin-bottom:8px;"><select class="inp" id="med-type" style="height:48px;flex:1;" onchange="toggleMedTypeForm(this.value)"><option value="scheduled">Scheduled</option><option value="prn">As needed (PRN)</option></select></div><div id="med-time-wrap" style="margin-bottom:8px;"><input class="inp" type="time" id="med-time" style="height:48px;"></div><div id="med-prn-wrap" style="display:none;margin-bottom:8px;"><div style="font-size:12px;color:var(--ink3);margin-bottom:4px;">Min hours between doses</div><select class="inp" id="med-interval" style="height:48px;"><option value="2">Every 2h</option><option value="3">Every 3h</option><option value="4" selected>Every 4h</option><option value="6">Every 6h</option><option value="8">Every 8h</option><option value="12">Every 12h</option></select></div><input class="inp mb2" type="text" id="med-notes" placeholder="Notes (optional)"><select class="inp mb3" id="med-key" style="height:48px;"><option value="">No pill image</option><option value="methadone">Methadone</option><option value="apixaban">Apixaban</option><option value="decadron">Decadron</option><option value="protonix">Protonix</option><option value="cymbalta">Cymbalta</option><option value="zyprexa">Zyprexa</option><option value="haldol">Haldol</option><option value="dilaudid">Dilaudid</option><option value="tylenol">Tylenol</option><option value="flexeril">Flexeril</option></select><button class="btn btn-ink btn-sm" onclick="addMed()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add med</button></div></div>';
  return html;
}

<div id="cin" style="display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;justify-content:flex-end;align-items:center;">

        Save check-in
      </button>
    </div>
  </div>
</div>


<div id="wo-overlay" style="display:none;position:fixed;inset:0;z-index:500;flex-direction:column;background:var(--bg);">

  <!-- TOP ZONE — fixed: quit, progress, phase label -->
  <div style="flex-shrink:0;padding:16px 20px 0;">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="wo-quit" onclick="quitWo()" style="flex-shrink:0;background:transparent;border:1.5px solid var(--div);color:var(--ink3);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);">Quit</button>
      <div id="wo-progress-wrap" style="flex:1;height:6px;background:var(--div);border-radius:99px;overflow:hidden;"><div id="wo-progress-fill" style="height:100%;background:var(--pu);border-radius:99px;width:0%;transition:width .35s;"></div></div>
    </div>
    <div id="wo-phase-label" style="font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:1.6px;text-transform:uppercase;margin-top:12px;text-align:center;"></div>
  </div>

  <!-- CENTER ZONE — the active exercise as one anchored card. -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 8px;min-height:0;">

    <!-- the exercise card — name, number, set bound together as one unit -->
    <div style="width:100%;max-width:360px;background:var(--card);border:1px solid var(--div);border-radius:var(--r-lg);box-shadow:0 4px 20px rgba(76,29,149,.06);">

      <!-- card header — exercise name -->
      <div style="padding:18px 20px 14px;border-bottom:1px solid var(--div);text-align:center;">
        <div id="wo-equipment" style="font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:4px;min-height:13px;"></div>
        <div id="wo-exercise-name" style="font-family:var(--serif);font-size:26px;font-style:italic;color:var(--ink);line-height:1.15;"></div>
      </div>

      <!-- card body — the number, the focal point -->
      <div style="padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="wo-rep-display" style="text-align:center;width:100%;"></div>
        <div id="wo-timer-display" style="display:none;"></div>
        <div id="wo-timer-label" style="display:none;"></div>
      </div>

      <!-- card footer — note, only when present -->
      <div id="wo-note-wrap" style="display:none;padding:0 20px 18px;text-align:center;">
        <div id="wo-note" style="font-size:12.5px;color:var(--ink2);background:var(--raised);border-radius:10px;padding:8px 12px;line-height:1.45;"></div>
      </div>

    </div>

    <!-- coaching tip — quiet, below the card, clearly secondary -->
    <div id="wo-tip" style="font-size:12.5px;font-style:italic;color:var(--ink3);max-width:320px;line-height:1.5;text-align:center;margin-top:16px;min-height:18px;"></div>

  </div>

  <!-- BOTTOM ZONE — fixed: actions never move -->
  <div style="flex-shrink:0;padding:16px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:0;">
    <div id="wo-up-next" style="margin-bottom:14px;text-align:center;display:none;">
      <span style="font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink4);">Up next&nbsp;&nbsp;</span>
      <span id="wo-up-next-name" style="font-size:13px;font-weight:700;color:var(--ink3);"></span>
    </div>
    <button id="wo-main-btn" style="width:100%;max-width:360px;background:var(--pu);color:#fff;font-size:16px;font-weight:700;border-radius:14px;height:54px;border:none;cursor:pointer;font-family:var(--sans);"></button>
    <div id="wo-skip-btn" style="margin-top:14px;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:var(--sans);display:none;height:18px;"></div>
  </div>

</div>

        </div>
      </div>
      <div style="font-size:10.5px;color:var(--ink4);margin-top:6px;">Arrive-by fills 15 min earlier when you set the appointment time — adjust if needed.</div>
    </div>

    <!-- WHERE -->
    <div style="margin-bottom:14px;">
      <div class="lbl" style="margin-bottom:8px;">Where</div>
      <input id="ev-loc" type="text" class="inp" placeholder="Clinic or address" style="height:46px;width:100%;box-sizing:border-box;margin-bottom:8px;" oninput="S.evForm.location=this.value">
      <input id="ev-prov" type="text" class="inp" placeholder="Provider (optional)" style="height:46px;width:100%;box-sizing:border-box;" oninput="S.evForm.provider=this.value">

    <!-- NOTES -->

      <div class="lbl" style="margin-bottom:8px;">Notes</div>

    </div>

    <button onclick="saveEvent()" class="btn btn-ink" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;">

  </div>
