.flex{display:flex}.fca{align-items:center}.fjb{justify-content:space-between}.g3{gap:12px}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:500;z-index:9999;white-space:nowrap;display:none;box-shadow:var(--sh3)}
#toast.show{display:block;animation:ta 2.8s ease forwards}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.fi{animation:fadeIn .22s ease}
</style>

// ── STATE ──────────────────────────────────────────────
var S = {v:'loading',tab:'home',obs:0,user:null,day:null,cheers:[],priv:null,bdgs:[],wo:null,lt:'food',cd:null,calD:{},cin:false,cinD:{mood:null,nausea:null,pain:null,energy:null,notes:''}};

// ── STORAGE ────────────────────────────────────────────
var db = null;
function lsGet(k){try{var v=localStorage.getItem('gk-'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem('gk-'+k,JSON.stringify(v));}catch(e){}}

function initFirebase(){
  try{
    if(typeof firebase !== 'undefined'){
      firebase.initializeApp(FB_CFG);
      db = firebase.firestore();
      return true;
    }
  }catch(e){console.warn('Firebase init failed:',e.message);}
  return false;
}

async function dbGet(col,id){
  if(!db) return null;
  try{var d=await db.collection(col).doc(id).get();return d.exists?d.data():null;}
  catch(e){return null;}
}
async function dbSet(col,id,data){
  if(!db) return;
  try{await db.collection(col).doc(id).set(data,{merge:true});}
  catch(e){console.warn('dbSet failed:',e.message);}
}

async function loadAll(){
  try{
    var fbReady = initFirebase();
    if(fbReady){
      var dayDoc = await dbGet('days',TODAY);
      S.day = dayDoc || empty();
      if(!Array.isArray(S.day.moods)) S.day.moods = migrateMoods(S.day);
      var chSnap = await db.collection('cheers').orderBy('ts','desc').limit(40).get();
      S.cheers = chSnap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      var cfg = await dbGet('settings','app');
      S.priv = (cfg && cfg.priv) || DEFP;
      S.bdgs = (cfg && cfg.bdgs) || BDGS;
    } else {
      S.day = lsGet('day-'+TODAY) || empty();
      if(!Array.isArray(S.day.moods)) S.day.moods = migrateMoods(S.day);
      S.cheers = lsGet('cheers') || [];
      var cfg2 = lsGet('cfg');
      S.priv = (cfg2 && cfg2.priv) || DEFP;
      S.bdgs = (cfg2 && cfg2.bdgs) || BDGS;
    }
  }catch(e){
    console.error('loadAll error:',e);
    S.day = lsGet('day-'+TODAY) || empty();
    if(!Array.isArray(S.day.moods)) S.day.moods = migrateMoods(S.day);
    S.cheers = lsGet('cheers') || [];
    S.priv = DEFP; S.bdgs = BDGS;
  }
}

async function saveDay(){
  if(!S.day) return;
  lsSet('day-'+TODAY, S.day);
  if(db) dbSet('days',TODAY,S.day);
}
async function saveCfg(){
  lsSet('cfg',{priv:S.priv,bdgs:S.bdgs});
  if(db) dbSet('settings','app',{priv:S.priv,bdgs:S.bdgs});
}
async function loadCalDay(dt){
  if(S.calD[dt]!==undefined) return;
  var v = lsGet('day-'+dt);
  if(!v && db){
    v = await dbGet('days',dt);
    if(v) lsSet('day-'+dt,v);
  }
  S.calD[dt] = v || null;
}
async function addCheer(name,msg){
  var c = {name:name,msg:msg,ts:new Date().toISOString()};
  S.cheers = [c].concat(S.cheers||[]).slice(0,40);
  lsSet('cheers',S.cheers);
  if(db){
    try{await db.collection('cheers').add({name:name,msg:msg,ts:firebase.firestore.FieldValue.serverTimestamp()});}
    catch(e){}
  }
}

function latestMood(d){var m=d&&d.moods&&Array.isArray(d.moods)?d.moods:[];return m.length?m[m.length-1]:null;}

function MC_bg(i){return(i!=null&&i>=0&&i<=4)?MCL[i]:'#f3f0f9';}
function fmtT(ts){
  if(!ts) return '';
  var d=new Date(ts),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+(m<10?'0'+m:m)+' '+ap;
}

// ── CYCLE ──────────────────────────────────────────────
function cycle(){
  var now=new Date(),day=Math.floor((now-LC)/86400000)+1,tot=Math.floor((NC-LC)/86400000),dtn=Math.ceil((NC-now)/86400000),pct=Math.min(100,Math.round(day/tot*100));
  var z,zc,msg,bg;
  if(day<=3){z='Rough Zone';zc='#c95068';msg='Post-chemo roughies. Nausea may peak. Be gentle today.';bg='#faedf0';}
  else if(day<=7){z='Early Recovery';zc='#c9920a';msg='Still bumpy but trending up. Counts dropping, watch for fever.';bg='#fdf5e0';}
  else if(day<=14){z='Nadir Zone';zc='#7c5cdb';msg='Counts at their lowest. No sick visitors. Watch for fever over 100.4F.';bg='#ede8f9';}
  else{z='Building Back';zc='#4a8c6f';msg='Counts coming back up. Body is doing the thing.';bg='#e8f4ee';}
  return {day:day,tot:tot,dtn:dtn,pct:pct,z:z,zc:zc,msg:msg,bg:bg};
}

  var app=document.getElementById('app'),nav=document.getElementById('nav');

  if(S.v==='pw')    {app.innerHTML=vPw();    nav.style.display='none';return;}
  if(S.v==='ob')    {app.innerHTML=vOb();    nav.style.display='none';return;}
  nav.style.display='flex';
  var nbs=document.querySelectorAll('.nb');
  for(var i=0;i<nbs.length;i++) nbs[i].classList.toggle('on',nbs[i].dataset.t===S.tab);
  var old=document.getElementById('cin');

  if(S.wo){app.innerHTML=vWoAct();return;}

}

function exD(e){return e.dur||(e.r*3);}
function startWo(type){
  var ex=type==='mobility'?MOB:STR;
  S.wo={type:type,ex:ex,i:0,set:1,ph:'ready',t:0,total:Date.now()};
  S.woi=setInterval(tickWo,1000);R();
}
function beginEx(){if(!S.wo)return;S.wo.ph='work';S.wo.t=exD(S.wo.ex[S.wo.i]);R();}
function tickWo(){
  if(!S.wo||S.wo.ph==='ready') return;
  var w=S.wo;w.t--;
  if(w.t<=0){
    var e=w.ex[w.i];
    if(w.ph==='work'){
      if(e.s&&w.set<e.s){w.ph='rest';w.t=20;}
      else{w.i++;if(w.i>=w.ex.length){doneWo();return;}w.set=1;w.ph='ready';}
    } else {w.set++;w.ph='ready';}
  }
  R();
}
async function doneWo(){
  clearInterval(S.woi);
  var dur=Math.round((Date.now()-S.wo.total)/60000),done=S.wo.ex.length,type=S.wo.type;
  S.wo=null;S.day=S.day||empty();
  S.day.wos=(S.day.wos||[]).concat({type:type,dur:dur,done:done});
  await saveDay();R();
  toast(type==='mobility'?'Mobility done. Peepsqueak is proud.':'Strength done. Peepsi is proud.');
}

function vCal(){
  var c=cycle(),NCD=NC.toISOString().split('T')[0],days=[],strip='';
  for(var i=0;i<c.tot;i++){
    var d2=new Date(LC);d2.setDate(d2.getDate()+i);
    var dt=d2.toISOString().split('T')[0];
    days.push({dt:dt,lbl:d2.toLocaleDateString('en-US',{month:'short',day:'numeric'}),dn:i+1,tod:dt===TODAY,chm:dt===NCD});
    loadCalDay(dt);
  }
  for(var i=0;i<days.length;i++){
    var d2=days[i],dm=S.calD[d2.dt],ms=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);
    var avg=ms.length?Math.round(ms.reduce(function(s,m){return s+(m.mood||0);},0)/ms.length):null;
    strip+='<div class="cd'+(d2.tod?' tod':'')+(d2.chm?' chm':'')+(dm?' has':'')+'" onclick="selDay(\''+d2.dt+'\')" style="'+(S.cd===d2.dt?'border-color:var(--pu);':'')+'"><div style="font-size:10px;font-weight:700;color:var(--ink3);">Day '+d2.dn+'</div><div style="font-size:13px;font-weight:700;margin:2px 0;">'+d2.lbl+'</div>'
      +(d2.chm?'<div style="font-size:9px;font-weight:800;color:var(--ro);text-transform:uppercase;">Chemo</div>':'')
      +(d2.tod?'<div style="font-size:9px;font-weight:800;color:var(--pu);text-transform:uppercase;">Today</div>':'')
      +'<div class="dots">'
      +(dm&&dm.meds&&dm.meds.am?'<div class="dot5" style="background:var(--pu);"></div>':'')
      +(avg!=null?'<div class="dot5" style="background:'+MC[Math.min(4,Math.max(0,avg))]+';"></div>':'')
      +(dm&&(dm.wos||[]).length?'<div class="dot5" style="background:var(--te);"></div>':'')
      +'</div></div>';
  }
  var sel=S.cd||TODAY,sd=S.calD[sel],selMoods=sd&&Array.isArray(sd.moods)?sd.moods:(sd&&sd.feel&&sd.feel.mood!=null?[{mood:sd.feel.mood,ts:sel+'T12:00:00',notes:''}]:[]);
  var detail='';
  if(sd){
    var items='';
    for(var i=0;i<selMoods.length;i++){
      var m=selMoods[i];
      items+='<div class="tli"><div class="tld" style="background:'+MC_bg(m.mood)+'"><i class="fa-regular fa-face-smile" style="font-size:13px;color:'+MC_color(m.mood)+'"></i></div>'
        +'<div class="tlb"><div class="tlt">'+fmtT(m.ts)+'</div><div class="tll" style="color:'+MC_color(m.mood)+';">'+ML[m.mood]+'</div>'
        +(m.notes?'<div class="tls" style="font-style:italic;">"'+m.notes+'"</div>':'')
        +'</div></div>';
    }
    detail='<div class="card mt3">'
      +'<div style="font-family:var(--serif);font-size:18px;font-style:italic;color:var(--pu);margin-bottom:12px;">'+new Date(sel+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>'
      +(selMoods.length?'<div class="lbl mb2">Mood ('+selMoods.length+' check-in'+(selMoods.length!==1?'s':'')+')</div><div class="tl">'+items+'</div>':'<div style="font-size:14px;color:var(--ink3);">No mood logs this day</div>')
      +((sd.food||[]).length?'<div style="font-size:14px;margin-top:8px;"><span style="font-weight:600;">Food:</span> '+sd.food.map(function(x){return x.item;}).join(', ')+'</div>':'')
      +((sd.wos||[]).length?'<div style="font-size:14px;margin-top:8px;"><span style="font-weight:600;">Training:</span> '+sd.wos.map(function(w){return w.type;}).join(', ')+'</div>':'')
      +(sd.move&&sd.move.out?'<div style="font-size:14px;margin-top:8px;">Went outside</div>':'')
      +'</div>';
  } else {
    detail='<div class="empty-s mt3"><i class="fa-regular fa-calendar-days"></i><div style="font-family:var(--serif);font-size:18px;color:var(--ink2);margin-bottom:8px;">'+(sel===TODAY?'Log something to see it here':'Nothing logged this day')+'</div></div>';
  }
  return '<div class="fi"><div class="ph">'
    +'<div style="font-family:var(--serif);font-size:20px;font-style:italic;">Cycle Calendar</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-top:2px;">Day '+c.day+' of '+c.tot+' · next infusion in '+c.dtn+' days</div></div>'
    +'<div style="padding:12px 16px 0;">'
    +'<div class="cal-strip">'+strip+'</div>'
    +'<div style="display:flex;gap:16px;font-size:11px;font-weight:600;color:var(--ink3);padding:8px 0 12px;">'
    +'<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pu);margin-right:4px;"></span>Meds</span>'
    +'<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--te);margin-right:4px;"></span>Training</span>'
    +'<span style="color:var(--ro);">● Chemo</span></div>'
    +detail+'</div></div>';
}

// ── SQUAD ──────────────────────────────────────────────
function vSquad(){
  var d=S.day||empty(),p=S.priv||DEFP,moods=d.moods||[],lm=latestMood(d);
  var cheersHtml='';
  if(S.cheers.length){
    for(var i=0;i<S.cheers.length;i++){
      var c=S.cheers[i];
      cheersHtml+='<div class="cheer-c"><div class="flex fca g3 mb2">'
        +'<div class="peep-ph" style="width:34px;height:34px;background:var(--pu);font-size:13px;">'+(c.name||'?')[0].toUpperCase()+'</div>'
        +'<div style="font-size:14px;font-weight:700;color:var(--pud);">'+c.name+'</div></div>'
        +'<div style="font-size:14px;line-height:1.6;">'+c.msg+'</div></div>';
    }
  }
  var badgesHtml='<div class="badge-g">';
  var bdgs=S.bdgs||BDGS;
  for(var i=0;i<bdgs.length;i++){
    var b=bdgs[i];
    badgesHtml+='<div class="bc'+(b.e?' e':'')+'"><i class="fa-'+(b.e?'solid':'regular')+' fa-'+(b.e?'star':'lock')+'" style="font-size:24px;color:'+(b.e?'var(--am)':'var(--ink4)')+';margin-bottom:8px;display:block;"></i>'
      +'<div style="font-family:var(--serif);font-size:14px;margin-bottom:4px;">'+b.n+'</div>'
      +'<div style="font-size:11px;color:var(--ink3);">'+b.d+'</div>'
      +(b.e?'':'<div style="font-size:11px;color:var(--ink4);margin-top:4px;">Locked</div>')+'</div>';
  }
  badgesHtml+='</div>';
  return '<div class="fi">'
    +'<div class="ph" style="background:var(--tel);">'
    +'<div style="display:flex;align-items:center;gap:12px;">'
    +'<div style="width:40px;height:40px;">'+SQ+'</div>'
    +'<div><div style="font-family:var(--serif);font-size:20px;font-style:italic;">Peepsqueak\'s Corner</div>'
    +'<div style="font-size:12px;color:var(--ink3);">'+S.cheers.length+' cheers in the squad</div></div></div></div>'
    +'<div class="px">'
    +'<div class="sec"><div class="lbl mb2">What my squad sees today</div>'
    +'<div class="card" style="background:var(--tel);border-color:rgba(46,191,165,.3);">'
    +(p.poop&&d.demon&&d.demon.length?'<div style="font-size:14px;margin-bottom:8px;">She went to the bathroom ('+d.demon.length+'x)</div>':'')
    +(p.mood&&lm&&lm.mood!=null?'<div style="font-size:14px;margin-bottom:8px;">Latest vibe: <span style="font-weight:600;color:'+MC_color(lm.mood)+';">'+ML[lm.mood]+'</span><span style="color:var(--ink3);font-size:12px;"> ('+fmtT(lm.ts)+')</span></div>':'')
    +(p.mood&&moods.length>1?'<div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">'+moods.length+' mood check-ins today</div>':'')
    +(p.sym&&lm&&lm.nausea!=null?'<div style="font-size:14px;margin-bottom:8px;">Nausea: '+['Bad','Medium','Mild','None'][lm.nausea]+' · Pain: '+['Bad','Medium','Mild','None'][lm.pain||0]+'</div>':'')
    +(p.food&&d.food&&d.food.length?'<div style="font-size:14px;margin-bottom:8px;">Ate: '+d.food.slice(0,3).map(function(x){return x.item;}).join(', ')+'</div>':'')
    +(p.wo&&d.wos&&d.wos.length?'<div style="font-size:14px;">Completed a '+d.wos[0].type+' circuit</div>':'')
    +(!d.demon&&!d.food&&!lm?'<div style="font-size:14px;color:var(--ink2);font-style:italic;">Nothing logged yet today</div>':'')
    +'</div></div>'
    +'<div class="sec"><div class="lbl mb2">Leave a cheer</div>'
    +'<div class="card"><input class="inp mb3" type="text" id="cn" placeholder="Your name"><textarea class="inp mb3" id="cm" rows="3" placeholder="Tell Kendra something amazing..." style="height:80px;"></textarea><button class="btn btn-te" onclick="sendCheer()"><i class="fa-regular fa-heart"></i> Send cheer</button></div></div>'
    +'<div class="sec"><div class="lbl mb2">The cheer wall</div>'
    +(cheersHtml||'<div class="empty-s"><i class="fa-regular fa-heart"></i><div style="font-family:var(--serif);font-size:18px;color:var(--ink2);margin-bottom:8px;">No cheers yet</div><div style="font-size:13px;color:var(--ink3);">Be the first</div></div>')
    +'</div>'
    +'<div class="sec"><div class="lbl mb2">Badges earned</div>'+badgesHtml+'</div>'
    +'<div style="height:24px;"></div></div></div>';
}

// ── EVENT HANDLERS ─────────────────────────────────────
async function togMed(p){S.day=S.day||empty();S.day.meds[p]=!S.day.meds[p];await saveDay();R();if(S.day.meds[p])toast(p==='am'?'Morning meds done.':'Evening meds done.');}
async function addFood(item){S.day=S.day||empty();(S.day.food=S.day.food||[]).push({item:item,kd:undefined});await saveDay();R();}
async function addCustomFood(){var e=document.getElementById('fc');if(!e||!e.value.trim())return;await addFood(e.value.trim());}
async function keptDown(i,v){if(!S.day||!S.day.food)return;S.day.food[i].kd=v;await saveDay();R();toast(v?'Kept it down!':'Rinse and wait 30 min.');}
async function rmFood(i){if(!S.day||!S.day.food)return;S.day.food.splice(i,1);await saveDay();R();}
function selBris(n){selB=n;var bs=document.querySelectorAll('.bb');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');var el=document.getElementById('b'+n);if(el)el.classList.add('on');}
function togTag(id){var idx=selT.indexOf(id);if(idx>=0)selT.splice(idx,1);else selT.push(id);var els=document.querySelectorAll('[id^=dt]');for(var i=0;i<els.length;i++)els[i].classList.toggle('on',selT.indexOf(els[i].id.replace('dt',''))>=0);}
async function logDemon(){
  if(selB===null){toast('Pick a Bristol type first');return;}
  S.day=S.day||empty();(S.day.demon=S.day.demon||[]).push({b:selB,tags:selT.slice()});
  var sb=selB,st=selT.slice();
  await saveDay();selB=null;selT=[];
  var msg=null;
  if(st.indexOf('spicy')>=0||sb>=6) msg='Lava mode. Vaseline barrier cream, Pedialyte, avoid acidic foods.';
  else if(st.indexOf('grumbles')>=0) msg='Warning system on. Stay close, keep loperamide handy.';
  else if(st.indexOf('shart')>=0) msg='Textbook GemTax. Vaseline undies routine is your friend.';
  else if(st.indexOf('winner')>=0||sb===4) msg='Solid W. A normal demon is a genuine victory.';
  R();
  if(msg){var te=document.getElementById('demon-tip');if(te)te.innerHTML='<div class="card mt3" style="background:var(--pul);border-color:var(--pum);"><div style="font-size:14px;line-height:1.6;">'+msg+'</div></div>';}
  toast('Demon logged.');
}
async function rmDemon(i){if(!S.day||!S.day.demon)return;S.day.demon.splice(i,1);await saveDay();R();}
async function setHyd(v){S.day=S.day||empty();S.day.hyd=v;await saveDay();R();}
async function addHyd(d){S.day=S.day||empty();S.day.hyd=Math.max(0,(S.day.hyd||0)+d);await saveDay();R();if(S.day.hyd>=8)toast('Hydration hero!');}
async function addLaps(d){S.day=S.day||empty();S.day.move=S.day.move||{laps:0,dist:'',out:false};S.day.move.laps=Math.max(0,(S.day.move.laps||0)+d);await saveDay();R();if(S.day.move.laps>=2)toast('2 laps done!');}
async function togOut(v){S.day=S.day||empty();S.day.move=S.day.move||{laps:0,dist:'',out:false};S.day.move.out=v;await saveDay();R();if(v)toast('Outside achieved.');}
async function saveDist(){var e=document.getElementById('dst');if(!e)return;S.day=S.day||empty();S.day.move=S.day.move||{laps:0,dist:'',out:false};S.day.move.dist=e.value.trim();await saveDay();toast('Distance saved.');}
async function sendCheer(){
  var n=(document.getElementById('cn')||{}).value||'';
  var m=(document.getElementById('cm')||{}).value||'';
  if(!n.trim()||!m.trim()){toast('Name and message needed');return;}
  try{await addCheer(n.trim(),m.trim());R();toast('Cheer sent!');}
  catch(e){toast('Could not send, check connection');}
}
function selDay(dt){S.cd=dt;loadCalDay(dt).then(function(){R();});}
function go(tab){S.tab=tab;S.lt='food';R();}

function doExport(){
  var d=S.day||empty(),c=cycle(),moods=d.moods||[],lm=latestMood(d);
  var date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  var lines=['KENDRA DAILY LOG -- '+date,'Cycle Day '+c.day+' of '+c.tot+' ('+c.z+')','','Meds: AM '+(d.meds&&d.meds.am?'Done':'Not done')+' | PM '+(d.meds&&d.meds.pm?'Done':'Not done')];
  if(moods.length){lines.push('');lines.push('Mood check-ins ('+moods.length+'x):');for(var i=0;i<moods.length;i++){var m=moods[i];lines.push('  - '+fmtT(m.ts)+' -- '+ML[m.mood]+(m.nausea!=null?' / Nausea: '+['Bad','Medium','Mild','None'][m.nausea]:'')+(m.pain!=null?' / Pain: '+['Bad','Medium','Mild','None'][m.pain]:'')+(m.notes?' / "'+m.notes+'"':''));}}
  if((d.food||[]).length){lines.push('');lines.push('Food ('+d.food.length+' nibbles):');for(var i=0;i<d.food.length;i++)lines.push('  - '+d.food[i].item+' -- '+(d.food[i].kd===true?'kept':d.food[i].kd===false?'lost':'untracked'));}
  lines.push('Hydration: '+(d.hyd||0)+' glasses');
  if((d.demon||[]).length){lines.push('');lines.push('Bowel movements ('+d.demon.length+'x):');for(var i=0;i<d.demon.length;i++){var de=d.demon[i],bm=null;for(var j=0;j<BRIT.length;j++){if(BRIT[j].n===de.b){bm=BRIT[j];break;}}lines.push('  - Bristol '+de.b+' ('+(bm?bm.l:'?')+') -- '+((de.tags||[]).join(', ')||'no tags'));}}
  var mv=d.move||{};if(mv.laps)lines.push('Laps: '+mv.laps);if(mv.dist)lines.push('Distance: '+mv.dist);if(mv.out)lines.push('Went outside: yes');
  if((d.wos||[]).length)lines.push('Training: '+d.wos.map(function(w){return w.type+' ('+w.dur+'m)';}).join(', '));
  var txt=lines.join('\n');
  var el=document.getElementById('exp-out');
  if(el){
    el.style.display='block';
    el.innerHTML='<div style="background:var(--raised);border-radius:10px;padding:16px;border:1.5px dashed var(--div);font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:monospace;color:var(--ink);margin-bottom:12px;">'+txt+'</div>'
      +'<button class="btn btn-ink btn-sm" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent).then(function(){toast(\'Copied!\');})"><i class="fa-regular fa-copy"></i> Copy to clipboard</button>';
  }
}

function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

// ── INIT ───────────────────────────────────────────────
async function init(){
  try{
    var saved=localStorage.getItem('gk-u');
    if(saved){try{S.user=JSON.parse(saved);}catch(e){}}
    R();
    await loadAll();
    S.v=S.user?'app':'pw';
    R();
  }catch(e){
    console.error('Init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif;text-align:center;max-width:400px;margin:0 auto;">'
      +'<div style="font-size:32px;margin-bottom:16px;"><i class="fa-regular fa-triangle-exclamation"></i></div>'
      +'<div style="font-size:18px;font-weight:600;margin-bottom:8px;">Something went wrong</div>'
      +'<div style="font-size:14px;color:#666;">'+e.message+'</div></div>';
  }
}
init();
</script>
