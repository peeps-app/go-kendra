function renderWoOverlay(){
  var w=S.wo;if(!w) return;
  var ov=document.getElementById('wo-overlay');
  if(!ov) return;
  var ex=w.ex[w.i];
  var mob=w.type==='mobility',adv=w.type==='advanced';
  var accentCol='var(--pu)';
  ov.style.background='var(--bg)';
  ov.style.display='flex';
  var pf0=document.getElementById('wo-progress-fill'); if(pf0) pf0.style.background=accentCol;
  var mb0=document.getElementById('wo-main-btn'); if(mb0) mb0.style.background=accentCol;
  // Phase label
  var phLabel=document.getElementById('wo-phase-label');
  if(phLabel) phLabel.textContent=(mob?'Mobility':'Strength')+(adv?' · Advanced':'')+' · '+(w.i+1)+' of '+w.ex.length;
  // Progress bar
  var pf=document.getElementById('wo-progress-fill');
  if(pf){
    // Progress across all sets of all exercises, not just exercise index.
    var totalSets=0, doneSets=0;
    for(var _x=0;_x<w.ex.length;_x++){
      var _s=(w.ex[_x].s||1);
      totalSets+=_s;
      if(_x<w.i) doneSets+=_s;
      else if(_x===w.i) doneSets+=(w.set-1)+((w.ph==='rest')?1:0);
    }
    pf.style.width=Math.round(doneSets/totalSets*100)+'%';
  }
  // Exercise name
  var nameEl=document.getElementById('wo-exercise-name');
  if(nameEl) nameEl.textContent=w.ph==='rest'?'Rest':ex.n;
  // Equipment
  var eqEl=document.getElementById('wo-equipment');
  if(eqEl){
    var hdrTxt='';
    if(w.ph==='rest') hdrTxt='Resting';
    else if(ex.s&&ex.r) hdrTxt='Set '+w.set+' of '+ex.s;
    else if(ex.r) hdrTxt='Single set';
    else if(ex.dur) hdrTxt='Hold';
    eqEl.textContent=hdrTxt;
    eqEl.style.color='var(--pu)';
  }
  // Note
  var noteEl=document.getElementById('wo-note');
  var noteWrap=document.getElementById('wo-note-wrap');
  if(noteEl&&noteWrap){
    if(ex.note&&w.ph!=='rest'){noteEl.textContent=ex.note;noteWrap.style.display='block';}
    else noteWrap.style.display='none';
  }
  // Rep/set or timer
  var repEl=document.getElementById('wo-rep-display');
  var timerEl=document.getElementById('wo-timer-display');
  var timerLbl=document.getElementById('wo-timer-label');
  if(repEl&&timerEl&&timerLbl){
    // Single, consistent number display for every phase.
    timerEl.style.display='none';
    timerLbl.style.display='none';
    repEl.replaceChildren();
    var bigNum, unitTxt, setTxt='';
    if(w.ph==='rest'){
      bigNum=('0'+Math.floor(w.t/60)).slice(-2)+':'+('0'+(w.t%60)).slice(-2);
      unitTxt='rest';
    } else if(ex.dur){
      // Timed exercise — countdown while working, target while ready.
      if(w.ph==='work'){ bigNum=('0'+Math.floor(w.t/60)).slice(-2)+':'+('0'+(w.t%60)).slice(-2); }
      else { bigNum=ex.dur; }
      unitTxt='seconds';
    } else {
      // Rep exercise — static target, persists until she advances.
      bigNum=ex.r;
      unitTxt='reps';
    }
    var bn=document.createElement('div');
    bn.style.cssText='font-size:88px;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;padding:4px 0;display:block;';
    bn.textContent=bigNum;
    repEl.appendChild(bn);
    var ul=document.createElement('div');
    ul.style.cssText='font-size:14px;font-weight:600;color:var(--ink3);margin-top:8px;';
    ul.textContent=unitTxt;
    repEl.appendChild(ul);
    if(setTxt){
      var st=document.createElement('div');
      st.style.cssText='font-size:13px;font-weight:600;color:var(--ink3);margin-top:10px;';
      st.textContent=setTxt;
      repEl.appendChild(st);
    }
  }

  // Tip
  var tipEl=document.getElementById('wo-tip');
  if(tipEl) tipEl.textContent=w.ph==='rest'?'':ex.tip?'“'+ex.tip+'”':'';
  // Main button
  var mainBtn=document.getElementById('wo-main-btn');
  if(mainBtn){
    if(w.ph==='ready'){
      mainBtn.textContent='Start';
      mainBtn.onclick=beginEx;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
    } else if(w.ph==='rest'){
      mainBtn.textContent='Skip rest';
      mainBtn.onclick=skipRest;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
    } else if(w.ph==='work'&&isReps(ex)){
      mainBtn.textContent='Done';
      mainBtn.onclick=completeSet;
      mainBtn.style.background=accentCol;mainBtn.style.color='#fff';
      mainBtn.disabled=false;mainBtn.style.opacity='1';mainBtn.style.cursor='pointer';
    } else {
      // Timed exercise mid-countdown — button stays in place, shows passive state.
      mainBtn.textContent='Timer running\u2026';
      mainBtn.onclick=null;
      mainBtn.style.background='var(--raised)';mainBtn.style.color='var(--ink3)';
      mainBtn.disabled=true;mainBtn.style.opacity='1';mainBtn.style.cursor='default';
    }
    if(w.ph!=='work'||isReps(ex)){ mainBtn.disabled=false;mainBtn.style.cursor='pointer'; }
    mainBtn.style.display='block';
  }
  // Skip rest
  var skipBtn=document.getElementById('wo-skip-btn');
  if(skipBtn){
    if(w.ph==='work'){
      skipBtn.replaceChildren();
      var skLbl=document.createElement('span');skLbl.textContent='Skip exercise';
      var skArr=document.createElement('span');skArr.style.cssText='display:inline-flex;vertical-align:-2px;margin-left:5px;';
      skArr.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      skBtnInner(skipBtn,skLbl,skArr);
      skipBtn.onclick=skipEx;
      skipBtn.style.display='flex';
    } else {
      skipBtn.style.display='flex';
      skipBtn.style.visibility='hidden';
    }
    if(w.ph==='work') skipBtn.style.visibility='visible';
  }
  function skBtnInner(el,a,b){ el.appendChild(a); el.appendChild(b); }
  // Up next
  var nxtDiv=document.getElementById('wo-up-next');
  var nxtName=document.getElementById('wo-up-next-name');
  var nxt=w.i+1<w.ex.length?w.ex[w.i+1]:null;
  if(nxtDiv&&nxtName){
    if(nxt&&w.ph==='ready'){nxtName.textContent=nxt.n;nxtDiv.style.display='block';}
    else nxtDiv.style.display='none';
  }
}

function saveEvent(){

  if(!f.title||!f.title.trim()){toast('Add a title');return;}
  var volEl=document.getElementById('ev-vol');var evVol=volEl&&parseFloat(volEl.value)>0?parseFloat(volEl.value):null;

      return {id:e.id,date:S.evDate,title:f.title.trim(),type:f.type||'appt',time:f.time||'',arriveBy:f.arriveBy||'',location:f.location||'',provider:f.provider||'',notes:f.notes||'',vol:evVol||undefined};
    });

    var _m=document.getElementById('add-event-modal');if(_m)_m.style.display='none';

  }

  if(f.type==='chemo'){localStorage.setItem('gk-lc',S.evDate);recomputeCycleDates();}
  S.events=(S.events||[]).concat(ev);
  // Paracentesis: auto-create 5-day watch windows (days 3-6 post-procedure)

    for(var wi=3;wi<=6;wi++){
      var wd=new Date(base);wd.setDate(wd.getDate()+wi);

      S.events.push({id:Date.now()+wi,date:wdt,title:'Tummy watch (day '+wi+' post-para)',type:'para-watch',time:'',notes:'Monitor for bloating. May need paracentesis if uncomfortable.',soft:true});
    }
    toast('Paracentesis logged — watch windows added for days 3-6');
  } else {
    toast('Event added');
  }

function _segIds(which){
  return which==='appt'
    ? {h:'ev-h',m:'ev-m',am:'ev-ap-am',pm:'ev-ap-pm'}
    : {h:'ev-ah',m:'ev-am',am:'ev-aap-am',pm:'ev-aap-pm'};
}
function _segGet(which){
  var id=_segIds(which);
  var hEl=document.getElementById(id.h), mEl=document.getElementById(id.m);
  if(!hEl||!mEl) return '';
  var amOn=document.getElementById(id.am).classList.contains('on');
  var pmOn=document.getElementById(id.pm).classList.contains('on');
  var h=parseInt(hEl.value,10), m=parseInt(mEl.value,10);
  if(isNaN(h)||(!amOn&&!pmOn)) return '';
  if(isNaN(m)) m=0;
  if(h<1) h=1; if(h>12) h=12; if(m>59) m=59;
  var h24=h%12; if(pmOn) h24+=12;
  return String(h24).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function _segSet(which,hhmm){
  var id=_segIds(which);
  var hEl=document.getElementById(id.h), mEl=document.getElementById(id.m);
  var amB=document.getElementById(id.am), pmB=document.getElementById(id.pm);
  if(!hEl) return;
  if(!hhmm||hhmm.indexOf(':')<0){ hEl.value='';mEl.value='';amB.classList.remove('on');pmB.classList.remove('on'); return; }
  var p=hhmm.split(':'), h=parseInt(p[0],10), m=parseInt(p[1],10);
  var ap=h>=12?'PM':'AM', h12=h%12||12;
  hEl.value=String(h12); mEl.value=String(m).padStart(2,'0');
  amB.classList.toggle('on',ap==='AM'); pmB.classList.toggle('on',ap==='PM');
}
function setAP(which,ap){
  var id=_segIds(which);
  document.getElementById(id.am).classList.toggle('on',ap==='AM');

}
function onTimeSeg(which){
  S.evForm=S.evForm||{};

    S.evForm.time=v;

      // Paracentesis needs 30 min early so the Dilaudid pain bolus is given before the procedure.
      var lead=(S.evForm.type==='para')?30:15;
      var p=v.split(':'), mins=parseInt(p[0],10)*60+parseInt(p[1],10)-lead;

      var ab=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');

    }

    S.evForm.arriveBy=v;
  }
}

function exportICS(){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Go Kendra//EN'];
  (S.events||[]).forEach(function(e){
    var dt=e.date.replace(/-/g,'');
    var dtStr=e.time?dt+'T'+e.time.replace(':','')+'00':dt;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+e.id+'@gokendra');
    lines.push('DTSTART'+(e.time?'':'VALUE=DATE')+':'+dtStr);
    lines.push('SUMMARY:'+e.title+(e.type==='chemo'?' (Chemo)':e.type==='appt'?' (Appt)':''));
    if(e.notes)lines.push('DESCRIPTION:'+e.notes);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='kendra-appointments.ics';a.click();
  URL.revokeObjectURL(url);
  toast('Calendar file downloaded');
}

function confetti(intensity){
  var n = intensity==='big' ? 80 : 40;
  var wrap = document.createElement('div');
  wrap.className = 'confetti-wrap';
  document.body.appendChild(wrap);
  for(var i=0;i<n;i++){
    (function(delay){
      setTimeout(function(){
        var p = document.createElement('div');
        p.className = 'cp';
        var color = CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)];
        var size = 6 + Math.random()*8;
        var isCircle = Math.random() > 0.6;
        var isRect = !isCircle && Math.random() > 0.5;
        p.style.cssText = 'left:'+Math.random()*100+'%;'
          +'width:'+(isRect?size*0.5:size)+'px;height:'+(isRect?size*1.8:size)+'px;'
          +'background:'+color+';'
          +'border-radius:'+(isCircle?'50%':'2px')+';'
          +'animation-duration:'+(1.4+Math.random()*1.2)+'s;'
          +'animation-delay:0s;';
        wrap.appendChild(p);
      }, delay);
    })(i * 18);
  }
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);}, 3200);
}

        <div style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;">Notes</div>
        <textarea id="cin-notes-input" rows="2" placeholder="Anything on your mind..." oninput="S.cinD.notes=this.value" style="width:100%;padding:12px;border:1.5px solid var(--div);border-radius:10px;font-family:var(--sans);font-size:14px;resize:none;outline:none;height:68px;background:var(--card);box-sizing:border-box;"></textarea>
      </div>
      <button onclick="saveCin()" style="width:100%;height:48px;background:var(--ink);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Save check-in
      </button>
    </div>
  </div>
</div>


<div id="wo-overlay" style="display:none;position:fixed;inset:0;z-index:500;flex-direction:column;background:var(--bg);">

  <!-- TOP ZONE — fixed: quit, progress, phase label -->
  <div style="flex-shrink:0;padding:16px 20px 0;">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="wo-quit" onclick="quitWo()" style="flex-shrink:0;background:transparent;border:1.5px solid var(--div);color:var(--ink3);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);">Quit</button>
      <div id="wo-progress-wrap" style="flex:1;height:6px;background:var(--div);border-radius:99px;overflow:hidden;"><div id="wo-progress-fill" style="height:100%;background:var(--pu);border-radius:99px;width:0%;transition:width .35s;"></div></div>
    </div>
    <div id="wo-phase-label" style="font-size:12px;font-weight:600;color:var(--ink3);margin-top:12px;text-align:center;"></div>
  </div>

  <!-- CENTER ZONE — the active exercise as one anchored card. -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 8px;min-height:0;">

    <!-- the exercise card — name, number, set bound together as one unit -->
    <div style="width:100%;max-width:360px;background:var(--card);border:1px solid var(--div);border-radius:var(--r-lg);box-shadow:0 4px 20px rgba(76,29,149,.06);">

      <!-- card header — exercise name -->
      <div style="padding:18px 20px 14px;border-bottom:1px solid var(--div);text-align:center;">
        <div id="wo-equipment" style="font-size:12px;font-weight:700;color:var(--pu);margin-bottom:6px;min-height:15px;"></div>
        <div id="wo-exercise-name" style="font-family:var(--serif);font-size:26px;font-style:italic;color:var(--ink);line-height:1.15;"></div>
      </div>

      <!-- card body — the number, the focal point -->
      <div style="padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="wo-rep-display" style="text-align:center;width:100%;"></div>
        <div id="wo-timer-display" style="display:none;"></div>
        <div id="wo-timer-label" style="display:none;"></div>
      </div>

      <!-- card footer — note, only when present -->
      <div id="wo-note-wrap" style="display:none;padding:0 20px 18px;text-align:center;">
        <div id="wo-note" style="font-size:12.5px;color:var(--ink2);background:var(--raised);border-radius:10px;padding:8px 12px;line-height:1.45;"></div>
      </div>

    </div>

    <!-- coaching tip — quiet, below the card, clearly secondary -->
    <div id="wo-tip" style="font-size:12.5px;font-style:italic;color:var(--ink3);max-width:320px;line-height:1.5;text-align:center;margin-top:16px;min-height:18px;"></div>

  </div>

  <!-- BOTTOM ZONE — fixed-height action region. Every slot reserves its space; nothing shifts. -->
  <div style="flex-shrink:0;padding:12px 20px 30px;display:flex;flex-direction:column;align-items:center;">
    <!-- up-next slot — fixed height, content toggles inside -->
    <div style="height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
      <div id="wo-up-next" style="text-align:center;visibility:hidden;">
        <span style="font-size:12px;font-weight:600;color:var(--ink4);">Up next&nbsp;&nbsp;</span>
        <span id="wo-up-next-name" style="font-size:13px;font-weight:700;color:var(--ink3);"></span>
      </div>
    </div>
    <!-- primary button — ALWAYS in this exact position -->
    <button id="wo-main-btn" style="width:100%;max-width:360px;background:var(--pu);color:#fff;font-size:16px;font-weight:700;border-radius:14px;height:54px;border:none;cursor:pointer;font-family:var(--sans);"></button>
    <!-- skip slot — fixed height, content toggles inside -->
    <div style="height:20px;display:flex;align-items:center;justify-content:center;margin-top:12px;">
      <div id="wo-skip-btn" style="font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:var(--sans);display:none;align-items:center;justify-content:center;"></div>
    </div>
  </div>

</div>


<div id="dose-modal" style="display:none;position:fixed;inset:0;z-index:320;background:rgba(22,27,51,.5);flex-direction:column;justify-content:flex-end;align-items:center;" onclick="closeDoseModal()">
  <div onclick="event.stopPropagation()" style="background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:430px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div id="dose-modal-title" style="font-family:var(--serif);font-size:20px;font-style:italic;">Log dose</div>
      <button onclick="closeDoseModal()" style="background:none;border:none;cursor:pointer;color:var(--ink3);padding:4px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="lbl" style="margin-bottom:8px;">Time taken</div>
    <input id="dose-modal-time" type="time" class="tinp" style="height:50px;width:100%;box-sizing:border-box;margin-bottom:6px;">
    <div style="font-size:11px;color:var(--ink4);margin-bottom:20px;">Defaults to now — change it if the dose was taken earlier.</div>
    <button onclick="confirmDoseLog()" class="btn btn-ink" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Log dose
    </button>
  </div>
</div>

<div id="add-event-modal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(22,27,51,.5);flex-direction:column;justify-content:flex-end;align-items:center;" onclick="closeAddEvent()">
  <div id="add-event-sheet" onclick="event.stopPropagation()" style="background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div id="ae-heading" style="font-family:var(--serif);font-size:20px;font-style:italic;">Add Event</div>
      <button onclick="closeAddEvent()" style="background:none;border:none;cursor:pointer;color:var(--ink3);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--raised);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <!-- DATE -->
    <div style="margin-bottom:14px;">
      <div class="lbl" style="margin-bottom:8px;">Date</div>
      <input id="ev-date" type="date" class="inp" style="height:46px;width:100%;box-sizing:border-box;font-family:var(--sans);font-size:14px;" oninput="S.evDate=this.value">
    </div>

    <!-- QUICK FILL — primary path, most adds finish here -->
    <div id="ae-quick-wrap" style="margin-bottom:18px;">
      <div class="lbl" style="margin-bottom:8px;">Quick fill</div>
      <div id="ae-quick" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>

    <!-- WHAT -->
    <div style="margin-bottom:14px;">
      <div class="lbl" style="margin-bottom:8px;">Appointment</div>
      <input id="ev-title" type="text" class="inp" placeholder="Title, e.g. Infusion" style="height:46px;width:100%;box-sizing:border-box;margin-bottom:8px;" oninput="S.evForm.title=this.value">
      <div style="position:relative;">
        <select id="ev-type" class="inp" style="height:46px;width:100%;box-sizing:border-box;-webkit-appearance:none;-moz-appearance:none;appearance:none;padding-right:34px;font-family:var(--sans);font-size:14px;" onchange="pickAeType(this.value)"></select>
        <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink3);display:flex;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div id="ae-vol-row" style="display:none;margin-top:8px;">
        <input id="ev-vol" type="number" step="0.1" min="0" max="10" placeholder="Liters drained" class="inp" style="height:46px;width:100%;box-sizing:border-box;" oninput="S.evForm.vol=parseFloat(this.value)||0">
      </div>
    </div>

    <!-- WHEN -->
    <div style="margin-bottom:14px;">
      <div class="lbl" style="margin-bottom:8px;">When</div>
      <div style="margin-bottom:10px;">
        <div style="font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:5px;">APPOINTMENT</div>
        <div class="tseg">
          <input id="ev-h" class="tnum" inputmode="numeric" maxlength="2" placeholder="11" oninput="onTimeSeg('appt')">
          <span class="tcol">:</span>
          <input id="ev-m" class="tnum" inputmode="numeric" maxlength="2" placeholder="30" oninput="onTimeSeg('appt')">
          <button type="button" class="tap" id="ev-ap-am" onclick="setAP('appt','AM')">AM</button>
          <button type="button" class="tap" id="ev-ap-pm" onclick="setAP('appt','PM')">PM</button>
        </div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:5px;">ARRIVE BY</div>
        <div class="tseg">
          <input id="ev-ah" class="tnum" inputmode="numeric" maxlength="2" placeholder="11" oninput="onTimeSeg('arr')">
          <span class="tcol">:</span>
          <input id="ev-am" class="tnum" inputmode="numeric" maxlength="2" placeholder="15" oninput="onTimeSeg('arr')">
          <button type="button" class="tap" id="ev-aap-am" onclick="setAP('arr','AM')">AM</button>
          <button type="button" class="tap" id="ev-aap-pm" onclick="setAP('arr','PM')">PM</button>
        </div>
      </div>
      <div style="font-size:10.5px;color:var(--ink4);margin-top:6px;">Arrive-by fills 15 min earlier when you set the appointment time — adjust if needed.</div>
    </div>

    <!-- WHERE -->
    <div style="margin-bottom:14px;">
      <div class="lbl" style="margin-bottom:8px;">Where</div>
      <input id="ev-loc" type="text" class="inp" placeholder="Clinic or address" style="height:46px;width:100%;box-sizing:border-box;margin-bottom:8px;" oninput="S.evForm.location=this.value">
      <input id="ev-prov" type="text" class="inp" placeholder="Provider (optional)" style="height:46px;width:100%;box-sizing:border-box;" oninput="S.evForm.provider=this.value">
    </div>

    <!-- NOTES -->
    <div style="margin-bottom:20px;">
      <div class="lbl" style="margin-bottom:8px;">Notes</div>
      <textarea id="ev-notes" class="inp" rows="2" style="height:60px;width:100%;box-sizing:border-box;resize:none;" placeholder="Anything else" oninput="S.evForm.notes=this.value"></textarea>
    </div>

    <button onclick="saveEvent()" class="btn btn-ink" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Save event
    </button>
    <button id="ae-delete" onclick="deleteCurrentEvent()" style="display:none;align-items:center;justify-content:center;gap:7px;width:100%;height:46px;margin-top:10px;background:transparent;border:1.5px solid var(--ro);border-radius:var(--r-md);color:var(--ro);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Delete event
    </button>
  </div>
</div>
</body>
</html>
