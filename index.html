<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Go Kendra! 🐙</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Go Kendra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf6ff;
  --bg2: #f3e8ff;
  --card: #ffffff;
  --purple: #9b6dff;
  --purple-d: #7c4dff;
  --purple-l: #ede0ff;
  --pink: #ff79c8;
  --pink-l: #ffe0f4;
  --teal: #5dd9c1;
  --teal-l: #d0f7f1;
  --yellow: #ffd166;
  --yellow-l: #fff4d6;
  --orange: #ff9f43;
  --red: #ff6b6b;
  --green: #5cb85c;
  --text: #2d1b4e;
  --text2: #7c6d8e;
  --text3: #b8accc;
  --border: rgba(155,109,255,0.15);
  --r: 20px;
  --rs: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Nunito",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px;}
.screen{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:18px;border:1.5px solid var(--border);margin-bottom:14px;}
.card-sm{background:var(--card);border-radius:var(--rs);padding:14px;border:1.5px solid var(--border);margin-bottom:10px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:50px;padding:14px 28px;font-family:"Nunito",sans-serif;font-weight:800;font-size:16px;cursor:pointer;transition:all 0.18s;}
.btn:active{transform:scale(0.95);}
.btn-purple{background:var(--purple);color:white;width:100%;}
.btn-purple:hover{background:var(--purple-d);}
.btn-outline{background:transparent;color:var(--purple);border:2px solid var(--purple);width:100%;}
.btn-sm{padding:10px 20px;font-size:14px;}
.btn-teal{background:var(--teal);color:white;}
.btn-pink{background:var(--pink);color:white;}
.btn-ghost{background:var(--purple-l);color:var(--purple);border:none;}

/* NAV */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:2px solid var(--border);display:flex;z-index:100;padding:8px 0 20px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:8px 4px;font-family:"Nunito",sans-serif;font-size:10px;font-weight:700;color:var(--text3);transition:color 0.15s;}
.nav-btn.active{color:var(--purple);}
.nav-icon{font-size:22px;line-height:1;}
.nav-btn.active .nav-icon{transform:scale(1.15);transition:transform 0.2s;}

/* FORMS */
input[type=text],input[type=password],textarea{
  width:100%;background:var(--bg);border:2px solid var(--border);border-radius:var(--rs);
  padding:14px 16px;font-family:"Nunito",sans-serif;font-size:16px;color:var(--text);
  outline:none;transition:border-color 0.2s;
}
input:focus,textarea:focus{border-color:var(--purple);}
textarea{resize:none;}
label{font-weight:700;font-size:14px;color:var(--text2);display:block;margin-bottom:6px;}

/* CHIPS / TOGGLES */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:50px;border:2px solid var(--border);background:var(--card);font-family:"Nunito",sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;color:var(--text2);}
.chip.active{background:var(--purple);border-color:var(--purple);color:white;}
.chip:active{transform:scale(0.95);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}

/* EMOJI SCALE */
.emoji-scale{display:flex;gap:8px;}
.emoji-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:var(--rs);border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all 0.15s;font-size:10px;font-weight:700;color:var(--text3);}
.emoji-opt .e{font-size:28px;}
.emoji-opt.active{border-color:var(--purple);background:var(--purple-l);color:var(--purple);}
.emoji-opt:active{transform:scale(0.93);}

/* CYCLE BAR */
.cycle-bar{height:12px;border-radius:50px;overflow:hidden;background:#f0e8ff;position:relative;}
.cycle-fill{height:100%;border-radius:50px;transition:width 0.6s ease;}
.zone-rough{background:linear-gradient(90deg,#ff6b6b,#ff9f43);}
.zone-early{background:linear-gradient(90deg,#ff9f43,#ffd166);}
.zone-nadir{background:linear-gradient(90deg,#9b6dff,#ff79c8);}
.zone-build{background:linear-gradient(90deg,#5dd9c1,#5cb85c);}

/* TOGGLE SWITCH */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle{position:relative;width:48px;height:26px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#ddd;border-radius:50px;cursor:pointer;transition:0.3s;}
.toggle-slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s;}
input:checked + .toggle-slider{background:var(--purple);}
input:checked + .toggle-slider:before{transform:translateX(22px);}

/* PEEP MASCOT */
.peep{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--border);}
.peep-sm{width:48px;height:48px;border-radius:50%;object-fit:cover;}
.peep-placeholder{display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:50%;border:3px solid var(--border);}

/* BRISTOL SCALE BUTTONS */
.bristol-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bristol-btn{padding:10px;border-radius:var(--rs);border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:left;font-family:"Nunito",sans-serif;transition:all 0.15s;}
.bristol-btn.active{border-color:#8B4513;background:#f5ede5;}
.bristol-btn:active{transform:scale(0.96);}
.bristol-num{font-weight:900;font-size:20px;color:#8B4513;}
.bristol-desc{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px;}

/* WORKOUT TIMER */
.workout-screen{background:linear-gradient(135deg,var(--purple),var(--pink));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:white;text-align:center;}
.timer-ring{width:180px;height:180px;border-radius:50%;border:8px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,0.1);margin:20px auto;position:relative;}
.timer-num{font-size:52px;font-weight:900;line-height:1;}
.timer-label{font-size:13px;opacity:0.8;font-weight:700;margin-top:4px;}

/* CALENDAR */
.cal-strip{display:flex;overflow-x:auto;gap:8px;padding:4px 2px;scrollbar-width:none;}
.cal-strip::-webkit-scrollbar{display:none;}
.cal-day{min-width:52px;border-radius:var(--rs);padding:10px 6px;text-align:center;border:2px solid var(--border);background:var(--card);cursor:pointer;flex-shrink:0;transition:all 0.15s;}
.cal-day.today{border-color:var(--purple);background:var(--purple-l);}
.cal-day.has-data{border-color:var(--teal);}
.cal-day.chemo-day{border-color:var(--red);background:#fff0f0;}
.cal-day:active{transform:scale(0.95);}
.cal-date{font-size:18px;font-weight:900;}
.cal-label{font-size:10px;font-weight:700;color:var(--text3);}
.cal-dots{display:flex;justify-content:center;gap:2px;margin-top:4px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}

/* CHEER CARD */
.cheer-card{background:var(--purple-l);border-radius:var(--rs);padding:14px;margin-bottom:10px;border:1.5px solid var(--purple);animation:slideDown 0.3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* BADGE */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.badge-card{border-radius:var(--rs);padding:14px;border:2px solid var(--border);text-align:center;background:var(--card);}
.badge-card.earned{border-color:var(--yellow);background:var(--yellow-l);}
.badge-icon{font-size:32px;}
.badge-name{font-size:12px;font-weight:800;margin-top:6px;color:var(--text);}
.badge-desc{font-size:10px;color:var(--text2);margin-top:3px;}

/* TIP CARD */
.tip-card{background:linear-gradient(135deg,var(--purple-l),var(--pink-l));border-radius:var(--rs);padding:14px 16px;margin-top:12px;border:1.5px solid var(--pink);display:flex;gap:12px;align-items:flex-start;animation:popUp 0.3s ease;}
@keyframes popUp{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

/* HEADERS */
.page-header{padding:20px 20px 10px;background:white;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:50;}
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin:20px 0 10px;}
.page-pad{padding:16px 16px 0;}

/* PROGRESS BAR */
.prog-bar{height:8px;border-radius:50px;background:var(--purple-l);overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width 0.5s ease;}

/* SCROLLTABS */
.scroll-tabs{display:flex;overflow-x:auto;gap:6px;padding:0 16px 14px;scrollbar-width:none;}
.scroll-tabs::-webkit-scrollbar{display:none;}
.stab{padding:8px 18px;border-radius:50px;border:2px solid var(--border);background:var(--card);font-family:"Nunito",sans-serif;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text2);flex-shrink:0;transition:all 0.15s;}
.stab.active{background:var(--purple);border-color:var(--purple);color:white;}

/* DISTANCE PRESETS */
.preset-grid{display:flex;flex-wrap:wrap;gap:8px;}
.preset-btn{padding:10px 16px;border-radius:50px;border:2px solid var(--teal);background:var(--teal-l);color:#1a8a76;font-family:"Nunito",sans-serif;font-weight:800;font-size:13px;cursor:pointer;transition:all 0.15s;}
.preset-btn.active{background:var(--teal);color:white;}
.preset-btn:active{transform:scale(0.95);}

/* FOOD PRESETS */
.food-grid{display:flex;flex-wrap:wrap;gap:8px;}
.food-btn{padding:10px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);font-family:"Nunito",sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.15s;}
.food-btn.active{background:var(--orange);border-color:var(--orange);color:white;}
.food-btn:active{transform:scale(0.95);}

/* HYDRATION BUBBLES */
.water-grid{display:flex;flex-wrap:wrap;gap:10px;}
.water-drop{font-size:32px;cursor:pointer;transition:transform 0.15s;opacity:0.3;}
.water-drop.filled{opacity:1;}
.water-drop:active{transform:scale(0.8);}

/* ONBOARDING */
.onboard-screen{min-height:100vh;display:flex;flex-direction:column;padding:32px 24px 48px;}
.coach-card{background:var(--card);border-radius:var(--r);padding:20px;border:2px solid var(--border);text-align:center;margin-bottom:14px;}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:white;border:2px solid var(--purple);border-radius:50px;padding:12px 24px;font-weight:800;font-size:15px;color:var(--purple);z-index:1000;box-shadow:0 8px 30px rgba(155,109,255,0.25);display:none;white-space:nowrap;}
#toast.show{display:block;animation:toastPop 2.5s ease forwards;}
@keyframes toastPop{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* SUMMARY EXPORT */
.export-box{background:#f8f4ff;border-radius:var(--rs);padding:16px;border:2px dashed var(--purple);font-size:13px;line-height:1.6;white-space:pre-wrap;font-family:monospace;color:var(--text);}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>

  <button class="nav-btn" data-tab="workout" onclick="switchTab('workout')"><span class="nav-icon">💪</span>Workout</button>
  <button class="nav-btn" data-tab="calendar" onclick="switchTab('calendar')"><span class="nav-icon">📅</span>Calendar</button>
  <button class="nav-btn" data-tab="squad" onclick="switchTab('squad')"><span class="nav-icon">🐙</span>Squad</button>
</div>

function getCycle() {
  const now = new Date();
  const day = Math.floor((now - LAST_CHEMO) / 86400000) + 1;
  const total = Math.floor((NEXT_CHEMO - LAST_CHEMO) / 86400000);
  const daysToNext = Math.ceil((NEXT_CHEMO - now) / 86400000);
  const pct = Math.min(100, Math.round((day / total) * 100));
  let zone, zclass, msg;
  if (day <= 3)  { zone="Rough Zone 😮‍💨";  zclass="zone-rough"; msg="post-chemo roughies — nausea may peak. be extra gentle on yourself today 🌸"; }
  else if (day <= 7) { zone="Early Recovery 🌱"; zclass="zone-early"; msg="still bumpy but trending up! blood counts dropping this week, keep an eye on fever 🌡️"; }
  else if (day <= 14) { zone="Nadir Zone 🛡️"; zclass="zone-nadir"; msg="counts at their lowest rn. no sick visitors! wash hands, watch for fever over 100.4°F 🧼"; }
  else { zone="Building Back! 💪"; zclass="zone-build"; msg="counts coming back up! body is doing the thing ✨"; }
  return { day, total, daysToNext, pct, zone, zclass, msg };
}

async function loadToday() {
  try {
    const doc = await db.collection('days').doc(TODAY).get();
    S.today = doc.exists ? doc.data() : getEmptyDay();
  } catch(e) {
    S.today = getEmptyDay();
  }
}

function getEmptyDay() {
  return {
    meds: {am:false, pm:false},
    feel: {mood:null, nausea:null, pain:null, energy:null},
    food: [],
    demon: [],
    hydration: 0,
    movement: {laps:0, distance:0, outside:false},
    workouts: [],
    notes:'',
  };
}

async function saveToday() {
  try {
    await db.collection('days').doc(TODAY).set(S.today, {merge:true});
  } catch(e) {
    showToast("⚠️ save failed — check wifi!");
  }
}

async function loadCheers() {
  try {
    const snap = await db.collection('cheers').orderBy('ts','desc').limit(40).get();
    S.cheers = snap.docs.map(d => ({id:d.id, ...d.data()}));
  } catch(e) { S.cheers = []; }
}

async function addCheer(name, msg) {
  const emojis = ["🔥","💪","⚡","🏆","❤️","🌟","👊","💛","🙌","✨","🎉","🐙"];
  await db.collection('cheers').add({
    name, msg, ts: firebase.firestore.FieldValue.serverTimestamp(),
    emoji: emojis[Math.floor(Math.random()*emojis.length)],
  });
  await loadCheers();
}

async function loadSettings() {
  try {
    const doc = await db.collection('settings').doc('app').get();
    if (doc.exists) {
      const d = doc.data();
      S.privacy = d.privacy || DEFAULT_PRIVACY;
      S.presets = d.presets || [];
      S.badges = d.badges || BADGES;
    } else {
      S.privacy = DEFAULT_PRIVACY;
      S.presets = [];
      S.badges = BADGES;
    }
  } catch(e) {
    S.privacy = DEFAULT_PRIVACY;
    S.presets = [];
    S.badges = BADGES;
  }
}

async function saveSettings() {
  await db.collection('settings').doc('app').set({
    privacy: S.privacy,
    presets: S.presets,
    badges: S.badges,
  }, {merge:true});
}

async function loadCalDay(date) {
  if (S.calData[date]) return;
  try {
    const doc = await db.collection('days').doc(date).get();
    S.calData[date] = doc.exists ? doc.data() : null;
  } catch(e) { S.calData[date] = null; }
}

function render() {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  if (S.view === 'loading')    { app.innerHTML = renderLoading(); nav.style.display='none'; return; }
  if (S.view === 'password')   { app.innerHTML = renderPassword(); nav.style.display='none'; return; }
  if (S.view === 'onboarding') { app.innerHTML = renderOnboarding(); nav.style.display='none'; return; }
  nav.style.display='flex';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===S.tab));
  if (S.workout)               { app.innerHTML = renderWorkoutActive(); return; }
  if (S.tab==='today')         { app.innerHTML = renderToday(); return; }
  if (S.tab==='log')           { app.innerHTML = renderLog(); return; }
  if (S.tab==='workout')       { app.innerHTML = renderWorkoutHome(); return; }
  if (S.tab==='calendar')      { app.innerHTML = renderCalendar(); return; }
  if (S.tab==='squad')         { app.innerHTML = renderSquad(); return; }
}

  if (pass.toLowerCase() !== APP_PASSWORD.toLowerCase()) {
    document.getElementById('login-err').style.display='block';
    return;
  }
  const isKendra = name.toLowerCase().includes('kendra') || name.toLowerCase().includes('ken');
  S.user = { name, isKendra };
  localStorage.setItem('gk-user', JSON.stringify(S.user));

  if (isKendra && isFirst) {

function startWorkout(type) {
  const exercises = type === 'mobility' ? MOBILITY_EXERCISES : STRENGTH_EXERCISES;
  S.workout = {
    type, exercises, idx:0, set:1, phase:'work',
    timerVal: getExerciseDuration(exercises[0]),
    startTime: Date.now(), totalStart: Date.now(),
  };
  S.workoutInterval = setInterval(tickWorkout, 1000);
  render();
}

function getExerciseDuration(ex) {
  if (ex.duration) return ex.duration;
  return ex.reps * 3; // ~3 sec per rep
}

function tickWorkout() {
  if (!S.workout) return;
  const w = S.workout;
  w.timerVal--;
  if (w.timerVal <= 0) {
    const ex = w.exercises[w.idx];
    if (w.phase === 'work') {
      if (ex.sets && w.set < ex.sets) {
        w.phase = 'rest'; w.timerVal = 20;
      } else {
        w.idx++;
        if (w.idx >= w.exercises.length) {
          finishWorkout(); return;
        }
        w.set = 1; w.phase = 'work';
        w.timerVal = getExerciseDuration(w.exercises[w.idx]);
      }
    } else {
      w.phase = 'work'; w.set++;
      w.timerVal = getExerciseDuration(w.exercises[w.idx]);
    }
  }
  render();
}

async function finishWorkout() {
  clearInterval(S.workoutInterval);
  const duration = Math.round((Date.now() - S.workout.totalStart) / 60000);
  const completed = S.workout.exercises.length;
  const type = S.workout.type;
  S.workout = null;
  if (!S.today) S.today = getEmptyDay();
  S.today.workouts = S.today.workouts || [];
  S.today.workouts.push({type, duration, completed, time: new Date().toISOString()});
  await saveToday();
  render();
  showToast("PEEPSI IS SO PROUD!! workout done!! 🐙💪");
}

function skipExercise() {
  if (!S.workout) return;
  S.workout.idx++;
  if (S.workout.idx >= S.workout.exercises.length) { finishWorkout(); return; }
  S.workout.set = 1; S.workout.phase = 'work';
  S.workout.timerVal = getExerciseDuration(S.workout.exercises[S.workout.idx]);
  render();
}

function skipRest() {
  if (!S.workout || S.workout.phase !== 'rest') return;
  S.workout.phase = 'work'; S.workout.set++;
  S.workout.timerVal = getExerciseDuration(S.workout.exercises[S.workout.idx]);
  render();
}

function quitWorkout() {
  if (confirm('quit workout? peepsi will understand 🐙')) {
    clearInterval(S.workoutInterval);
    S.workout = null; render();
  }
}

  </div>
  <div class="page-pad">
    <div class="section-title">today's public summary</div>
    <div class="card" style="margin-bottom:14px;background:var(--teal-l);border-color:var(--teal);">
      <div style="font-weight:800;font-size:14px;margin-bottom:8px;">what your squad sees 👀</div>
      ${privacy.sharePooped && d.demon.length > 0 ? `<div style="font-size:14px;margin:4px 0;">💩 she pooped! (${d.demon.length}x)</div>` : ''}
      ${privacy.shareDemonDetail && d.demon.length > 0 ? `<div style="font-size:12px;color:var(--text2);margin:4px 0;">type: ${d.demon.map(de=>'bristol '+de.bristolType).join(', ')} ${d.demon.some(de=>de.tags?.includes('spicy'))?'🌶️':''}</div>` : ''}
      ${privacy.shareMood && d.feel?.mood !== null && d.feel?.mood !== undefined ? `<div style="font-size:14px;margin:4px 0;">vibe: ${['😩 rough','😐 okay','🙂 good','😄 great!'][d.feel.mood]}</div>` : ''}
      ${privacy.shareSymptoms && d.feel?.nausea !== null && d.feel?.nausea !== undefined ? `<div style="font-size:14px;margin:4px 0;">nausea: ${['🤢','😕','😐','😊'][d.feel.nausea]} pain: ${['😭','😖','😕','😊'][d.feel.pain||0]}</div>` : ''}
      ${privacy.shareFood && d.food.length > 0 ? `<div style="font-size:14px;margin:4px 0;">ate: ${d.food.slice(0,3).map(f=>f.item).join(', ')}</div>` : ''}
      ${privacy.shareWorkout && d.workouts.length > 0 ? `<div style="font-size:14px;margin:4px 0;">💪 crushed a ${d.workouts[0].type} workout!</div>` : ''}
      ${d.demon.length===0 && d.food.length===0 && d.feel?.mood===null ? '<div style="color:var(--text2);font-size:13px;font-style:italic;">nothing logged yet today</div>' : ''}
    </div>
    <button class="btn btn-outline btn-sm" style="margin-bottom:20px;" onclick="S.tab='today';render();setTimeout(()=>document.getElementById('privacy-section')?.scrollIntoView(),100)">
      ⚙️ change privacy settings
    </button>

    <div class="section-title">leave a cheer for kendra</div>
    <div class="card" style="margin-bottom:14px;">
      <input type="text" id="cheer-name" placeholder="your name" style="margin-bottom:10px;">
      <textarea id="cheer-msg" rows="3" placeholder="tell kendra something amazing..."></textarea>
      <button class="btn btn-teal" style="margin-top:10px;" onclick="submitCheer()">send cheer 🐙💛</button>
    </div>

    <div class="section-title">the cheer wall 💛</div>
    ${S.cheers.length === 0 ? '<div style="text-align:center;padding:20px;color:var(--text2);font-weight:700;">no cheers yet! be the first 🐙</div>' : ''}
    ${S.cheers.map(c=>`<div class="cheer-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--purple-l);display:flex;align-items:center;justify-content:center;font-size:18px;">${c.emoji||'🐙'}</div>
        <div style="font-weight:900;font-size:15px;color:var(--purple);">${c.name}</div>
      </div>
      <div style="font-size:14px;color:var(--text);line-height:1.5;">${c.msg}</div>
    </div>`).join('')}

    <div class="section-title" style="margin-top:20px;">badges earned 🏆</div>
    <div class="badge-grid">
      ${(S.badges||BADGES).map(b=>`<div class="badge-card ${b.earned?'earned':''}">
        <div class="badge-icon">${b.icon}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        ${!b.earned ? '<div style="font-size:10px;color:var(--text3);margin-top:4px;">locked 🔒</div>' : ''}
      </div>`).join('')}
    </div>
    <div style="height:20px;"></div>
  </div>`;
}

// ── EVENT HANDLERS ──────────────────────────────────────────
async function setMood(val) {
  if (!S.today) S.today = getEmptyDay();
  S.today.feel = S.today.feel || {};
  S.today.feel.mood = val;
  await saveToday();
  render();
  if (val === 3) showToast("GREAT day vibes!! 😄🐙");
}

async function setFeel(key, val) {
  if (!S.today) S.today = getEmptyDay();
  S.today.feel = S.today.feel || {};
  S.today.feel[key] = val;
  await saveToday();
  render();
  const cycle = getCycle();
  if (key === 'nausea' && val === 0) {
    const tip = getTip(cycle.day <= 7 ? 'nausea_high_early' : 'nausea_nadir', null);
    if (tip) showToast("peepachu tip! check the log tab 💜");
  }
}

async function toggleMed(period) {
  if (!S.today) S.today = getEmptyDay();
  S.today.meds[period] = !S.today.meds[period];
  await saveToday();
  render();
  if (S.today.meds[period]) {
    const tip = getTip('meds_'+period, null);
    showToast(tip || (period==='am'?'morning meds done! 💊':'evening meds done! 🌙'));
  }
}

async function addFood(item) {
  if (!S.today) S.today = getEmptyDay();
  S.today.food = S.today.food || [];
  S.today.food.push({item, keptDown:undefined, time:new Date().toISOString()});
  await saveToday();
  render();
}

async function addCustomFood() {
  const el = document.getElementById('food-custom');
  if (!el || !el.value.trim()) return;
  await addFood(el.value.trim());
}

async function setFoodKept(idx, val) {
  if (!S.today?.food) return;
  S.today.food[idx].keptDown = val;
  await saveToday();
  render();
  const tip = getTip(val ? 'food_kept' : 'food_lost', null);
  if (tip) showToast(val ? 'KEPT IT DOWN!! 🎉' : 'ugh that sucks 😮‍💨 rinse, wait, try again');
}

async function removeFood(idx) {
  if (!S.today?.food) return;
  S.today.food.splice(idx, 1);
  await saveToday();
  render();
}

let selectedBristol = null;
let selectedDemonTags = [];

function selectBristol(num) {
  selectedBristol = num;
  document.querySelectorAll('.bristol-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('btype-'+num);
  if (el) el.classList.add('active');
}

function toggleDemonTag(id) {
  if (selectedDemonTags.includes(id)) {
    selectedDemonTags = selectedDemonTags.filter(t => t!==id);
  } else {
    selectedDemonTags.push(id);
  }
  document.querySelectorAll('[id^=dtag-]').forEach(el => {
    const k = el.id.replace('dtag-','');
    el.classList.toggle('active', selectedDemonTags.includes(k));
  });
}

async function logDemon() {
  if (selectedBristol === null) { showToast("pick a bristol type first! 💩"); return; }
  if (!S.today) S.today = getEmptyDay();
  S.today.demon = S.today.demon || [];
  S.today.demon.push({bristolType:selectedBristol, tags:[...selectedDemonTags], time:new Date().toISOString()});
  await saveToday();
  selectedBristol = null; selectedDemonTags = [];
  
  // tip logic
  let tipKey = null;
  if (selectedDemonTags?.includes('spicy') || selectedBristol >= 6) tipKey = selectedDemonTags?.includes('spicy')?'demon_spicy':'demon_type7';
  else if (selectedDemonTags?.includes('grumbles')) tipKey = 'demon_grumbles';
  else if (selectedDemonTags?.includes('shart')) tipKey = 'demon_shart';
  else if (selectedDemonTags?.includes('winner') || selectedBristol === 4) tipKey = 'demon_winner';
  
  render();
  if (tipKey) {
    const tip = getTip(tipKey, null);
    const tipEl = document.getElementById('demon-tip');
    if (tipEl && tip) tipEl.innerHTML = `<div class="tip-card"><span style="font-size:28px;">🐙</span><div style="font-size:13px;font-weight:700;color:var(--purple);">${tip}</div></div>`;
  }
  showToast("demon logged! 💩");
}

async function removeDemon(idx) {
  if (!S.today?.demon) return;
  S.today.demon.splice(idx, 1);
  await saveToday();
  render();
}

async function setHydration(val) {
  if (!S.today) S.today = getEmptyDay();
  S.today.hydration = val;
  await saveToday();
  render();
}

async function addHydration(delta) {
  if (!S.today) S.today = getEmptyDay();
  S.today.hydration = Math.max(0, (S.today.hydration||0)+delta);
  await saveToday();
  render();
  if (S.today.hydration >= 8) showToast("HYDRATION HERO!! 💧");
}

async function addLaps(delta) {
  if (!S.today) S.today = getEmptyDay();
  S.today.movement = S.today.movement || {};
  S.today.movement.laps = Math.max(0, (S.today.movement.laps||0)+delta);
  await saveToday();
  render();
  if (S.today.movement.laps >= 2) showToast("2 laps! HALL OF FAME 🏃💛");
}

async function toggleOutside(val) {
  if (!S.today) S.today = getEmptyDay();
  S.today.movement = S.today.movement || {};
  S.today.movement.outside = val;
  await saveToday();
  render();
  if (val) showToast(getTip('outside', null) || 'OUTSIDE!! ☀️');
}

async function saveDistance() {
  const el = document.getElementById('dist-val');
  if (!el) return;
  if (!S.today) S.today = getEmptyDay();
  S.today.movement = S.today.movement || {};
  S.today.movement.distance = el.value.trim();
  await saveToday();
  showToast("distance saved! 👟");
}

async function savePreset() {
  const el = document.getElementById('dist-val');
  if (!el || !el.value.trim()) return;
  const label = el.value.trim();
  S.presets = S.presets || [];
  if (!S.presets.find(p=>p.label===label)) {
    S.presets.push({label, value:label});
    await saveSettings();
    showToast("preset saved! ⭐");
    render();
  }
}

function selectPreset(idx) {
  if (!S.today) S.today = getEmptyDay();
  S.today.movement = S.today.movement || {};
  S.today.movement.distance = S.presets[idx].value;
  S.today.movement.presetIdx = idx;
  saveToday();
  render();
}

async function saveNote(val) {
  if (!S.today) S.today = getEmptyDay();
  S.today.notes = val;
  await saveToday();
}

async function submitCheer() {
  const name = document.getElementById('cheer-name')?.value?.trim();
  const msg = document.getElementById('cheer-msg')?.value?.trim();
  if (!name || !msg) { showToast("name + message needed! 🐙"); return; }
  await addCheer(name, msg);
  render();
  showToast(`cheer sent from ${name}!! 💛`);
}

function selectCalDay(date) {
  S.calDate = date;
  loadCalDay(date).then(()=>render());
}

function switchTab(tab) {
  S.tab = tab;
  S.logTab = 'feel';
  render();
}

function exportLog() {
  const d = S.today || getEmptyDay();
  const cycle = getCycle();
  const date = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const lines = [
    `📋 KENDRA DAILY LOG — ${date}`,
    `Cycle Day ${cycle.day} of ${cycle.total} (${cycle.zone})`,
    ``,
    `💊 Meds: AM ${d.meds.am?'✓':'✗'} | PM ${d.meds.pm?'✓':'✗'}`,
  ];
  if (d.feel) {
    const moods = ['rough','okay','good','great'];
    const naus = ['severe','moderate','mild','none'];
    const pains = ['severe','moderate','mild','none'];
    if (d.feel.mood !== null && d.feel.mood !== undefined) lines.push(`😊 Mood: ${moods[d.feel.mood]}`);
    if (d.feel.nausea !== null && d.feel.nausea !== undefined) lines.push(`🤢 Nausea: ${naus[d.feel.nausea]}`);
    if (d.feel.pain !== null && d.feel.pain !== undefined) lines.push(`😣 Pain: ${pains[d.feel.pain]}`);
    if (d.feel.energy !== null && d.feel.energy !== undefined) lines.push(`⚡ Energy: ${['empty','low','okay','going'][d.feel.energy]}`);
  }
  if (d.food.length > 0) {
    lines.push(``);
    lines.push(`🍳 Food (${d.food.length} nibbles):`);
    d.food.forEach(f => lines.push(`  · ${f.item} — ${f.keptDown===true?'kept down':f.keptDown===false?'vomited':'not tracked'}`));
  }
  lines.push(`💧 Hydration: ${d.hydration} glasses`);
  if (d.demon.length > 0) {
    lines.push(``);
    lines.push(`💩 Bowel Movements (${d.demon.length}x):`);
    d.demon.forEach(de => {
      const b = BRISTOL_TYPES.find(b=>b.num===de.bristolType);
      lines.push(`  · Bristol ${de.bristolType} (${b?.label}) — ${de.tags?.join(', ')||'no tags'}`);
    });
  }
  if (d.movement) {
    const m = d.movement;
    lines.push(``);
    if (m.laps) lines.push(`🏃 Laps: ${m.laps}`);
    if (m.distance) lines.push(`📏 Distance/Steps: ${m.distance}`);
    if (m.outside) lines.push(`☀️ Went outside: yes`);
  }
  if (d.workouts?.length > 0) {
    lines.push(`💪 Workouts: ${d.workouts.map(w=>`${w.type} (${w.duration} min)`).join(', ')}`);
  }
  if (d.notes) lines.push(`\n📝 Notes: ${d.notes}`);
  
  const text = lines.join('\n');
  const preview = document.getElementById('export-preview');
  if (preview) {
    preview.style.display = 'block';
    preview.innerHTML = `<div class="export-box">${text}</div>
      <button class="btn btn-purple btn-sm" style="margin-top:10px;" onclick="navigator.clipboard.writeText(\`${text.replace(/\`/g,"'")} \`).then(()=>showToast('copied! 📋'))">copy to clipboard</button>`;
  }
}

// ── TOAST ────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  // Check saved user
  const saved = localStorage.getItem('gk-user');
  if (saved) {
    try { S.user = JSON.parse(saved); } catch {}
  }
  
  render(); // show loading
  
  await Promise.all([loadToday(), loadCheers(), loadSettings()]);
  
  if (!S.user) {
    S.view = 'password';
  } else {
    S.view = 'app';
  }
  render();
}

init();
</script>
</body>
</html>
