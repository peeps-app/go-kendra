async function lsGetA(k){try{if(window.storage){var r=await window.storage.get('gk-'+k,false);if(r)return JSON.parse(r.value);}}catch(e){}try{var v=localStorage.getItem('gk-'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsGet(k){try{var v=localStorage.getItem('gk-'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{if(window.storage)window.storage.set('gk-'+k,JSON.stringify(v),false);}catch(e){}try{localStorage.setItem('gk-'+k,JSON.stringify(v));}catch(e){}}

async function loadAll(){
  S.day=(await lsGetA('day-'+TODAY))||empty();
  if(!Array.isArray(S.day.moods))S.day.moods=migrateMoods(S.day);
  S.cheers=(await lsGetA('cheers'))||[];
  var cfg=await lsGetA('cfg');
  S.priv=(cfg&&cfg.priv)||DEFP;
  S.bdgs=(cfg&&cfg.bdgs)||BDGS;
  S.events=(await lsGetA('events'))||[];
  S.labSummaries=(await lsGetA('lab-summaries'))||[];
}

function saveDay(){
  if(!S.day) return;
  lsSet('day-'+TODAY, S.day);
}
function saveCfg(){
  lsSet('cfg',{priv:S.priv,bdgs:S.bdgs});
}
function loadCalDay(dt){
  if(S.calD[dt]!==undefined) return;
  S.calD[dt] = lsGet('day-'+dt) || null;
}
function addCheer(name,msg){
  var c = {name:name,msg:msg,ts:new Date().toISOString()};
  S.cheers = [c].concat(S.cheers||[]).slice(0,40);
  lsSet('cheers',S.cheers);
}

// -- DATA HELPERS ---------------------------------------
function empty(){return {meds:{am:false,pm:false},moods:[],food:[],demon:[],hyd:0,move:{laps:0,dist:'',out:false},wos:[],notes:''};}
function migrateMoods(d){
  if(d.feel && d.feel.mood!=null) return [{id:1,ts:TODAY+'T12:00:00',mood:d.feel.mood,nausea:d.feel.nausea,pain:d.feel.pain,energy:d.feel.energy,notes:''}];
  return [];
}
function latestMood(d){var m=d&&d.moods&&Array.isArray(d.moods)?d.moods:[];return m.length?m[m.length-1]:null;}
function MC_color(i){return(i!=null&&i>=0&&i<=4)?MC[i]:'#8b7fa0';}
function MC_bg(i){return(i!=null&&i>=0&&i<=4)?MCL[i]:'#f3f0f9';}
function fmtT(ts){
  if(!ts) return '';
  var d=new Date(ts),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+(m<10?'0'+m:m)+' '+ap;
}

// -- CYCLE ----------------------------------------------
function cycle(){
  var now=new Date(),day=Math.floor((now-LC)/86400000)+1,tot=Math.floor((NC-LC)/86400000),dtn=Math.ceil((NC-now)/86400000),pct=Math.min(100,Math.round(day/tot*100));
  var z,zc,msg,bg;
  if(day<=3){z='Rough Zone';zc='#c95068';msg='Post-chemo roughies. Nausea may peak. Be gentle today.';bg='#faedf0';}
  else if(day<=7){z='Early Recovery';zc='#c9920a';msg='Still bumpy but trending up. Counts dropping, watch for fever.';bg='#fdf5e0';}
  else if(day<=14){z='Nadir Zone';zc='#7c5cdb';msg='Counts at their lowest. No sick visitors. Watch for fever over 100.4F.';bg='#ede8f9';}
  else{z='Building Back';zc='#4a8c6f';msg='Counts coming back up. Body is doing the thing.';bg='#e8f4ee';}
  return {day:day,tot:tot,dtn:dtn,pct:pct,z:z,zc:zc,msg:msg,bg:bg};
}

// -- RENDER ---------------------------------------------
function R(){
  var app=document.getElementById('app'),nav=document.getElementById('nav');
  if(!app) return;
  if(S.v==='loading'){app.innerHTML=vLoading();nav.style.display='none';return;}
  if(S.v==='pw')    {app.innerHTML=vPw();    nav.style.display='none';return;}
  if(S.v==='ob')    {app.innerHTML=vOb();    nav.style.display='none';return;}
  if(S.role==='friends'){nav.style.display='none';app.innerHTML=vFriendsPortal();return;}
  nav.style.display='flex';
  var nbs=document.querySelectorAll('.nb');
  for(var i=0;i<nbs.length;i++) nbs[i].classList.toggle('on',nbs[i].dataset.t===S.tab);
  // Show medical tab only for care team
  var medBtn=document.getElementById('nb-medical');
  if(medBtn) medBtn.style.display=S.role==='care'?'flex':'none';
  var medsBtn=document.getElementById('nb-meds');
  if(medsBtn) medsBtn.style.display=(S.role==='patient'||S.role==='care')?'flex':'none';
  var old=document.getElementById('cin');
  if(old) old.remove();
  if(S.cin){
    var el=document.createElement('div');
    el.innerHTML=vCin();
    document.body.appendChild(el.firstChild);
    
    return;
  }
  if(S.wo){app.innerHTML=vWoAct();return;}
  var screens={home:vHome,log:vLog,train:vTrain,cal:vCal,squad:vSquad,medical:vMedical,meds:vMedsTracker};
  app.innerHTML=(screens[S.tab]||vHome)();
}

// -- LOADING --------------------------------------------
function vLoading(){
  return '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">'
    +'<div style="width:56px;height:56px;animation:pulse 1.4s ease-in-out infinite;">'+SQ+'</div>'
    +'<div style="font-family:var(--serif);font-size:24px;font-style:italic;color:var(--pu);">Go Kendra</div>'
    +'</div>';
}

// -- PASSWORD -------------------------------------------
function vPw(){
  return '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;">'
    +'<div style="width:64px;height:64px;margin-bottom:24px;">'+SL+'</div>'
    +'<div style="font-family:var(--serif);font-size:28px;font-style:italic;color:var(--pu);margin-bottom:8px;">Go Kendra</div>'
    +'<div style="font-size:14px;color:var(--ink2);margin-bottom:40px;">kendra\'s comeback tracker</div>'
    +'<div style="width:100%;max-width:320px;">'
    +'<div class="lbl mb2">Your name</div>'
    +'<input class="inp mb3" type="text" id="nm" placeholder="naur, john, mom..." autocomplete="off">'
    +'<div class="lbl mb2">Secret word</div>'
    +'<input class="inp mb4" type="password" id="pw" placeholder="..." autocomplete="off">'
    +'<button class="btn btn-ink" onclick="doLogin()">Let\'s go <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'<div id="err" style="display:none;text-align:center;color:var(--ro);font-size:14px;margin-top:12px;">Wrong word, try again</div>'
    
    +'</div></div>';
}
function doLogin(){
  var n=(document.getElementById('nm')||{}).value||'';
  var p=(document.getElementById('pw')||{}).value||'';
  if(!n.trim()){toast('What\'s your name?');return;}
  var pw=p.trim().toLowerCase();
  var role=null;
  if(pw===PW_PATIENT) role='patient';
  else if(pw===PW_CARE) role='care';
  else if(pw===PW_FRIENDS) role='friends';
  if(!role){var e=document.getElementById('err');if(e)e.style.display='block';return;}
  S.role=role;
  S.user={name:n.trim(),role:role,isk:n.toLowerCase().indexOf('kendra')>=0||n.toLowerCase().indexOf('ken')>=0};
  lsSet('u',JSON.stringify(S.user)); try{localStorage.setItem('gk-u',JSON.stringify(S.user));}catch(e){}
  if(role==='patient'&&S.user.isk&&!localStorage.getItem('gk-ob')){S.v='ob';S.obs=0;}
  else{S.v='app';}
  R();
}

// -- ONBOARDING -----------------------------------------
function vOb(){if(S.obs===0)return vObC();if(S.obs===1)return vObP();return vObD();}
function vObC(){
  function row(svg,name,color,role,desc,last){
    return '<div class="row" style="'+(last?'border-bottom:none':'')+'">'
      +'<div style="width:52px;height:52px;flex-shrink:0;">'+svg+'</div>'
      +'<div><div style="font-family:var(--serif);font-size:17px;color:'+color+';">'+name+'</div>'
      +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:'+color+';opacity:.7;margin:2px 0;">'+role+'</div>'
      +'<div style="font-size:13px;color:var(--ink2);">'+desc+'</div></div></div>';
  }
  return '<div style="min-height:100vh;display:flex;flex-direction:column;padding:48px 16px 48px;">'
    +'<div style="text-align:center;margin-bottom:32px;">'
    +'<div style="font-family:var(--serif);font-size:28px;font-style:italic;color:var(--pu);margin-bottom:8px;">Meet your coaches</div>'
    +'<div style="font-size:14px;color:var(--ink2);">My squad, here for me 24/7</div></div>'
    +'<div class="card-flush">'
    +row(SQ,'Peepsqueak','var(--te)','My Main Peep','He lives on the home screen and coaches mobility. My hype octopus.',false)
    +row(SP,'Peepsi','var(--bl)','Strength Coach','He coaches every strength session. No excuses, no judgment.',false)
    +row(SL,'Peepachu','var(--am)','Kenny\'s Korner','She holds all the cheers from everyone rooting for Kendra.',true)
    +'</div>'
    +'<div style="margin-top:auto;padding-top:24px;">'
    +'<button class="btn btn-ink" onclick="S.obs=1;R()">Next: privacy settings <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'</div></div>';
}
function vObP(){
  var p=S.priv||DEFP;
  function row(label,key){
    return '<div class="row"><span style="font-size:14px;flex:1;">'+label+'</span>'
      +'<label class="tog"><input type="checkbox" id="pv-'+key+'" '+(p[key]?'checked':'')+'><div class="tt"></div></label></div>';
  }
  return '<div style="min-height:100vh;display:flex;flex-direction:column;padding:48px 16px 48px;">'
    +'<div style="text-align:center;margin-bottom:24px;">'
    +'<div style="font-family:var(--serif);font-size:28px;font-style:italic;color:var(--pu);margin-bottom:8px;">What does my squad see?</div>'
    +'<div style="font-size:14px;color:var(--ink2);">I can change this any time</div></div>'
    +'<div class="card-flush">'
    +row('She went to the bathroom today','poop')
    +row('Demon type and tags','detail')
    +row('My mood','mood')
    +row('Pain and nausea levels','sym')
    +row('What she ate','food')

function getCycleSuggestions(){
  var c=cycle(),d=S.day||empty(),evs=eventsForDay(TODAY);
  var hadPara=evs.some(function(e){return e.type==='para';});
  var hadChemo=evs.some(function(e){return e.type==='chemo';});
  var tips=[];
  // Override: paracentesis today
  if(hadPara){
    return [{
      label:'You had a paracentesis today',
      color:'var(--bl)',
      food:['Clear broths','Electrolyte drinks','Pedialyte popsicles','Small soft nibbles'],
      activity:'Rest completely today. No laps, no workout. Let your body stabilize.',
      watch:'Watch for: dizziness when standing, unusual pain at the site, fever over 100.4\u00B0F.'
    }];
  }
  // Override: chemo today
  if(hadChemo||c.day===1){
    return [{
      label:'Chemo day',
      color:'var(--ro)',
      food:['Cold foods tolerate better','Small bites every 1-2 hrs','Ginger ale (flat)','Bland starchy foods','Avoid strong smells near food'],
      activity:'Gentle movement only -- a slow walk to the window counts.',
      watch:'Nausea peaks 24-72 hrs after infusion. Keep anti-nausea meds close.'
    }];
  }
  // Zone-based
  if(c.day<=3){
    tips=[{
      label:'Rough zone -- day '+c.day,
      color:'var(--ro)',
      food:['Flat ginger ale','Crackers or dry toast','Cold foods (easier on nausea)','Pedialyte if not eating much','Small bites only -- no big meals'],
      activity:'Rest is the right call today. If you feel up to it, 1 slow lap is plenty.',
      watch:'Nausea usually peaks around day 2-3 then starts easing.'
    }];
  } else if(c.day<=7){
    tips=[{
      label:'Early recovery -- day '+c.day,
      color:'var(--am)',
      food:['Eggs, yogurt, soft proteins','Oatmeal or cream of wheat','Banana or mashed potato','Avoid raw veg, spicy, fried'],
      activity:'2 hallway laps is a great goal. Mobility circuit if energy holds.',
      watch:'Counts are dropping this week. Watch for any fever -- call if over 100.4\u00B0F.'
    }];
  } else if(c.day<=14){
    tips=[{
      label:'Nadir zone -- day '+c.day,
      color:'var(--pu)',
      food:['High protein: chicken, eggs, cottage cheese','Cooked veg only','Avoid raw fruit/veg (infection risk)','Small frequent meals'],
      activity:'Keep it gentle -- mobility circuit only. No intense exertion.',
      watch:'Lowest immune point. No sick visitors. Wash hands constantly. Any fever = call team immediately.'
    }];
  } else {
    tips=[{
      label:'Building back -- day '+c.day,
      color:'var(--sg)',
      food:['More variety -- body can handle it','High calorie + high protein','Push fluids','Treat yourself if something sounds good'],
      activity:'Strength circuit is fair game if energy is there. Outdoor walk encouraged.',
      watch:'Counts coming back up. Great time to push movement a bit more.'
    }];
  }
  return tips;
}

function quickLogProc(type){
  var label=evLabel(type);
  var ev={id:Date.now(),date:TODAY,title:label,type:type,time:'',notes:''};
  S.events=(S.events||[]).concat(ev);
  if(type==='para'){
    var volStr=prompt('How many liters were drained? (e.g. 3.5)','');
    var vol=volStr&&parseFloat(volStr)>0?parseFloat(volStr):null;
    var base=new Date(TODAY+'T12:00:00');
    for(var wi=3;wi<=6;wi++){
      var wd=new Date(base);wd.setDate(wd.getDate()+wi);
      var wdt=wd.toISOString().split('T')[0];
      S.events.push({id:Date.now()+wi,date:wdt,title:'Tummy watch (day '+wi+')',type:'para-watch',time:'',notes:'Monitor for bloating.',soft:true});
    }
    confetti();toast('Para logged'+(vol?' -- '+vol+'L drained':'')+' -- watch days 3-6 added');
  } else if(type==='chemo'){
    localStorage.setItem('gk-lc',TODAY);recomputeCycleDates();
    confetti('big');toast('Chemo day logged! Cycle reset to today.');
  } else {
    toast(label+' logged');
  }
  saveEvents();R();
}

function exD(e){return e.dur||(e.r*3);}
function startWo(type){
  var ex=type==='mobility'?MOB:STR;

  S.woi=setInterval(tickWo,1000);R();
}
function beginEx(){if(!S.wo)return;S.wo.ph='work';S.wo.t=exD(S.wo.ex[S.wo.i]);R();}
function tickWo(){
  if(!S.wo||S.wo.ph==='ready') return;
  var w=S.wo;w.t--;
  if(w.t<=0){
    var e=w.ex[w.i];
    if(w.ph==='work'){
      if(e.s&&w.set<e.s){w.ph='rest';w.t=20;}
      else{w.i++;if(w.i>=w.ex.length){doneWo();return;}w.set=1;w.ph='ready';}
    } else {w.set++;w.ph='ready';}
  }
  R();
}
function doneWo(){
  clearInterval(S.woi);
  var dur=Math.round((Date.now()-S.wo.total)/60000),done=S.wo.ex.length,type=S.wo.type;
  S.wo=null;S.day=S.day||empty();
  S.day.wos=(S.day.wos||[]).concat({type:type,dur:dur,done:done});
  saveDay();R();
  confetti('big');toast(type==='mobility'?'Mobility done. Peepsqueak is so proud!':'Strength done. Peepsi is proud of those gains!');
}

var CONF_COLORS = ['#8956FF','#D2BFFF','#2ebfa5','#D4920A','#E8546A','#4A7DFF','#ffffff'];

function confetti(intensity){
  var n = intensity==='big' ? 80 : 40;
  var wrap = document.createElement('div');
  wrap.className = 'confetti-wrap';
  document.body.appendChild(wrap);
  for(var i=0;i<n;i++){
    (function(delay){
      setTimeout(function(){
        var p = document.createElement('div');
        p.className = 'cp';
        var color = CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)];
        var size = 6 + Math.random()*8;
        var isCircle = Math.random() > 0.6;
        var isRect = !isCircle && Math.random() > 0.5;
        p.style.cssText = 'left:'+Math.random()*100+'%;'
          +'width:'+(isRect?size*0.5:size)+'px;height:'+(isRect?size*1.8:size)+'px;'
          +'background:'+color+';'
          +'border-radius:'+(isCircle?'50%':'2px')+';'
          +'animation-duration:'+(1.4+Math.random()*1.2)+'s;'
          +'animation-delay:0s;';
        wrap.appendChild(p);
      }, delay);
    })(i * 18);
  }
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);}, 3200);
}

function vCal(){
  var now=new Date();
  if(!S.calMonth) S.calMonth={y:now.getFullYear(),m:now.getMonth()};
  var cy=S.calMonth.y,cm=S.calMonth.m;
  var firstDay=new Date(cy,cm,1),lastDay=new Date(cy,cm+1,0);
  var startDow=firstDay.getDay(); // 0=Sun
  var daysInMonth=lastDay.getDate();
  var NCD=NC.toISOString().split('T')[0];
  var monthName=firstDay.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Build 6-row grid
  var cells=[];
  for(var i=0;i<startDow;i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  var gridRows='';
  for(var r=0;r<cells.length/7;r++){
    var row='<div style="display:contents;">';
    for(var c=0;c<7;c++){

      var isToday=dtStr===TODAY;
      var isChemo=dtStr===NCD;
      var dm=S.calD[dtStr];
      var moods=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);

function logDemon(){
  if(selB===null){toast('Pick a Bristol type first');return;}
  S.day=S.day||empty();(S.day.demon=S.day.demon||[]).push({b:selB,tags:selT.slice()});
  var sb=selB,st=selT.slice();

  }

function vCarePortal(){
  var c=cycle(),d=S.day||empty(),moods=d.moods||[],lm=latestMood(d);
  var summaries=S.labSummaries||[];
  var latest=summaries.length?summaries[summaries.length-1]:null;

  // Mood trend last 7 days
  var moodRows='';
  var last7=[TODAY];
  for(var i=1;i<7;i++){var d2=new Date();d2.setDate(d2.getDate()-i);last7.push(d2.toISOString().split('T')[0]);}
  last7.reverse();
  var trendDots='';
  for(var i=0;i<last7.length;i++){
    var dt=last7[i],dm=dt===TODAY?d:(S.calD[dt]||null);
    if(dm===undefined) loadCalDay(dt);
    var ms=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);
    var avg=ms.length?Math.round(ms.reduce(function(s,m){return s+(m.mood||0);},0)/ms.length):null;
    var dayLabel=new Date(dt+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    trendDots+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">'
      +'<div style="width:12px;height:12px;border-radius:50%;background:'+(avg!=null?MC[avg]:'var(--div)')+';">'
      +'</div><div style="font-size:9px;color:var(--ink3);">'+dayLabel+'</div></div>';
  }

  // Today symptom snapshot
  var snap='';
  if(lm){
    var rows=[['Mood',lm.mood],['Nausea',lm.nausea],['Pain',lm.pain],['Energy',lm.energy]];
    var labels=[['Rough','Low','Okay','Good','Great'],['Bad','Medium','Mild','None'],['A lot','Some','A little','None'],['Empty','Low','Okay','Going']];
    for(var ri=0;ri<rows.length;ri++){
      var label=rows[ri][0],val=rows[ri][1];
      if(val==null) continue;
      var lset=labels[ri],lval=lset[val]||'';
      var color=ri===0?MC_color(val):ri===1?(val<=1?'var(--ro)':val===2?'var(--am)':'var(--sg)'):ri===2?(val<=1?'var(--ro)':val===2?'var(--am)':'var(--sg)'):(val<=1?'var(--ro)':val===2?'var(--am)':'var(--sg)');
      snap+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--div);">'
        +'<div style="font-size:13px;color:var(--ink2);">'+label+'</div>'
        +'<div style="font-size:13px;font-weight:700;color:'+color+';">'+lval+'</div>'
        +'</div>';
    }
  }

  return '<div class="fi" style="background:var(--bg);min-height:100vh;">'
    // Header
    +'<div style="padding:16px;background:var(--card);border-bottom:1px solid var(--div);display:flex;align-items:center;justify-content:space-between;">'
    +'<div>'
    +'<div style="font-family:var(--serif);font-size:20px;font-style:italic;color:var(--ink);">Care Team</div>'

    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">'

function saveLabSummary(){
  var el=document.getElementById('lab-text');
  if(!el||!el.value.trim()){toast('Nothing to save');return;}
  var entry={id:Date.now(),ts:new Date().toISOString(),text:el.value.trim()};
  S.labSummaries=(S.labSummaries||[]).concat(entry);
  lsSet('lab-summaries',S.labSummaries);
  S.addingLab=false;
  R();
  toast('Lab summary saved');
}
function deleteLabSummary(id){
  S.labSummaries=(S.labSummaries||[]).filter(function(s){return String(s.id)!==String(id);});
  lsSet('lab-summaries',S.labSummaries);
  R();
}

function friendlyCycleMsg(c){
  if(c.day<=3) return 'She\'s in her rest days -- extra love welcome';
  if(c.day<=7) return 'Early recovery -- things are slowly looking up';
  if(c.day<=14) return 'She\'s in her quiet week -- gentle support matters most';
  return 'She\'s building strength -- it\'s a good week';
}

function vMedsTracker(){
  var medList = getMedList();
  var checks  = lsGet('med-checks-'+TODAY) || {};
  var now     = new Date();
  var nowMin  = now.getHours()*60 + now.getMinutes();

  // Partition: scheduled meds into due-now / later / done
  // PRN meds always shown in their own section
  var dueMeds=[], laterMeds=[], doneMeds=[], prnMeds=[];

  for(var i=0;i<medList.length;i++){
    var m = medList[i];
    if(m.prn){ prnMeds.push(m); continue; }
    var done = !!checks['m'+m.id];
    if(done){ doneMeds.push(m); continue; }
    // Parse scheduled time to minutes
    var tMin = parseTimeMin(m.time);
    var windowMin = 90; // show as "due" within 90 min window
    if(tMin <= nowMin + windowMin){ dueMeds.push(m); }
    else { laterMeds.push(m); }
  }

  var html = '<div class="fi"><div class="ph">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;">'
    +'<div><div style="font-family:var(--serif);font-size:20px;font-style:italic;">Meds</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-top:1px;">'+now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>'
    +'</div>'
    +'<button onclick="S.editingMeds=!S.editingMeds;R()" style="background:none;border:1.5px solid var(--div);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;">'+(S.editingMeds?'Done':'Edit list')+'</button>'
    +'</div></div>';

  html += '<div class="px">';

  if(S.editingMeds){
    html += buildMedEditor(medList);
    html += '</div></div>';
    return html;
  }

  // ── DUE NOW ──────────────────────────────────────────
  if(dueMeds.length){
    html += '<div class="sec"><div class="lbl mb2" style="color:var(--ro);">Due now</div>';
    html += '<div class="card-flush mb3">';
    for(var i=0;i<dueMeds.length;i++) html += medRow(dueMeds[i], checks, false, 'due');
    html += '</div></div>';
  }

  // ── LATER TODAY ──────────────────────────────────────
  if(laterMeds.length){
    html += '<div class="sec"><div class="lbl mb2">Later today</div>';
    html += '<div class="card-flush mb3">';
    for(var i=0;i<laterMeds.length;i++) html += medRow(laterMeds[i], checks, false, 'later');
    html += '</div></div>';
  }

  // ── AS NEEDED (PRN) ──────────────────────────────────
  if(prnMeds.length){
    html += '<div class="sec"><div class="lbl mb2">As needed</div>';
    html += '<div class="card-flush mb3">';
    for(var i=0;i<prnMeds.length;i++) html += prnRow(prnMeds[i], checks);
    html += '</div></div>';
  }

  // ── TAKEN ────────────────────────────────────────────
  // Also add PRN taken entries from log
  var prnLog = lsGet('prn-log-'+TODAY) || [];
  if(doneMeds.length || prnLog.length){
    html += '<div class="sec"><div class="lbl mb2" style="color:var(--sg);">Taken today</div>';
    html += '<div class="card-flush mb3">';
    for(var i=0;i<doneMeds.length;i++) html += medRow(doneMeds[i], checks, true, 'done');
    for(var i=0;i<prnLog.length;i++){
      var entry = prnLog[i];
      html += '<div class="row" style="opacity:.6;">'
        +'<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid var(--div);">'
        +(entry.img?'<img src="'+entry.img+'" style="width:100%;height:100%;object-fit:cover;">':'<div style="width:100%;height:100%;background:var(--raised);"></div>')
        +'</div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:14px;font-weight:600;color:var(--ink3);">'+entry.name+'</div>'
        +'<div style="font-size:12px;color:var(--ink3);">Taken at '+fmtT(entry.ts)+(entry.nextOk?' · next ok '+fmtT(entry.nextOk):'')+'</div>'
        +'</div>'
        +'<div style="width:24px;height:24px;border-radius:50%;background:var(--sg);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ico('check',12,'#fff')+'</div>'
        +'</div>';
    }
    html += '</div></div>';
  }

  if(!dueMeds.length && !laterMeds.length && !prnMeds.length && !doneMeds.length && !prnLog.length){
    html += '<div class="empty-s mt5"><i class="fa-regular fa-pills"></i><div style="font-family:var(--serif);font-size:18px;color:var(--ink2);margin-bottom:8px;">No meds scheduled</div><div style="font-size:13px;color:var(--ink3);">Tap Edit list to add medications</div></div>';
  }

  html += '<div style="height:24px;"></div></div></div>';
  return html;
}

function medRow(m, checks, done, state){
  var borderTop = 'border-bottom:1px solid var(--div);';
  var img = PILL_IMGS[m.key] || null;
  var timeStr = m.time ? formatTimeStr(m.time) : '';
  return '<div class="row" style="cursor:pointer;'+(done?'opacity:.55;':'')+'" onclick="'+(done?'':'toggleMedCheck('+m.id+')')+'">'
    +'<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid var(--div);background:var(--raised);">'
    +(img?'<img src="'+img+'" style="width:100%;height:100%;object-fit:cover;">':'')
    +'</div>'
    +'<div style="flex:1;min-width:0;margin-left:2px;">'
    +'<div style="font-size:14px;font-weight:600;'+(done?'text-decoration:line-through;color:var(--ink3);':'color:var(--ink);')+'">'+m.name+'</div>'
    +'<div style="font-size:12px;color:var(--ink3);">'+m.dose+(timeStr?' · '+timeStr:'')+(m.notes?' · '+m.notes:'')+'</div>'
    +'</div>'
    +'<div style="width:28px;height:28px;border-radius:8px;border:2px solid '+(done?'var(--sg)':'var(--div)')+';background:'+(done?'var(--sg)':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;">'
    +(done?ico('check',14,'#fff'):'')
    +'</div>'
    +'</div>';
}

function prnRow(m, checks){
  var img = PILL_IMGS[m.key] || null;
  var prnLog = lsGet('prn-log-'+TODAY) || [];
  // Find most recent entry for this med
  var lastEntry = null;
  for(var i=prnLog.length-1;i>=0;i--){
    if(prnLog[i].id===m.id){ lastEntry=prnLog[i]; break; }
  }
  var canTake = true;
  var countdownStr = '';
  var lastStr = '';
  if(lastEntry){
    var lastMs = new Date(lastEntry.ts).getTime();
    var intervalMs = (m.intervalHours||4)*3600*1000;
    var nextMs = lastMs + intervalMs;
    var nowMs = Date.now();
    if(nowMs < nextMs){
      canTake = false;
      var diffMin = Math.ceil((nextMs - nowMs)/60000);
      var diffH = Math.floor(diffMin/60);
      var diffM = diffMin % 60;
      countdownStr = diffH>0 ? 'Available in '+diffH+'h '+(diffM>0?diffM+'m':'') : 'Available in '+diffM+'m';
    }
    lastStr = 'Last taken '+fmtT(lastEntry.ts);
  }

  return '<div class="row">'
    +'<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid var(--div);background:var(--raised);">'
    +(img?'<img src="'+img+'" style="width:100%;height:100%;object-fit:cover;">':'')
    +'</div>'
    +'<div style="flex:1;min-width:0;margin-left:2px;">'
    +'<div style="font-size:14px;font-weight:600;color:var(--ink);">'+m.name+'</div>'
    +'<div style="font-size:12px;color:'+(canTake?'var(--ink3)':'var(--am)')+';">'
    +(countdownStr||lastStr||('Every '+m.intervalHours+'h as needed'))
    +'</div>'
    +(m.notes?'<div style="font-size:11px;color:var(--ink3);">'+m.notes+'</div>':'')
    +'</div>'
    +(canTake
      ? '<button onclick="logPRN('+m.id+')" style="background:var(--pu);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px;">Took it</button>'
      : '<div style="font-size:11px;font-weight:700;color:var(--am);text-align:right;max-width:80px;line-height:1.3;">'+countdownStr+'</div>'
    )
    +'</div>';
}

// helpers
function parseTimeMin(t){
  if(!t) return 9999;
  var parts=t.split(':');
  return parseInt(parts[0])*60+(parseInt(parts[1])||0);
}
function formatTimeStr(t){
  if(!t) return '';
  var parts=t.split(':');
  var h=parseInt(parts[0]),m=parseInt(parts[1])||0,ap=h>=12?'PM':'AM';
  h=h%12||12;
  return h+':'+(m<10?'0'+m:m)+' '+ap;
}

  protonix:PILL_PROTONIX,
  cymbalta:PILL_CYMBALTA,
  zyprexa:PILL_ZYPREXA,
  haldol:PILL_HALDOL,
  dilaudid:PILL_DILAUDID,
  tylenol:PILL_TYLENOL,
  flexeril:PILL_FLEXERIL
};

function logPRN(id){
  var medList=getMedList();
  var m=null;
  for(var i=0;i<medList.length;i++){if(medList[i].id===id){m=medList[i];break;}}
  if(!m) return;
  var now=new Date();
  var nextOk=new Date(now.getTime()+(m.intervalHours||4)*3600000);
  var log=lsGet('prn-log-'+TODAY)||[];
  log.push({id:id,name:m.name,dose:m.dose,ts:now.toISOString(),nextOk:nextOk.toISOString(),img:PILL_IMGS[m.key]||null});
  lsSet('prn-log-'+TODAY,log);
  R();
  toast(m.name+' logged -- next ok at '+fmtT(nextOk.toISOString()));
}



function addMed(){
  var name=(document.getElementById('med-name')||{}).value||'';
  var dose=(document.getElementById('med-dose')||{}).value||'';
  var type=(document.getElementById('med-type')||{}).value||'scheduled';
  var time=(document.getElementById('med-time')||{}).value||'';
  var interval=parseInt((document.getElementById('med-interval')||{}).value||'4');
  var notes=(document.getElementById('med-notes')||{}).value||'';
  var key=(document.getElementById('med-key')||{}).value||'';
  if(!name.trim()){toast('Enter a medication name');return;}
  var list=getMedList();
  var newMed={id:Date.now(),name:name.trim(),dose:dose.trim()||'as directed',notes:notes.trim(),key:key};
  if(type==='prn'){newMed.prn=true;newMed.intervalHours=interval;newMed.time=null;}
  else{newMed.prn=false;newMed.time=time||'08:00';}
  list.push(newMed);
  lsSet('med-list',list);
  R();toast(name+' added');
}
function removeMed(id){
  var list=getMedList().filter(function(m){return m.id!==id;});
  lsSet('med-list',list);
  R();
}
function toggleMedCheck(id){
  var checks=lsGet('med-checks-'+TODAY)||{};
  checks['m'+id]=!checks['m'+id];
  lsSet('med-checks-'+TODAY,checks);
  R();
}

function vMedical(){
  var c=cycle(),d=S.day||empty(),moods=d.moods||[],lm=latestMood(d);
  var summaries=S.labSummaries||[];

  // 7-day trend dots
  var trendDots='<div style="display:flex;gap:4px;">';
  for(var i=6;i>=0;i--){
    var d2=new Date();d2.setDate(d2.getDate()-i);
    var dt=d2.toISOString().split('T')[0];
    var dm=dt===TODAY?d:(S.calD[dt]||null);
    if(dm===undefined) loadCalDay(dt);
    var ms=dm&&Array.isArray(dm.moods)?dm.moods:(dm&&dm.feel&&dm.feel.mood!=null?[{mood:dm.feel.mood}]:[]);
    var avg=ms.length?Math.round(ms.reduce(function(s,m){return s+(m.mood||0);},0)/ms.length):null;
    var dayLbl=new Date(dt+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    trendDots+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">'
      +'<div style="width:12px;height:12px;border-radius:50%;background:'+(avg!=null?MC[avg]:'var(--div)')+'"></div>'
      +'<div style="font-size:9px;color:var(--ink3);">'+dayLbl+'</div></div>';
  }
  trendDots+='</div>';

  // Snapshot
  var snap='';
  if(lm){
    var pairs=[['Mood',ML[lm.mood],MC_color(lm.mood)],['Nausea',lm.nausea!=null?['Bad','Medium','Mild','None'][lm.nausea]:null,lm.nausea!=null?(lm.nausea<=1?'var(--ro)':lm.nausea===2?'var(--am)':'var(--sg)'):null],['Pain',lm.pain!=null?['Bad','Medium','Mild','None'][lm.pain]:null,lm.pain!=null?(lm.pain<=1?'var(--ro)':lm.pain===2?'var(--am)':'var(--sg)'):null],['Energy',lm.energy!=null?['Empty','Low','Okay','Going'][lm.energy]:null,lm.energy!=null?(lm.energy<=1?'var(--ro)':lm.energy===2?'var(--am)':'var(--sg)'):null]];
    for(var i=0;i<pairs.length;i++){
      if(pairs[i][1]==null) continue;
      snap+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--div);"><div style="font-size:13px;color:var(--ink2);">'+pairs[i][0]+'</div><div style="font-size:13px;font-weight:700;color:'+pairs[i][2]+';">'+pairs[i][1]+'</div></div>';
    }
  }

  var html='<div class="fi"><div class="ph" style="background:var(--blue-l,#eaefff);">'
    +'<div style="font-family:var(--serif);font-size:20px;font-style:italic;">Medical View</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-top:2px;">Care team only</div></div>'
    +'<div class="px mt4">';

  // Cycle
  html+=vCycleBanner(c);

  // Trend
  html+='<div class="card mb3"><div class="lbl mb3">7-day mood trend</div>'+trendDots
    +'<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">'+ML.map(function(l,i){return '<span style="display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--ink3);"><span style="width:7px;height:7px;border-radius:50%;background:'+MC[i]+';display:inline-block;"></span>'+l+'</span>';}).join('')+'</div></div>';

  // Today snapshot
  if(snap) html+='<div class="card mb3"><div class="lbl mb2">Today&#39;s snapshot</div>'+(lm&&lm.ts?'<div style="font-size:11px;color:var(--ink3);margin-bottom:8px;">Last check-in: '+fmtT(lm.ts)+'</div>':'')+'<div>'+snap+'</div></div>';

  // Stats row
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">'
    +[['Meds',(d.meds&&d.meds.am&&d.meds.pm)?'Both done':((d.meds&&(d.meds.am||d.meds.pm))?'Partial':'None'),(d.meds&&d.meds.am&&d.meds.pm)?'var(--sg)':'var(--am)'],['Sippin',(d.hyd||0)+'/8 glasses',(d.hyd||0)>=8?'var(--sg)':(d.hyd||0)>=4?'var(--am)':'var(--ink3)'],['Movement',(d.move&&d.move.laps?d.move.laps+' lap'+(d.move.laps!==1?'s':''):'')+(d.move&&d.move.out?' + outside':'')||'None',(d.move&&(d.move.laps>=2||d.move.out))?'var(--sg)':'var(--ink3)']].map(function(row){return '<div style="background:var(--card);border-radius:10px;border:1px solid var(--div);padding:10px 12px;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:4px;">'+row[0]+'</div><div style="font-size:13px;font-weight:700;color:'+row[2]+';line-height:1.3;">'+row[1]+'</div></div>';}).join('')
    +'</div>';

  // Lab summaries
  html+='<div class="card-flush mb3"><div style="padding:14px 16px;border-bottom:1px solid var(--div);display:flex;align-items:center;justify-content:space-between;">'
    +'<div class="lbl">Lab Summary</div>'
    +'<button onclick="S.addingLab=!S.addingLab;R()" style="background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--pu);">'+(S.addingLab?'Cancel':'+ Add update')+'</button></div>';

  if(S.addingLab){
    html+='<div style="padding:14px 16px;border-bottom:1px solid var(--div);background:var(--raised);">'
      +'<div style="font-size:12px;color:var(--ink2);margin-bottom:8px;line-height:1.6;">Use this Claude prompt with Kendra&#39;s lab screenshot, then paste the summary here:</div>'
      +'<div style="font-family:monospace;font-size:11px;color:var(--ink3);background:var(--bg);padding:8px 10px;border-radius:6px;line-height:1.7;margin-bottom:12px;">I&#39;m uploading lab results for Kendra, a 34-year-old woman with peritoneal EHE on Gemcitabine + Docetaxel. She has a PICC-associated DVT, low albumin, and is on methadone for pain. Summarize in 3 sections: (1) What&#39;s flagged -- plain English; (2) What this week will likely feel like; (3) How to support her right now -- 3-5 specific actionable things. Warm, direct, no jargon without explanation.</div>'
      +'<textarea class="inp mb3" id="lab-text" rows="6" placeholder="Paste summary here..." style="height:120px;font-size:13px;"></textarea>'
      +'<button class="btn btn-ink btn-sm" onclick="saveLabSummary()">'+ico('check',14)+' Save</button>'
      +'</div>';
  }

  if(!summaries.length&&!S.addingLab){
    html+='<div style="padding:24px 16px;text-align:center;font-size:13px;color:var(--ink3);">No lab summaries yet</div>';
  } else {
    var shown=[].concat(summaries).reverse().slice(0,5);
    for(var i=0;i<shown.length;i++){
      var s=shown[i];
      html+='<div style="padding:14px 16px;'+(i>0?'border-top:1px solid var(--div);':'')+'">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
        +'<div style="font-size:12px;font-weight:700;color:var(--ink2);">'+new Date(s.ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div>'
        +'<button onclick="deleteLabSummary('+s.id+')" style="background:none;border:none;cursor:pointer;color:var(--ink3);">'+ico('xmark',13)+'</button>'
        +'</div>'
        +'<div style="font-size:13px;color:var(--ink);line-height:1.7;white-space:pre-wrap;">'+s.text+'</div>'
        +'</div>';
    }
  }
  html+='</div>';
  html+='<div style="height:24px;"></div></div></div>';
  return html;
}

async function init(){
  try{
    var saved=localStorage.getItem('gk-u');
    if(!saved){try{if(window.storage){var wu=await window.storage.get('gk-u',false);if(wu)saved=wu.value;}}catch(e){}}
    if(saved){try{S.user=JSON.parse(saved);if(S.user&&S.user.role)S.role=S.user.role;}catch(e){}}
    R();
    await loadAll();
    S.v=S.user?'app':'pw';
    R();
  }catch(e){
    console.error('Init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif;text-align:center;max-width:400px;margin:0 auto;">'
      +'<div style="font-size:32px;margin-bottom:16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>'
      +'<div style="font-size:18px;font-weight:600;margin-bottom:8px;">Something went wrong</div>'
      +'<div style="font-size:14px;color:#666;">'+e.message+'</div></div>';
  }
}
init();
// Refresh meds screen every 30s for countdown updates
setInterval(function(){if(S.tab==='meds'&&S.v==='app')R();},30000);

}</script>
