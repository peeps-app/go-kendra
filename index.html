<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Go Kendra">
<title>Go Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ── DESIGN TOKENS ─────────────────────────────────── */
:root {
  /* Spacing — 4/8/12/16/24/32/48 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* Radius */
  --r1:6px; --r2:10px; --r3:16px; --r4:24px; --rp:9999px;
  /* Ink */
  --ink:#1a0f2e; --ink-2:#4a3f5c; --ink-3:#8b7fa0; --ink-4:#c0b8d0;
  /* Surface */
  --bg:#f8f5f2; --card:#fff; --raised:#f3f0f9; --divider:rgba(90,60,150,.09);
  /* Brand */
  --purple:#7c5cdb; --purple-d:#5e3fbf; --purple-l:#ede8f9; --purple-m:#d8cff5;
  /* Accents */
  --teal:#2ebfa5; --teal-l:#e4f7f4;
  --amber:#c9920a; --amber-l:#fdf5e0;
  --rose:#c95068; --rose-l:#faedf0;
  --blue:#4a7dff; --blue-l:#eaefff;
  --sage:#4a8c6f; --sage-l:#e8f4ee;
  /* Mood palette — index 0-4 */
  --m0:#c95068; --m0l:#faedf0;   /* Rough */
  --m1:#c9920a; --m1l:#fdf5e0;   /* Low   */
  --m2:#7b8fa8; --m2l:#edf0f4;   /* Okay  */
  --m3:#2ebfa5; --m3l:#e4f7f4;   /* Good  */
  --m4:#4a8c6f; --m4l:#e8f4ee;   /* Great */
  /* Shadows */
  --sh1:0 1px 3px rgba(26,15,46,.06),0 4px 14px rgba(26,15,46,.04);
  --sh2:0 4px 20px rgba(26,15,46,.10),0 1px 4px rgba(26,15,46,.06);
  --sh3:0 12px 40px rgba(26,15,46,.14),0 2px 8px rgba(26,15,46,.08);
  /* Type */
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --emoji:'Noto Emoji',sans-serif;
}

/* ── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer}
input,textarea{font-family:var(--sans)}

/* ── SHELL ─────────────────────────────────────────── */
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px}

/* ── TYPOGRAPHY ────────────────────────────────────── */
.t-hero   {font-family:var(--serif);font-size:32px;font-weight:400;font-style:italic;letter-spacing:-.3px;line-height:1.1}
.t-title  {font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.2}
.t-head   {font-family:var(--serif);font-size:18px;font-weight:400;line-height:1.3}
.t-label  {font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink-3)}
.t-body   {font-size:15px;line-height:1.6}
.t-small  {font-size:13px;line-height:1.5}
.t-micro  {font-size:11px;font-weight:500;line-height:1.4}
.t-num    {font-family:var(--serif);font-size:48px;font-weight:400;letter-spacing:-1px;line-height:1}
.t-muted  {color:var(--ink-2)}
.t-faint  {color:var(--ink-3)}
.t-noto   {font-family:var(--emoji)}

/* ── CARDS ─────────────────────────────────────────── */
.card       {background:var(--card);border-radius:var(--r3);border:1px solid var(--divider);padding:var(--s4);box-shadow:var(--sh1);margin-bottom:var(--s3)}
.card-flush {background:var(--card);border-radius:var(--r3);border:1px solid var(--divider);overflow:hidden;box-shadow:var(--sh1);margin-bottom:var(--s3)}
.card-tinted{background:var(--raised);border-radius:var(--r3);border:1px solid var(--divider);padding:var(--s4);margin-bottom:var(--s3)}
.card-row   {display:flex;align-items:center;padding:var(--s3) var(--s4);border-bottom:1px solid var(--divider);gap:var(--s3)}
.card-row:last-child{border-bottom:none}
.row-div    {border-bottom:1px solid var(--divider)}

/* ── BUTTONS ────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:50px;border:none;border-radius:var(--rp);padding:0 var(--s5);font-size:15px;font-weight:600;transition:transform .12s,opacity .12s;user-select:none;white-space:nowrap;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary  {background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-2)}
.btn-secondary{background:var(--purple-l);color:var(--purple-d);border:1.5px solid var(--purple-m)}
.btn-outline  {background:var(--card);color:var(--ink);border:1.5px solid var(--divider)}
.btn-outline:hover{border-color:var(--ink-3)}
.btn-teal {background:var(--teal);color:#fff}
.btn-sm   {min-height:40px;padding:0 var(--s4);font-size:13px}
.btn-auto {width:auto}
.btn-icon {width:48px;height:48px;min-height:unset;padding:0;border-radius:var(--r2)}

/* ── INPUTS ─────────────────────────────────────────── */
.input{width:100%;height:50px;padding:0 var(--s4);background:var(--bg);border:1.5px solid rgba(90,60,150,.18);border-radius:var(--r2);font-size:15px;color:var(--ink);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--purple);background:var(--card)}
.input-pw{height:50px}
textarea.input{height:auto;padding:var(--s3) var(--s4);resize:none}

/* ── MOOD PALETTE HELPERS ────────────────────────────── */
.mood-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mood-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--rp);font-size:12px;font-weight:600}

/* ── MOOD SELECTOR ───────────────────────────────────── */
.mood-sel   {display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.mood-opt   {flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s3) var(--s1);border-radius:var(--r3);border:2px solid var(--divider);background:var(--card);cursor:pointer;transition:all .15s;min-height:76px;justify-content:center}
.mood-opt .dot{width:20px;height:20px;border-radius:50%;transition:all .15s}
.mood-opt .lbl{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.3px}
.mood-opt.on  {border-color:var(--mc,var(--purple))}
.mood-opt.on .dot{width:24px;height:24px;box-shadow:0 0 0 4px rgba(0,0,0,.08)}
.mood-opt.on .lbl{color:var(--mc,var(--purple));font-weight:700}

/* ── TOGGLE ─────────────────────────────────────────── */
.tog{position:relative;width:52px;height:30px;flex-shrink:0;cursor:pointer}
.tog input{opacity:0;width:0;height:0}
.tog-track{position:absolute;inset:0;background:#ddd;border-radius:var(--rp);transition:.25s}
.tog-track::before{content:"";position:absolute;width:24px;height:24px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input:checked+.tog-track{background:var(--purple)}
input:checked+.tog-track::before{transform:translateX(22px)}

/* ── BOTTOM NAV ──────────────────────────────────────── */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--divider);display:flex;z-index:100;padding:8px 0 env(safe-area-inset-bottom,14px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:8px 4px;font-size:11px;font-weight:600;color:var(--ink-3);transition:color .15s;min-height:48px;justify-content:center;letter-spacing:.3px}
.nb.on{color:var(--purple)}
.nb i{font-size:19px;line-height:1}
.nb.on i{color:var(--purple)}

/* ── PAGE HEADER ─────────────────────────────────────── */
.ph{padding:var(--s4) var(--s4) var(--s3);background:var(--card);border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:50}

/* ── SECTION HEADER ──────────────────────────────────── */
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}

/* ── TIMELINE ────────────────────────────────────────── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:var(--s3);padding:var(--s3) 0;position:relative}
.tl-item::before{content:"";position:absolute;left:15px;top:40px;bottom:-12px;width:1px;background:var(--divider)}
.tl-item:last-child::before{display:none}
.tl-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.tl-body{flex:1;min-width:0}
.tl-time{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.5px;margin-bottom:2px}
.tl-label{font-size:14px;font-weight:600;margin-bottom:2px}
.tl-sub{font-size:12px;color:var(--ink-2)}

/* ── STAT TILES ──────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.stat-tile{background:var(--card);border-radius:var(--r2);border:1px solid var(--divider);padding:var(--s3) var(--s2);text-align:center;box-shadow:var(--sh1)}
.stat-tile .ico{font-size:18px;color:var(--ink-3);margin-bottom:var(--s1);display:block}
.stat-tile .val{font-size:16px;font-weight:700;color:var(--ink);display:block}
.stat-tile .sub{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-top:1px}
.stat-tile.done .ico,.stat-tile.done .val{color:var(--purple)}

/* ── CYCLE BANNER ────────────────────────────────────── */
.cycle-banner{border-radius:var(--r2);padding:var(--s3) var(--s4);margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s3)}
.cycle-bar{height:4px;border-radius:var(--rp);background:rgba(0,0,0,.12);overflow:hidden;flex:1}
.cycle-fill{height:100%;border-radius:var(--rp);background:rgba(255,255,255,.8);transition:width .4s}

/* ── PROG BAR ────────────────────────────────────────── */
.prog{height:4px;border-radius:var(--rp);background:var(--raised);overflow:hidden;margin-top:var(--s1)}
.prog-f{height:100%;border-radius:var(--rp);transition:width .4s}

/* ── CHECK-IN OVERLAY ────────────────────────────────── */
#cin-overlay{position:fixed;inset:0;background:rgba(26,15,46,.45);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;max-width:430px;left:50%;transform:translateX(-50%)}
#cin-sheet{background:var(--card);border-radius:var(--r4) var(--r4) 0 0;padding:var(--s4) var(--s4) calc(var(--s7) + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}

/* ── SCROLL TABS ─────────────────────────────────────── */
.stabs{display:flex;overflow-x:auto;gap:var(--s2);padding:var(--s3) var(--s4);scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--divider)}
.stabs::-webkit-scrollbar{display:none}
.stab{height:34px;padding:0 var(--s4);border-radius:var(--rp);border:1.5px solid var(--divider);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2);flex-shrink:0;transition:all .15s}
.stab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* ── FOOD PILLS ──────────────────────────────────────── */
.f-pills{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.f-pill{height:38px;padding:0 var(--s3);border-radius:var(--rp);border:1.5px solid var(--divider);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--ink)}
.f-pill:active{transform:scale(.95)}

/* ── BRISTOL ──────────────────────────────────────────── */
.bristol-g{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.b-btn{padding:var(--s2) var(--s1);border-radius:var(--r2);border:1.5px solid var(--divider);background:var(--card);cursor:pointer;text-align:center;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s}
.b-btn.on{border-color:#a0522d;background:#fdf5ef}
.b-num{font-family:var(--serif);font-size:20px;color:#a0522d}
.b-lbl{font-size:10px;color:var(--ink-2);font-weight:600;line-height:1.2}

/* ── DROP BUBBLES (hydration) ─────────────────────────── */
.drops{display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:center;margin:var(--s4) 0}
.drop{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;border-radius:50%;opacity:.2}
.drop.on{opacity:1;background:var(--teal-l)}
.drop i{font-size:20px;color:var(--teal)}
.drop:active{transform:scale(.85)}

/* ── CALENDAR ─────────────────────────────────────────── */
.cal-strip{display:flex;overflow-x:auto;gap:var(--s2);padding:4px 2px var(--s2);scrollbar-width:none}
.cal-strip::-webkit-scrollbar{display:none}
.cal-day{min-width:56px;border-radius:var(--r2);padding:var(--s2) var(--s1);text-align:center;border:1.5px solid var(--divider);background:var(--card);cursor:pointer;flex-shrink:0;transition:all .15s}
.cal-day.today{border-color:var(--purple);background:var(--purple-l)}
.cal-day.has{border-color:var(--teal)}
.cal-day.chemo{border-color:var(--rose);background:var(--rose-l)}
.cal-dots{display:flex;justify-content:center;gap:3px;margin-top:4px}
.cal-dot{width:5px;height:5px;border-radius:50%}

/* ── SPARKLINE ────────────────────────────────────────── */
.sparkline{overflow:visible}

/* ── CHIPS ────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;height:38px;padding:0 var(--s4);border-radius:var(--rp);border:1.5px solid var(--divider);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink-2)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chip:active{transform:scale(.95)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ── WORKOUT ──────────────────────────────────────────── */
.wo-fs{min-height:calc(100vh - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s6) var(--s4);text-align:center;color:#fff;position:relative}
.timer-ring{width:180px;height:180px;border-radius:50%;border:6px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.1);margin:var(--s5) auto}
.timer-t{font-family:var(--serif);font-size:52px;line-height:1;letter-spacing:-1px}
.timer-l{font-size:12px;opacity:.7;font-weight:600;margin-top:4px}
.wo-prog{width:100%;height:3px;background:rgba(255,255,255,.25);border-radius:var(--rp);overflow:hidden;margin-bottom:var(--s5)}
.wo-pf{height:100%;background:#fff;border-radius:var(--rp);transition:width .4s}

/* ── BADGE GRID ───────────────────────────────────────── */
.badge-g{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.badge-c{border-radius:var(--r3);padding:var(--s4);border:1.5px solid var(--divider);text-align:center;background:var(--card)}
.badge-c.earned{border-color:var(--amber);background:var(--amber-l)}

/* ── CHEER CARD ───────────────────────────────────────── */
.cheer-c{background:var(--purple-l);border-radius:var(--r3);padding:var(--s4);margin-bottom:var(--s3);border:1px solid var(--purple-m)}

/* ── EMPTY STATE ──────────────────────────────────────── */
.empty{text-align:center;padding:var(--s7) var(--s4)}
.empty i{font-size:36px;color:var(--ink-4);margin-bottom:var(--s3);display:block}
.empty .et{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-bottom:var(--s2)}
.empty .es{font-size:13px;color:var(--ink-3)}

/* ── LAYOUT HELPERS ───────────────────────────────────── */
.px{padding-left:var(--s4);padding-right:var(--s4)}
.sec{margin-top:var(--s5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.flex{display:flex}.fca{align-items:center}.fjb{justify-content:space-between}.gap2{gap:var(--s2)}.gap3{gap:var(--s3)}
.mt1{margin-top:var(--s1)}.mt2{margin-top:var(--s2)}.mt3{margin-top:var(--s3)}.mt4{margin-top:var(--s4)}.mt5{margin-top:var(--s5)}
.mb1{margin-bottom:var(--s1)}.mb2{margin-bottom:var(--s2)}.mb3{margin-bottom:var(--s3)}.mb4{margin-bottom:var(--s4)}
.w-full{width:100%}

/* ── ANIMATIONS ───────────────────────────────────────── */
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.fade-in{animation:fadeIn .22s ease}
#cin-sheet{animation:slideUp .28s cubic-bezier(.34,1.56,.64,1)}

/* ── TOAST ────────────────────────────────────────────── */
#toast{position:fixed;top:var(--s5);left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;border-radius:var(--rp);padding:var(--s3) var(--s5);font-size:14px;font-weight:500;z-index:1000;white-space:nowrap;display:none;box-shadow:var(--sh3)}
#toast.show{display:block;animation:toastIn 2.8s ease forwards}

/* ── PEEP AVATAR ──────────────────────────────────────── */
.peep{border-radius:50%;object-fit:cover;display:block}
.peep-ph{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="nav" style="display:none">
  <button class="nb" data-t="home" onclick="go('home')"><i class="fa-regular fa-house"></i>Today</button>
  <button class="nb" data-t="log"  onclick="go('log')"><i class="fa-regular fa-clipboard-list"></i>Log</button>
  <button class="nb" data-t="train"onclick="go('train')"><i class="fa-regular fa-dumbbell"></i>Train</button>
  <button class="nb" data-t="cal"  onclick="go('cal')"><i class="fa-regular fa-calendar-days"></i>Calendar</button>
  <button class="nb" data-t="squad"onclick="go('squad')"><i class="fa-regular fa-users"></i>Squad</button>
</div>

function empty(){return{meds:{am:false,pm:false},moods:[],food:[],demon:[],hyd:0,move:{laps:0,dist:'',out:false},wos:[],notes:''};}
// Support legacy feel object → moods array
function getMoods(day){
  if(!day) return [];
  if(Array.isArray(day.moods)) return day.moods;
  if(day.feel && day.feel.mood!=null){
    return [{id:1,ts:TODAY+'T12:00:00',mood:day.feel.mood,nausea:day.feel.nausea,pain:day.feel.pain,energy:day.feel.energy,notes:''}];
  }
  return [];
}
function latestMood(day){ const m=getMoods(day); return m.length?m[m.length-1]:null; }
function moodColor(idx){ return(idx!=null&&idx>=0&&idx<=4)?MC[idx]:'var(--ink-3)'; }
function moodBg(idx){    return(idx!=null&&idx>=0&&idx<=4)?MCL[idx]:'var(--raised)'; }
function moodLabel(idx){ return(idx!=null&&idx>=0&&idx<=4)?ML[idx]:'—'; }
function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts);
  let h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+(m<10?'0'+m:m)+' '+ap;
}

// ═══ CYCLE ═════════════════════════════════════════════
function cycle(){
  const now=new Date(),day=Math.floor((now-LC)/86400000)+1,tot=Math.floor((NC-LC)/86400000),dtn=Math.ceil((NC-now)/86400000),pct=Math.min(100,Math.round(day/tot*100));
  let zone,zc,msg,bg;
  if(day<=3){zone='Rough Zone';zc='#c95068';msg='Post-chemo roughies — nausea may peak. Be gentle today.';bg='#faedf0';}
  else if(day<=7){zone='Early Recovery';zc='#c9920a';msg='Still bumpy but trending up. Counts dropping — watch for fever.';bg='#fdf5e0';}
  else if(day<=14){zone='Nadir Zone';zc='#7c5cdb';msg='Counts at their lowest. No sick visitors. Watch for fever over 100.4°F.';bg='#ede8f9';}
  else{zone='Building Back';zc='#4a8c6f';msg='Counts coming back up. Body is doing the thing.';bg='#e8f4ee';}
  return{day,tot,dtn,pct,zone,zc,msg,bg};
}

// ═══ SMART TIPS ════════════════════════════════════════
function moodTip(){
  const d=S.day||empty(),m=latestMood(d),c=cycle();
  if(!m||m.mood==null) return null;
  const nadir=c.day>=7&&c.day<=14,rough=m.mood<=1||(m.nausea!=null&&m.nausea<=1),great=m.mood>=3;
  if(rough&&nadir) return{t:'Rest day — nadir zone',b:"Counts are lowest. Rest is the right call. A slow walk to the hall and back is plenty.",a:[{l:'Log movement',fn:"go('log');S.lt='move';R()"}]};
  if(rough)        return{t:'Rough one today',b:"Rest is valid. If nausea eases, a couple of slow laps can help gut motility.",a:[{l:'Log movement',fn:"go('log');S.lt='move';R()"}]};
  if(great&&!nadir)return{t:'Good energy — take the window',b:"A full circuit or outside walk will feel good. Take advantage of days like this.",a:[{l:'Start training',fn:"go('train')"},{l:'Log a walk',fn:"go('log');S.lt='move';R()"}]};
  return null;
}

async function saveCin(){
  if(S.cinD.mood===null) return;
  S.day=S.day||empty();
  if(!Array.isArray(S.day.moods)) S.day.moods=getMoods(S.day);
  const entry={id:Date.now(),ts:new Date().toISOString(),mood:S.cinD.mood,nausea:S.cinD.nausea,pain:S.cinD.pain,energy:S.cinD.energy,notes:S.cinD.notes};

  await saveDay();S.cin=false;R();

function calV(){
  const c=cycle(),NCD=NC.toISOString().split('T')[0],days=[];
  for(let i=0;i<c.tot;i++){const d2=new Date(LC);d2.setDate(d2.getDate()+i);const dt=d2.toISOString().split('T')[0];days.push({dt,lbl:d2.toLocaleDateString('en-US',{month:'short',day:'numeric'}),dn:i+1,tod:dt===TODAY,chm:dt===NCD});loadCalDay(dt);}
  const sel=S.cd||TODAY,sd=S.calD[sel];

    const dm=S.calD[d2.dt];

    '<div class="cal-dots">'+
    (dm&&dm.meds&&dm.meds.am?'<div class="cal-dot" style="background:var(--purple);"></div>':'')+
    (avg!=null?'<div class="cal-dot" style="background:'+dotColor+';"></div>':'')+

    (selMoods.length?

      '<div class="tl-dot" style="background:'+moodBg(m.mood)+'"><i class="fa-regular '+MI[m.mood]+'" style="font-size:13px;color:'+moodColor(m.mood)+';"></i></div>'+
      '<div class="tl-body"><div class="tl-time">'+fmtTime(m.ts)+'</div>'+
      '<div class="tl-label" style="color:'+moodColor(m.mood)+';">'+moodLabel(m.mood)+'</div>'+
      (m.notes?'<div class="tl-sub" style="font-style:italic;">"'+m.notes+'"</div>':'')+
      '</div></div>').join('')+'</div>':
      (f.mood!=null?'<div style="font-size:14px;margin-bottom:var(--s2);"><span style="font-weight:600;">Mood:</span> '+ML[f.mood]+'</div>':'<div style="font-size:14px;color:var(--ink-3);">No mood logs this day</div>')+
      ((sd.food||[]).length?'<div style="font-size:14px;margin-bottom:var(--s2);"><span style="font-weight:600;">Food:</span> '+sd.food.map(x=>x.item).join(', ')+'</div>':'')+

  } else {
    dayDetail='<div class="empty mt3"><i class="fa-regular fa-moon"></i><div class="et">Nothing logged this day</div></div>';
  }

  return '<div class="fade-in"><div class="ph">'+
  '<div style="font-family:var(--serif);font-size:20px;font-style:italic;">Cycle Calendar</div>'+
  '<div style="font-size:12px;color:var(--ink-3);margin-top:2px;">Day '+c.day+' of '+c.tot+' · next infusion in '+c.dtn+' days</div></div>'+
  '<div style="padding:var(--s3) var(--s4) 0;">'+
  '<div class="cal-strip">'+strip+'</div>'+

function go(tab){S.tab=tab;S.lt='food';R();}

function doExport(){
  const d=S.day||empty(),c=cycle(),moods=getMoods(d),lm=latestMood(d);
  const date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const lines=['KENDRA DAILY LOG — '+date,'Cycle Day '+c.day+' of '+c.tot+' ('+c.zone+')','','Meds: AM '+(d.meds?.am?'Done':'Not done')+' | PM '+(d.meds?.pm?'Done':'Not done')];
  if(moods.length){lines.push('');lines.push('Mood check-ins ('+moods.length+'x):');moods.forEach(m=>{lines.push('  · '+fmtTime(m.ts)+' — '+moodLabel(m.mood)+(m.nausea!=null?' · Nausea: '+['Bad','Medium','Mild','None'][m.nausea]:'')+(m.pain!=null?' · Pain: '+['Bad','Medium','Mild','None'][m.pain]:'')+(m.notes?' · "'+m.notes+'"':''));});}
  if((d.food||[]).length){lines.push('');lines.push('Food ('+d.food.length+' nibbles):');d.food.forEach(f=>lines.push('  · '+f.item+' — '+(f.kd===true?'kept':f.kd===false?'lost':'untacked')));}
  lines.push('Hydration: '+(d.hyd||0)+' glasses');
  if((d.demon||[]).length){lines.push('');lines.push('Bowel movements ('+d.demon.length+'x):');d.demon.forEach(de=>{const b=BRISTOL.find(x=>x.n===de.b);lines.push('  · Bristol '+de.b+' ('+(b?.l||'?')+') — '+((de.tags||[]).join(', ')||'no tags'));});}
  const mv=d.move||{};if(mv.laps)lines.push('Laps: '+mv.laps);if(mv.dist)lines.push('Distance: '+mv.dist);if(mv.out)lines.push('Went outside: yes');
  if((d.wos||[]).length)lines.push('Training: '+d.wos.map(w=>w.type+' ('+w.dur+'m)').join(', '));
  if(d.notes)lines.push('\nNotes: '+d.notes);
  const txt=lines.join('\n');
  const el=document.getElementById('exp-out');
  if(el){el.style.display='block';el.innerHTML='<div style="background:var(--raised);border-radius:var(--r2);padding:var(--s4);border:1.5px dashed var(--divider);font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:monospace;color:var(--ink);margin-bottom:var(--s3);">'+txt+'</div><button class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent).then(()=>toast('Copied!'))"><i class="fa-regular fa-copy"></i> Copy to clipboard</button>';}
}

function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

// ═══ INIT ═══════════════════════════════════════════════
async function init(){
  const saved=localStorage.getItem('gk-u');if(saved){try{S.user=JSON.parse(saved);}catch{}}
  R();await loadAll();S.v=S.user?'app':'pw';R();
}
init();
</script>
